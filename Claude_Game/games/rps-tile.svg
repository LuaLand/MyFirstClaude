<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 메인 화면 타일용 그림: 공책 바탕 + 가위·바위·보 낙서 (글자는 메인 화면에서 올림) -->
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <pattern id="rule" width="200" height="22" patternUnits="userSpaceOnUse"><rect width="200" height="22" fill="#FFFEF7"/><path d="M0 21.5 H200" stroke="#C9DCEF" stroke-width="1.2"/></pattern>
  </defs>
  <rect width="200" height="200" fill="url(#rule)"/>
  <path d="M30 0 V200" stroke="#F1A7A0" stroke-width="2"/>
  <g fill="#E2D2B2"><circle cx="13" cy="30" r="5"/><circle cx="13" cy="74" r="5"/><circle cx="13" cy="118" r="5"/><circle cx="13" cy="162" r="5"/></g>
  <g filter="url(#rough)" stroke="#27314F" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- 가위 -->
    <g transform="translate(36 100) scale(.56) rotate(-10 50 50)">
      <path fill="#E9EEF5" d="M41 63 L60 11 Q64 12 63 18 L48 65 Z"/>
      <path fill="#E9EEF5" d="M59 63 L40 11 Q36 12 37 18 L52 65 Z"/>
      <ellipse fill="#F47C6B" cx="33" cy="76" rx="14" ry="11" transform="rotate(-18 33 76)"/>
      <ellipse fill="#F47C6B" cx="67" cy="76" rx="14" ry="11" transform="rotate(18 67 76)"/>
      <circle fill="#27314F" stroke="none" cx="50" cy="41" r="3.6"/>
    </g>
    <!-- 바위 -->
    <g transform="translate(86 112) scale(.56)">
      <path fill="#C9C2B5" d="M16 70 Q12 50 28 38 Q36 20 58 24 Q80 26 86 48 Q92 68 76 78 Q56 88 34 84 Q18 81 16 70 Z"/>
      <path fill="none" d="M40 40 Q47 48 43 58 M64 50 L72 57 M30 66 Q36 64 38 70"/>
    </g>
    <!-- 보 -->
    <g transform="translate(136 98) scale(.56) rotate(8 50 50)">
      <path fill="#FFFFFF" d="M22 12 H64 L80 28 V88 H22 Z"/>
      <path fill="none" d="M64 12 V28 H80"/>
      <path fill="none" stroke="#9AB8DA" d="M30 42 H72 M30 54 H72 M30 66 H62"/>
    </g>
  </g>
  <!-- 빨간 펜 동그라미 -->
  <path d="M104 106 C128 104 140 120 136 136 C132 156 110 166 92 160 C74 154 70 132 80 118 C88 108 100 104 114 108" fill="none" stroke="#DE3E2E" stroke-width="3.5" stroke-linecap="round"/>
</svg>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미니게임 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 게임기 홈 화면 — 밝은 바탕 + 큰 정사각 타일 + 선택 링 */
  :root {
    --bg: #E9ECF1;      --bg-2: #F5F6F9;
    --surface: #FFFFFF; --line: #D3D8E1;
    --ink: #1B1D24;     --ink-soft: #5B6170;  --ink-faint: #8C92A0;
    --ring: #12B5E8;    --ring-glow: rgba(18,181,232,.35);
    --pink: #FF3D8B;    --yellow: #FFE14D;    --tile-ink: #17121C;

    --cap: "Black Han Sans", "Pretendard Variable", system-ui, sans-serif;
    --body: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --tile: clamp(148px, 30vw, 216px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1D23;      --bg-2: #24272F;
      --surface: #2B2F38; --line: #3A3F4B;
      --ink: #F1F3F7;     --ink-soft: #A9AFBC;  --ink-faint: #7C8290;
      --ring: #3CCBF4;    --ring-glow: rgba(60,203,244,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1D23;      --bg-2: #24272F;
    --surface: #2B2F38; --line: #3A3F4B;
    --ink: #F1F3F7;     --ink-soft: #A9AFBC;  --ink-faint: #7C8290;
    --ring: #3CCBF4;    --ring-glow: rgba(60,203,244,.3);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    font-family: var(--body); color: var(--ink);
    background: linear-gradient(180deg, var(--bg-2), var(--bg) 60%);
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  svg.i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .wrap { width: 100%; max-width: 980px; margin: 0 auto; padding: 0 16px; }

  /* ---------- 상단: 프로필 + 시계 ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 22px; }
  .profile { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .avatar {
    flex: none; width: 56px; height: 56px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--yellow); color: var(--tile-ink);
    box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--line);
  }
  .avatar svg { width: 34px; height: 34px; stroke-width: 2; }
  .who { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .who-line { display: flex; align-items: baseline; gap: 10px; }
  .who-name { font-weight: 800; font-size: 17px; }
  .lv-chip {
    font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums;
    padding: 3px 9px; border-radius: 99px; background: var(--ink); color: var(--surface);
  }
  .xp { display: flex; align-items: center; gap: 10px; }
  .xp-bar { width: clamp(110px, 26vw, 220px); height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .xp-fill { display: block; height: 100%; border-radius: 99px; background: var(--ring); }
  .xp-num { font-size: 12px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .status { display: flex; align-items: center; gap: 12px; color: var(--ink-soft); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
  .battery { width: 28px; height: 14px; border: 2px solid currentColor; border-radius: 4px; padding: 1.5px; position: relative; }
  .battery::after { content: ""; position: absolute; right: -5px; top: 3px; width: 3px; height: 5px; border-radius: 0 2px 2px 0; background: currentColor; }
  .battery i { display: block; height: 100%; width: 80%; border-radius: 1.5px; background: currentColor; }

  /* ---------- 공유 버튼 ---------- */
  .top-right { display: flex; align-items: center; gap: 16px; }
  .share {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 15px; border: 1px solid var(--line); border-radius: 99px; cursor: pointer;
    font: 700 14px/1 var(--body); color: var(--ink); background: var(--surface);
    box-shadow: 0 2px 0 var(--line);
    transition: transform .12s, border-color .15s;
  }
  .share svg { width: 16px; height: 16px; }
  .share:hover { border-color: var(--ring); }
  .share:active { transform: scale(.96); }
  .share:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
  .share-note {
    position: fixed; left: 50%; top: 84px; z-index: 5; transform: translateX(-50%);
    width: max-content; max-width: calc(100% - 32px); margin: 0; padding: 12px 16px;
    font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 24px rgba(20,24,34,.16);
    animation: fade .25s var(--ease-out) both;
  }
  .share-note code { font: 700 13px/1 ui-monospace, Consolas, monospace; padding: 2px 5px; border-radius: 5px; background: var(--bg); }

  /* ---------- 타일 줄 ---------- */
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px 0 12px; }
  .shelf {
    display: flex; gap: 18px;
    overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    /* 선택 링·확대·그림자가 잘리지 않도록 안쪽 여백을 넉넉히 두고 바깥 여백으로 상쇄 */
    padding: 24px 40px 60px; margin: -8px -40px -44px;
    scroll-padding-inline: 40px;
  }
  .shelf::-webkit-scrollbar { display: none; }
  .tile {
    flex: none; position: relative;
    width: var(--tile); height: var(--tile);
    border: 0; padding: 0; border-radius: 22px; cursor: pointer;
    scroll-snap-align: start;
    background: var(--surface);
    box-shadow: 0 2px 0 var(--line), 0 10px 24px rgba(20,24,34,.10);
    transition: transform .25s var(--ease-out), box-shadow .25s var(--ease-out);
  }
  .tile::after {
    content: ""; position: absolute; inset: -7px; border-radius: 28px;
    border: 4px solid var(--ring); opacity: 0;
    transition: opacity .2s;
  }
  .tile.sel { transform: scale(1.05); box-shadow: 0 14px 26px rgba(20,24,34,.18); }
  .tile.sel::after { opacity: 1; animation: ring 1.6s ease-in-out infinite; }
  @keyframes ring { 50% { box-shadow: 0 0 0 6px var(--ring-glow); } }
  .tile:focus-visible { outline: none; }

  /* 15초 미션 타일 아트 */
  .art {
    position: absolute; inset: 0; border-radius: inherit; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(rgba(255,255,255,.24) 2px, transparent 2.2px) 0 0 / 14px 14px, var(--pink);
    line-height: .9; transform: rotate(0);
  }
  .art .n, .art .w {
    font-family: var(--cap); font-weight: 400;
    --o: var(--tile-ink);
    text-shadow:
      3px 0 0 var(--o), -3px 0 0 var(--o), 0 3px 0 var(--o), 0 -3px 0 var(--o),
      2.1px 2.1px 0 var(--o), -2.1px 2.1px 0 var(--o), 2.1px -2.1px 0 var(--o), -2.1px -2.1px 0 var(--o),
      0 5px 0 var(--o), 2px 5px 0 var(--o), -2px 5px 0 var(--o);
  }
  .art .n { font-size: calc(var(--tile) * .34); color: var(--yellow); transform: rotate(-4deg); }
  .art .w { font-size: calc(var(--tile) * .2); color: #fff; transform: rotate(-4deg); }
  .art .tag {
    position: absolute; left: 12px; bottom: 12px;
    font: 800 11px/1 var(--body); letter-spacing: .06em;
    padding: 5px 8px; border-radius: 6px; background: var(--tile-ink); color: var(--yellow);
  }

  /* 가위바위보 타일 아트 (그림은 games/rps-tile.svg, 제목만 글꼴로 올림) */
  .art.rps { background: #FFFEF7 url("games/rps-tile.svg") center / cover no-repeat; justify-content: flex-start; }
  .art.rps .t {
    margin-top: 16%; padding: 0 6px 0 14%;
    font: 400 calc(var(--tile) * .2)/1 "Nanum Pen Script", cursive; color: #27314F;
    background: linear-gradient(transparent 55%, #FFE27A 55% 88%, transparent 88%);
    transform: rotate(-3deg);
  }
  .art.rps .tag { background: #27314F; color: #FFFEF7; }

  /* 두더지 잡기 타일 아트 (그림은 games/mole-tile.svg) */
  .art.mole { background: #BDE6FA url("games/mole-tile.svg") center / cover no-repeat; justify-content: flex-start; }
  .art.mole .t {
    margin-top: 9%;
    font: 400 calc(var(--tile) * .15)/1 "Jua", "Black Han Sans", sans-serif; color: #fff;
    -webkit-text-stroke: 2px #3D2B1F; paint-order: stroke fill;
    text-shadow: 0 3px 0 #3D2B1F;
  }
  .art.mole .tag { background: #3D2B1F; color: #FFD84D; }

  /* 벽돌깨기 타일 아트 (CSS로 작은 벽돌·공·패들) */
  .art.brick { background: radial-gradient(120% 90% at 50% 0%, #2A2560, #15132B 65%); justify-content: flex-start; }
  .art.brick .wall { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 78%; margin-top: 14%; }
  .art.brick .wall i { height: calc(var(--tile) * .055); border-radius: 3px; background: var(--c); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
  .art.brick .t { margin-top: 12%; font: 400 calc(var(--tile) * .17)/1 var(--cap); color: #fff; text-shadow: 0 0 12px rgba(92,225,255,.6); }
  .art.brick .ball { position: absolute; left: 58%; bottom: 25%; width: 8%; aspect-ratio: 1; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(180,210,255,.9); }
  .art.brick .pad { position: absolute; left: 35%; bottom: 18%; width: 30%; height: 4.5%; border-radius: 99px; background: #5CE1FF; box-shadow: 0 0 12px rgba(92,225,255,.6); }
  .art.brick .tag { background: #5CE1FF; color: #15132B; }

  /* 시나모롤 런 타일 아트 (그림은 games/runner-tile.svg) */
  .art.runner { background: #8FD3F4 url("games/runner-tile.svg") center / cover no-repeat; justify-content: flex-start; }
  .art.runner .t {
    margin-top: 20%;
    font: 400 calc(var(--tile) * .13)/1 "Jua", "Black Han Sans", sans-serif; color: #4DA8E8;
    -webkit-text-stroke: 4px #fff; paint-order: stroke fill;
  }
  .art.runner .tag { background: #4DA8E8; color: #fff; }

  /* 준비 중 타일 */
  .tile.soon { background: transparent; box-shadow: none; }
  .soon-art {
    position: absolute; inset: 0; border-radius: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    border: 2.5px dashed var(--line); color: var(--ink-faint);
    font-weight: 700; font-size: 14px;
  }
  .soon-art svg { width: 38px; height: 38px; stroke-width: 1.8; }

  /* ---------- 선택한 게임 정보 ---------- */
  .info { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-top: 18px; min-height: 132px; }
  .info-text { min-width: 0; animation: fade .3s var(--ease-out) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } }
  .info h1 { margin: 0 0 8px; font-size: clamp(28px, 6vw, 38px); font-weight: 800; letter-spacing: -.02em; }
  .info p { margin: 0 0 12px; color: var(--ink-soft); font-size: 15px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .meta b { color: var(--ink); font-weight: 800; }
  .meta .game-lv { display: inline-flex; align-items: center; gap: 8px; }
  .meta .game-lv .xp-bar { width: 80px; height: 6px; }
  .bests { display: inline-flex; gap: 12px; }

  .start {
    flex: none; display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 30px; border: 0; border-radius: 99px; cursor: pointer;
    font: 800 18px/1 var(--body); color: #fff; background: var(--ink);
    box-shadow: 0 6px 18px rgba(20,24,34,.22);
    transition: transform .12s, filter .15s;
  }
  :root[data-theme="dark"] .start { color: var(--bg); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .start { color: var(--bg); } }
  .start:hover { filter: brightness(1.15); }
  .start:active { transform: scale(.96); }
  .start:disabled { background: var(--line); color: var(--ink-faint); box-shadow: none; cursor: default; filter: none; }
  .start:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
  .start .key {
    display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
    font-size: 13px; background: var(--ring); color: #fff;
  }
  .start:disabled .key { background: var(--ink-faint); }

  /* ---------- 하단 안내 ---------- */
  footer { border-top: 1px solid var(--line); margin-top: 8px; }
  footer .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; padding-bottom: 18px; font-size: 13px; color: var(--ink-soft); }
  .keys { display: flex; gap: 16px; }
  .keys span { display: inline-flex; align-items: center; gap: 6px; }
  kbd {
    font: 700 11px/1 var(--body); padding: 4px 7px; border-radius: 6px;
    background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px; color: var(--ink);
  }

  /* 게임 실행 시 타일이 커지며 화면이 닫힘 */
  body.launch .tile.sel { transform: scale(1.25); transition: transform .35s var(--ease-out); }
  body.launch > * { opacity: 0; transition: opacity .3s .05s; }

  @media (max-width: 560px) {
    .top { padding-top: 16px; }
    .avatar { width: 46px; height: 46px; }
    .avatar svg { width: 28px; height: 28px; }
    .status { display: none; }
    main { justify-content: flex-start; padding-top: 24px; }
    .info { flex-direction: column; align-items: stretch; gap: 18px; }
    .start { justify-content: center; }
    .keys { display: none; }
  }
  @media (pointer: coarse) { .keys { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<header class="wrap top">
  <div class="profile">
    <div class="avatar" aria-hidden="true">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5v.5M15 9.5v.5"/></svg>
    </div>
    <div class="who">
      <div class="who-line"><span class="who-name">플레이어</span><span class="lv-chip" id="lv"></span></div>
      <div class="xp"><div class="xp-bar"><i class="xp-fill" id="xp-fill"></i></div><span class="xp-num" id="xp-num"></span></div>
    </div>
  </div>
  <div class="top-right">
    <button class="share" id="share" type="button"></button>
    <div class="status" aria-hidden="true"><span id="clock"></span><span class="battery"><i></i></span></div>
  </div>
</header>
<p class="share-note" id="share-note" role="status" hidden></p>

<main class="wrap">
  <div class="shelf" id="shelf" role="listbox" aria-label="게임 목록"></div>
  <section class="info" id="info" aria-live="polite"></section>
</main>

<footer>
  <div class="wrap">
    <div class="keys"><span><kbd>◀</kbd><kbd>▶</kbd> 선택</span><span><kbd>Enter</kbd> 시작</span></div>
    <span id="count"></span>
  </div>
</footer>

<script src="shared.js"></script>
<script>
const SOON = 1; // '준비 중' 빈 타일 개수
const tiles = [...GAMES, ...Array(SOON).fill(null)];
const shelf = document.getElementById('shelf');
const info = document.getElementById('info');
let sel = 0;

const ICON = {
  plus: '<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M12 8.5v7M8.5 12h7"/></svg>',
  play: '<svg class="i" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></svg>',
  share: '<svg class="i" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></svg>',
};

// ---------- 공유 ----------
// 포장본(dist)에서는 이 게임 전체를 HTML 파일 하나로 저장 → 그 파일만 보내면 어디서든 실행
// 개발용 폴더에서는 포장 방법만 안내
const shareBtn = document.getElementById('share');
const shareNote = document.getElementById('share-note');
let noteTimer;
shareBtn.innerHTML = `${ICON.share}${PACK ? '공유용 파일 저장' : '업로드'}`;
shareBtn.addEventListener('click', () => {
  if (PACK) { PACK.save(); note('<b>Claude_Game.html</b> 파일 하나를 받았어요. 이 파일만 보내거나 올리면 어디서든 열려요.'); return; }
  note('이 폴더는 개발용이라 파일이 여러 개예요. Claude에게 <b>“포장해줘”</b>라고 하면 <code>dist/Claude_Game.html</code> 한 파일로 묶어 줘요.');
});
function note(html) {
  shareNote.innerHTML = html;
  shareNote.hidden = false;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { shareNote.hidden = true; }, 5000);
}

function bar(s) { return `<div class="xp-bar"><i class="xp-fill" style="width:${s.exp / needExp(s.lv) * 100}%"></i></div>`; }

function renderProfile() {
  const s = loadLv();
  document.getElementById('lv').textContent = `Lv.${s.lv}`;
  document.getElementById('xp-fill').style.width = (s.exp / needExp(s.lv) * 100) + '%';
  document.getElementById('xp-num').textContent = `${fmt(s.exp)} / ${fmt(needExp(s.lv))} EXP`;
  document.getElementById('count').textContent = `게임 ${GAMES.length}개 · 준비 중 ${SOON}개`;
}

function tileArt(g) {
  if (!g) return `<span class="soon-art">${ICON.plus}준비 중</span>`;
  // 게임마다 타일 아트가 다름 — 새 게임을 넣으면 여기에 추가
  if (g.id === 'rps') return `<span class="art rps"><span class="t">가위바위보</span><span class="tag">4 MODES</span></span>`;
  if (g.id === 'mole') return `<span class="art mole"><span class="t">두더지 잡기</span><span class="tag">3 MODES</span></span>`;
  if (g.id === 'brick') {
    const colors = ['#FF5C7A', '#FFA53D', '#FFE14D', '#4ADE9B'];
    const wall = colors.flatMap(c => Array(5).fill(`<i style="--c:${c}"></i>`)).join('');
    return `<span class="art brick"><span class="wall">${wall}</span><span class="t">벽돌깨기</span><span class="ball"></span><span class="pad"></span><span class="tag">3 MODES</span></span>`;
  }
  if (g.id === 'runner') return `<span class="art runner"><span class="t">시나모롤 런</span><span class="tag">3 MODES</span></span>`;
  return `<span class="art"><span class="n">15초</span><span class="w">미션</span><span class="tag">3 MISSIONS</span></span>`;
}

function renderShelf() {
  shelf.innerHTML = tiles.map((g, i) => `
    <button class="tile ${g ? '' : 'soon'}" role="option" data-i="${i}"
      aria-label="${g ? g.title : '준비 중인 게임'}">${tileArt(g)}</button>`).join('');
  shelf.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
    const i = +t.dataset.i;
    // 이미 선택된 타일을 한 번 더 누르면 바로 시작
    if (i === sel) launch(); else select(i);
  }));
}

function select(i, focus = true) {
  sel = (i + tiles.length) % tiles.length;
  shelf.querySelectorAll('.tile').forEach((t, j) => {
    t.classList.toggle('sel', j === sel);
    t.setAttribute('aria-selected', j === sel);
  });
  const t = shelf.children[sel];
  if (focus) t.focus({ preventScroll: true });
  t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
  renderInfo();
}

function renderInfo() {
  const g = tiles[sel];
  if (!g) {
    info.innerHTML = `
      <div class="info-text">
        <h1>준비 중</h1>
        <p>새 게임이 곧 추가돼요.</p>
      </div>
      <button class="start" disabled><span class="key">A</span>준비 중</button>`;
    return;
  }
  const lv = loadLv(g.lvKey);
  const bests = Object.entries(g.bests).map(([name, key]) => {
    const b = loadRecord(key);
    // 정수 점수(가위바위보 15초 모드)는 소수점 없이
    return `<span>${name} <b>${b ? (Number.isInteger(b) ? b : b.toFixed(2)) + g.bestUnit : '—'}</b></span>`;
  }).join('');
  info.innerHTML = `
    <div class="info-text">
      <h1>${g.title}</h1>
      <p>${g.desc}</p>
      <div class="meta">
        <span class="game-lv"><b>Lv.${lv.lv}</b>${bar(lv)}</span>
        <span class="bests">${bests}</span>
      </div>
    </div>
    <button class="start" id="start"><span class="key">A</span>시작${ICON.play}</button>`;
  info.querySelector('#start').addEventListener('click', launch);
}

function launch() {
  const g = tiles[sel];
  if (!g || document.body.classList.contains('launch')) return;
  document.body.classList.add('launch');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => goTo(g.href), reduce ? 0 : 320);
}

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { e.preventDefault(); select(sel + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); select(sel - 1); }
  else if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) {
    // 시작·공유 버튼에 포커스가 있으면 버튼 자체 클릭에 맡김
    if (document.activeElement && ['start', 'share'].includes(document.activeElement.id)) return;
    e.preventDefault(); launch();
  }
});

// 뒤로가기로 돌아왔을 때 닫힘 효과를 풀고 레벨·기록을 새로 읽음
window.addEventListener('pageshow', () => {
  document.body.classList.remove('launch');
  renderProfile();
  renderInfo();
});

function tick() {
  const d = new Date();
  document.getElementById('clock').textContent =
    `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

renderProfile();
renderShelf();
select(0, false);
tick();
setInterval(tick, 10000);
</script>
</body>
</html>

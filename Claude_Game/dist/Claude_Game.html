<script id="pages" type="application/json">{"index.html":"\u003c!doctype html\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"\u003e\n\u003ctitle\u003e미니게임 홈\u003c/title\u003e\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Black+Han+Sans\u0026family=Jua\u0026family=Nanum+Pen+Script\u0026display=swap\" rel=\"stylesheet\"\u003e\n\u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\"\u003e\n\u003cstyle\u003e\n  /* 게임기 홈 화면 — 밝은 바탕 + 큰 정사각 타일 + 선택 링 */\n  :root {\n    --bg: #E9ECF1;      --bg-2: #F5F6F9;\n    --surface: #FFFFFF; --line: #D3D8E1;\n    --ink: #1B1D24;     --ink-soft: #5B6170;  --ink-faint: #8C92A0;\n    --ring: #12B5E8;    --ring-glow: rgba(18,181,232,.35);\n    --pink: #FF3D8B;    --yellow: #FFE14D;    --tile-ink: #17121C;\n\n    --cap: \"Black Han Sans\", \"Pretendard Variable\", system-ui, sans-serif;\n    --body: \"Pretendard Variable\", Pretendard, \"Apple SD Gothic Neo\", \"Malgun Gothic\", system-ui, sans-serif;\n    --ease-out: cubic-bezier(.16, 1, .3, 1);\n    --tile: clamp(148px, 30vw, 216px);\n  }\n  @media (prefers-color-scheme: dark) {\n    :root:not([data-theme=\"light\"]) {\n      --bg: #1B1D23;      --bg-2: #24272F;\n      --surface: #2B2F38; --line: #3A3F4B;\n      --ink: #F1F3F7;     --ink-soft: #A9AFBC;  --ink-faint: #7C8290;\n      --ring: #3CCBF4;    --ring-glow: rgba(60,203,244,.3);\n    }\n  }\n  :root[data-theme=\"dark\"] {\n    --bg: #1B1D23;      --bg-2: #24272F;\n    --surface: #2B2F38; --line: #3A3F4B;\n    --ink: #F1F3F7;     --ink-soft: #A9AFBC;  --ink-faint: #7C8290;\n    --ring: #3CCBF4;    --ring-glow: rgba(60,203,244,.3);\n  }\n\n  * { box-sizing: border-box; }\n  html, body { margin: 0; }\n  body {\n    min-height: 100vh; min-height: 100dvh;\n    display: flex; flex-direction: column;\n    font-family: var(--body); color: var(--ink);\n    background: linear-gradient(180deg, var(--bg-2), var(--bg) 60%);\n    -webkit-tap-highlight-color: transparent;\n    overflow-x: hidden;\n  }\n  svg.i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }\n  .wrap { width: 100%; max-width: 980px; margin: 0 auto; padding: 0 16px; }\n\n  /* ---------- 상단: 프로필 + 시계 ---------- */\n  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 22px; }\n  .profile { display: flex; align-items: center; gap: 14px; min-width: 0; }\n  .avatar {\n    flex: none; width: 56px; height: 56px; border-radius: 50%;\n    display: grid; place-items: center;\n    background: var(--yellow); color: var(--tile-ink);\n    box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--line);\n  }\n  .avatar svg { width: 34px; height: 34px; stroke-width: 2; }\n  .who { min-width: 0; display: flex; flex-direction: column; gap: 6px; }\n  .who-line { display: flex; align-items: baseline; gap: 10px; }\n  .who-name { font-weight: 800; font-size: 17px; }\n  .lv-chip {\n    font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums;\n    padding: 3px 9px; border-radius: 99px; background: var(--ink); color: var(--surface);\n  }\n  .xp { display: flex; align-items: center; gap: 10px; }\n  .xp-bar { width: clamp(110px, 26vw, 220px); height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }\n  .xp-fill { display: block; height: 100%; border-radius: 99px; background: var(--ring); }\n  .xp-num { font-size: 12px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }\n  .status { display: flex; align-items: center; gap: 12px; color: var(--ink-soft); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }\n  .battery { width: 28px; height: 14px; border: 2px solid currentColor; border-radius: 4px; padding: 1.5px; position: relative; }\n  .battery::after { content: \"\"; position: absolute; right: -5px; top: 3px; width: 3px; height: 5px; border-radius: 0 2px 2px 0; background: currentColor; }\n  .battery i { display: block; height: 100%; width: 80%; border-radius: 1.5px; background: currentColor; }\n\n  /* ---------- 공유 버튼 ---------- */\n  .top-right { display: flex; align-items: center; gap: 16px; }\n  .share {\n    display: inline-flex; align-items: center; gap: 7px;\n    padding: 9px 15px; border: 1px solid var(--line); border-radius: 99px; cursor: pointer;\n    font: 700 14px/1 var(--body); color: var(--ink); background: var(--surface);\n    box-shadow: 0 2px 0 var(--line);\n    transition: transform .12s, border-color .15s;\n  }\n  .share svg { width: 16px; height: 16px; }\n  .share:hover { border-color: var(--ring); }\n  .share:active { transform: scale(.96); }\n  .share:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }\n  .share-note {\n    position: fixed; left: 50%; top: 84px; z-index: 5; transform: translateX(-50%);\n    width: max-content; max-width: calc(100% - 32px); margin: 0; padding: 12px 16px;\n    font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--surface);\n    border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 24px rgba(20,24,34,.16);\n    animation: fade .25s var(--ease-out) both;\n  }\n  .share-note code { font: 700 13px/1 ui-monospace, Consolas, monospace; padding: 2px 5px; border-radius: 5px; background: var(--bg); }\n\n  /* ---------- 타일 줄 ---------- */\n  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px 0 12px; }\n  .shelf {\n    display: flex; gap: 18px;\n    overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;\n    /* 선택 링·확대·그림자가 잘리지 않도록 안쪽 여백을 넉넉히 두고 바깥 여백으로 상쇄 */\n    padding: 24px 40px 60px; margin: -8px -40px -44px;\n    scroll-padding-inline: 40px;\n  }\n  .shelf::-webkit-scrollbar { display: none; }\n  .tile {\n    flex: none; position: relative;\n    width: var(--tile); height: var(--tile);\n    border: 0; padding: 0; border-radius: 22px; cursor: pointer;\n    scroll-snap-align: start;\n    background: var(--surface);\n    box-shadow: 0 2px 0 var(--line), 0 10px 24px rgba(20,24,34,.10);\n    transition: transform .25s var(--ease-out), box-shadow .25s var(--ease-out);\n  }\n  .tile::after {\n    content: \"\"; position: absolute; inset: -7px; border-radius: 28px;\n    border: 4px solid var(--ring); opacity: 0;\n    transition: opacity .2s;\n  }\n  .tile.sel { transform: scale(1.05); box-shadow: 0 14px 26px rgba(20,24,34,.18); }\n  .tile.sel::after { opacity: 1; animation: ring 1.6s ease-in-out infinite; }\n  @keyframes ring { 50% { box-shadow: 0 0 0 6px var(--ring-glow); } }\n  .tile:focus-visible { outline: none; }\n\n  /* 15초 미션 타일 아트 */\n  .art {\n    position: absolute; inset: 0; border-radius: inherit; overflow: hidden;\n    display: flex; flex-direction: column; align-items: center; justify-content: center;\n    background: radial-gradient(rgba(255,255,255,.24) 2px, transparent 2.2px) 0 0 / 14px 14px, var(--pink);\n    line-height: .9; transform: rotate(0);\n  }\n  .art .n, .art .w {\n    font-family: var(--cap); font-weight: 400;\n    --o: var(--tile-ink);\n    text-shadow:\n      3px 0 0 var(--o), -3px 0 0 var(--o), 0 3px 0 var(--o), 0 -3px 0 var(--o),\n      2.1px 2.1px 0 var(--o), -2.1px 2.1px 0 var(--o), 2.1px -2.1px 0 var(--o), -2.1px -2.1px 0 var(--o),\n      0 5px 0 var(--o), 2px 5px 0 var(--o), -2px 5px 0 var(--o);\n  }\n  .art .n { font-size: calc(var(--tile) * .34); color: var(--yellow); transform: rotate(-4deg); }\n  .art .w { font-size: calc(var(--tile) * .2); color: #fff; transform: rotate(-4deg); }\n  .art .tag {\n    position: absolute; left: 12px; bottom: 12px;\n    fon x; cursor: pointer;\n    font: 800 18px/1 var(--body); color: #fff; background: var(--ink);\n    box-shadow: 0 6px 18px rgba(20,24,34,.22);\n    transition: transform .12s, filter .15s;\n  }\n  :root[data-theme=\"dark\"] .start { color: var(--bg); }\n  @media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) .start { color: var(--bg); } }\n  .start:hover { filter: brightness(1.15); }\n  .start:active { transform: scale(.96); }\n  .start:disabled { background: var(--line); color: var(--ink-faint); box-shadow: none; cursor: default; filter: none; }\n  .start:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }\n  .start .key {\n    display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;\n    font-size: 13px; background: var(--ring); color: #fff;\n  }\n  .start:disabled .key { background: var(--ink-faint); }\n\n  /* ---------- 하단 안내 ---------- */\n  footer { border-top: 1px solid var(--line); margin-top: 8px; }\n  footer .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; padding-bottom: 18px; font-size: 13px; color: var(--ink-soft); }\n  .keys { display: flex; gap: 16px; }\n  .keys span { display: inline-flex; align-items: center; gap: 6px; }\n  kbd {\n    font: 700 11px/1 var(--body); padding: 4px 7px; border-radius: 6px;\n    background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px; color: var(--ink);\n  }\n\n  /* 게임 실행 시 타일이 커지며 화면이 닫힘 */\n  body.launch .tile.sel { transform: scale(1.25); transition: transform .35s var(--ease-out); }\n  body.launch \u003e * { opacity: 0; transition: opacity .3s .05s; }\n\n  @media (max-width: 560px) {\n    .top { padding-top: 16px; }\n    .avatar { width: 46px; height: 46px; }\n    .avatar svg { width: 28px; height: 28px; }\n    .status { display: none; }\n    main { justify-content: flex-start; padding-top: 24px; }\n    .info { flex-direction: column; align-items: stretch; gap: 18px; }\n    .start { justify-content: center; }\n    .keys { display: none; }\n  }\n  @media (pointer: coarse) { .keys { display: none; } }\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n  }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cheader class=\"wrap top\"\u003e\n  \u003cdiv class=\"profile\"\u003e\n    \u003cdiv class=\"avatar\" aria-hidden=\"true\"\u003e\n      \u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M8.5 14.5a4.5 4.5 0 0 0 7 0\"/\u003e\u003cpath d=\"M9 9.5v.5M15 9.5v.5\"/\u003e\u003c/svg\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"who\"\u003e\n      \u003cdiv class=\"who-line\"\u003e\u003cspan class=\"who-name\"\u003e플레이어\u003c/span\u003e\u003cspan class=\"lv-chip\" id=\"lv\"\u003e\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"xp\"\u003e\u003cdiv class=\"xp-bar\"\u003e\u003ci class=\"xp-fill\" id=\"xp-fill\"\u003e\u003c/i\u003e\u003c/div\u003e\u003cspan class=\"xp-num\" id=\"xp-num\"\u003e\u003c/span\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"top-right\"\u003e\n    \u003cbutton class=\"share\" id=\"share\" type=\"button\"\u003e\u003c/button\u003e\n    \u003cdiv class=\"status\" aria-hidden=\"true\"\u003e\u003cspan id=\"clock\"\u003e\u003c/span\u003e\u003cspan class=\"battery\"\u003e\u003ci\u003e\u003c/i\u003e\u003c/span\u003e\u003c/div\u003e\n  \u003c/div\u003e\n\u003c/header\u003e\n\u003cp class=\"share-note\" id=\"share-note\" role=\"status\" hidden\u003e\u003c/p\u003e\n\n\u003cmain class=\"wrap\"\u003e\n  \u003cdiv class=\"shelf\" id=\"shelf\" role=\"listbox\" aria-label=\"게임 목록\"\u003e\u003c/div\u003e\n  \u003csection class=\"info\" id=\"info\" aria-live=\"polite\"\u003e\u003c/section\u003e\n\u003c/main\u003e\n\n\u003cfooter\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cdiv class=\"keys\"\u003e\u003cspan\u003e\u003ckbd\u003e◀\u003c/kbd\u003e\u003ckbd\u003e▶\u003c/kbd\u003e 선택\u003c/span\u003e\u003cspan\u003e\u003ckbd\u003eEnter\u003c/kbd\u003e 시작\u003c/span\u003e\u003c/div\u003e\n    \u003cspan id=\"count\"\u003e\u003c/span\u003e\n  \u003c/div\u003e\n\u003c/footer\u003e\n\n\u003cscript\u003e\n// 메인 화면과 모든 게임이 함께 쓰는 코드: 게임 목록 + 레벨·경험치\n// 게임을 깨면 같은 경험치가 \u0027전체 레벨\u0027과 \u0027그 게임 레벨\u0027에 함께 쌓임\n\n// ---------- 게임 목록 ----------\n// href는 메인(index.html) 기준 경로 / lvKey: 게임별 레벨 저장 키\n// bests: { 표시 이름: 최고 기록 저장 키 } / bestUnit: 기록 단위\nconst GAMES = [\n  {\n    id: \u0027mission15\u0027,\n    title: \u002715초 미션\u0027,\n    desc: \u002715초 안에 미니게임 3개를 모두 깨라!\u0027,\n    href: \u0027games/mission15.html\u0027,\n    lvKey: \u0027lv15\u0027,\n    bests: { Easy: \u0027best15\u0027, Normal: \u0027best15_normal\u0027, Hard: \u0027best15_hard\u0027 },\n    bestUnit: \u0027초\u0027,\n  },\n  {\n    id: \u0027rps\u0027,\n    title: \u0027가위바위보\u0027,\n    desc: \u002710판 운 승부, 또는 15초 동안 이기는 패 골라내기!\u0027,\n    href: \u0027games/rps.html\u0027,\n    lvKey: \u0027lv_rps\u0027,\n    // 15초 모드는 점수 체계가 바뀌어(정답 +1 / 오답 -1) v2 키로 새로 시작\n    bests: { \u0027일반\u0027: \u0027rps_best\u0027, Easy: \u0027rps2_best_easy\u0027, Normal: \u0027rps2_best_normal\u0027, Hard: \u0027rps2_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027mole\u0027,\n    title: \u0027두더지 잡기\u0027,\n    desc: \u002715초 동안 두더지를 잡아라! 황금 두더지는 +30, 폭탄은 -50.\u0027,\n    href: \u0027games/mole.html\u0027,\n    lvKey: \u0027lv_mole\u0027,\n    // 점수 체계가 바뀌어(일반 +10 / 황금 +30 / 폭탄 -50 / 도망 -10 / 헛방 -1) v4 키로 새로 시작\n    bests: { Easy: \u0027mole4_best_easy\u0027, Normal: \u0027mole4_best_normal\u0027, Hard: \u0027mole4_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027brick\u0027,\n    title: \u0027벽돌깨기\u0027,\n    desc: \u002760초 안에 벽돌 24개를 모두 깨라! 4개마다 스피드 업.\u0027,\n    href: \u0027games/brick.html\u0027,\n    lvKey: \u0027lv_brick\u0027,\n    bests: { Easy: \u0027brick_best_easy\u0027, Normal: \u0027brick_best_normal\u0027, Hard: \u0027brick_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027runner\u0027,\n    title: \u0027시나모롤 런\u0027,\n    desc: \u0027귀를 팔랑이며 하늘을 날아라! 낮 · 밤 · 폭풍우 3가지 하늘.\u0027,\n    href: \u0027games/runner.html\u0027,\n    lvKey: \u0027lv_runner\u0027,\n    bests: { Easy: \u0027runner_best_easy\u0027, Normal: \u0027runner_best_normal\u0027, Hard: \u0027runner_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n];\n\n// ---------- 페이지 이동 ----------\n// 한 파일로 포장된 버전(dist/Claude_Game.html)에서는 바깥 틀(__pack)이 페이지를 바꿔 줌\nconst PACK = (() =\u003e { try { return (window.parent !== window \u0026\u0026 window.parent.__pack) || null; } catch { return null; } })();\nfunction goTo(href) { if (PACK) PACK.go(href); else location.href = href; }\nif (PACK) document.addEventListener(\u0027click\u0027, e =\u003e {\n  const a = e.target.closest(\u0027a[href]\u0027);\n  if (!a || /^(https?:|#|mailto:)/.test(a.getAttribute(\u0027href\u0027))) return;\n  e.preventDefault();\n  PACK.go(a.getAttribute(\u0027href\u0027));\n});\n\n// 예전 점수 체계(정답 +3)의 가위바위보 15초 모드 기록 정리\ntry { [\u0027rps_best_easy\u0027, \u0027rps_best_normal\u0027, \u0027rps_best_hard\u0027].forEach(k =\u003e localStorage.removeItem(k)); } catch {}\n// 예전 점수 체계의 두더지 잡기 · 난이도가 없던 벽돌깨기·시나모롤 런 기록 정리\ntry { [\u0027mole_best_easy\u0027, \u0027mole2_best_easy\u0027, \u0027mole2_best_normal\u0027, \u0027mole2_best_hard\u0027, \u0027mole3_best_easy\u0027, \u0027mole3_best_normal\u0027, \u0027mole3_best_hard\u0027, \u0027brick_best\u0027, \u0027runner_best\u0027].forEach(k =\u003e localStorage.removeItem(k)); } catch {}\n\n// ---------- 레벨 ----------\n// 다음 레벨까지 필요 경험치 = Lv² × 1000 (exp는 현재 레벨 안에서 쌓인 양)\nconst LV_ALL_KEY = \u0027lv_all\u0027;\nconst needExp = lv =\u003e lv * lv * 1000;\nconst fmt = n =\u003e n.toLocaleString(\u0027ko-KR\u0027);\n\nfunction loadLv(key = LV_ALL_KEY) {\n  try {\n    const s = JSON.parse(localStorage.getItem(key));\n    if (s \u0026\u0026 s.lv \u003e= 1 \u0026\u0026 s.exp \u003e= 0) return { lv: s.lv, exp: s.exp };\n  } catch {}\n  return { lv: 1, exp: 0 };\n}\nfunction saveLv(key, s) { try { localStorage.setItem(key, JSON.stringify(s)); } catch {} }\n\nfunction gainExp(key, gain) {\n  const from = loadLv(key);\n  const to = { ...from, exp: from.exp + gain };\n  while (to.exp \u003e= needExp(to.lv)) { to.exp -= needExp(to.lv); to.lv++; }\n  saveLv(key, to);\n  return { from, to };\n}\n\n// 게임 클리어 시 호출 → { all: 전체 레벨 변화, game: 게임 레벨 변화 }\nfunction giveExp(gameLvKey, gain) {\n  gain = Math.max(0, gain); // 음수 EXP로 레벨이 깎이지 않도록\n  return { all: gainExp(LV_ALL_KEY, gain), game: gainExp(gameLvKey, gain) };\n}\n\nfunction loadRecord(key) {\n  try { return parseFloat(localStorage.getItem(key)) || null; } catch { return null; }\n}\n\n\u003c/script\u003e\n\u003cscript\u003e\nconst SOON = 1; // \u0027준비 중\u0027 빈 타일 개수\nconst tiles = [...GAMES, ...Array(SOON).fill(null)];\nconst shelf = document.getElementById(\u0027shelf\u0027);\nconst info = document.getElementById(\u0027info\u0027);\nlet sel = 0;\n\nconst ICON = {\n  plus: \u0027\u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003crect x=\"3.5\" y=\"3.5\" width=\"17\" height=\"17\" rx=\"5\"/\u003e\u003cpath d=\"M12 8.5v7M8.5 12h7\"/\u003e\u003c/svg\u003e\u0027,\n  play: \u0027\u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003cpath d=\"M8 5.5v13l10-6.5z\" fill=\"currentColor\"/\u003e\u003c/svg\u003e\u0027,\n  share: \u0027\u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003cpath d=\"M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14\"/\u003e\u003c/svg\u003e\u0027,\n};\n\n// ---------- 공유 ----------\n// 포장본(dist)에서는 이 게임 전체를 HTML 파일 하나로 저장 → 그 파일만 보내면 어디서든 실행\n// 개발용 폴더에서는 포장 방법만 안내\nconst shareBtn = document.getElementById(\u0027share\u0027);\nconst shareNote = document.getElementById(\u0027share-note\u0027);\nlet noteTimer;\nshareBtn.innerHTML = `${ICON.share}${PACK ? \u0027공유용 파일 저장\u0027 : \u0027업로드\u0027}`;\nshareBtn.addEventListener(\u0027click\u0027, () =\u003e {\n  if (PACK) { PACK.save(); note(\u0027\u003cb\u003eClaude_Game.html\u003c/b\u003e 파일 하나를 받았어요. 이 파일만 보내거나 올리면 어디서든 열려요.\u0027); return; }\n  note(\u0027이 폴더는 개발용이라 파일이 여러 개예요. Claude에게 \u003cb\u003e“포장해줘”\u003c/b\u003e라고 하면 \u003ccode\u003edist/Claude_Game.html\u003c/code\u003e 한 파일로 묶어 줘요.\u0027);\n});\nfunction note(html) {\n  shareNote.innerHTML = html;\n  shareNote.hidden = false;\n  clearTimeout(noteTimer);\n  noteTimer = setTimeout(() =\u003e { shareNote.hidden = true; }, 5000);\n}\n\nfunction bar(s) { return `\u003cdiv class=\"xp-bar\"\u003e\u003ci class=\"xp-fill\" style=\"width:${s.exp / needExp(s.lv) * 100}%\"\u003e\u003c/i\u003e\u003c/div\u003e`; }\n\nfunction renderProfile() {\n  const s = loadLv();\n  document.getElementById(\u0027lv\u0027).textContent = `Lv.${s.lv}`;\n  document.getElementById(\u0027xp-fill\u0027).style.width = (s.exp / needExp(s.lv) * 100) + \u0027%\u0027;\n  document.getElementById(\u0027xp-num\u0027).textContent = `${fmt(s.exp)} / ${fmt(needExp(s.lv))} EXP`;\n  document.getElementById(\u0027count\u0027).textContent = `게임 ${GAMES.length}개 · 준비 중 ${SOON}개`;\n}\n\nfunction tileArt(g) {\n  if (!g) return `\u003cspan class=\"soon-art\"\u003e${ICON.plus}준비 중\u003c/span\u003e`;\n  // 게임마다 타일 아트가 다름 — 새 게임을 넣으면 여기에 추가\n  if (g.id === \u0027rps\u0027) return `\u003cspan class=\"art rps\"\u003e\u003cspan class=\"t\"\u003e가위바위보\u003c/span\u003e\u003cspan class=\"tag\"\u003e4 MODES\u003c/span\u003e\u003c/span\u003e`;\n  if (g.id === \u0027mole\u0027) return `\u003cspan class=\"art mole\"\u003e\u003cspan class=\"t\"\u003e두더지 잡기\u003c/span\u003e\u003cspan class=\"tag\"\u003e3 MODES\u003c/span\u003e\u003c/span\u003e`;\n  if (g.id === \u0027brick\u0027) {\n    const colors = [\u0027#FF5C7A\u0027, \u0027#FFA53D\u0027, \u0027#FFE14D\u0027, \u0027#4ADE9B\u0027];\n    const wall = colors.flatMap(c =\u003e Array(5).fill(`\u003ci style=\"--c:${c}\"\u003e\u003c/i\u003e`)).join(\u0027\u0027);\n    return `\u003cspan class=\"art brick\"\u003e\u003cspan class=\"wall\"\u003e${wall}\u003c/span\u003e\u003cspan class=\"t\"\u003e벽돌깨기\u003c/span\u003e\u003cspan class=\"ball\"\u003e\u003c/span\u003e\u003cspan class=\"pad\"\u003e\u003c/span\u003e\u003cspan class=\"tag\"\u003e3 MODES\u003c/span\u003e\u003c/span\u003e`;\n  }\n  if (g.id === \u0027runner\u0027) return `\u003cspan class=\"art runner\"\u003e\u003cspan class=\"t\"\u003e시나모롤 런\u003c/span\u003e\u003cspan class=\"tag\"\u003e3 MODES\u003c/span\u003e\u003c/span\u003e`;\n  return `\u003cspan class=\"art\"\u003e\u003cspan class=\"n\"\u003e15초\u003c/span\u003e\u003cspan class=\"w\"\u003e미션\u003c/span\u003e\u003cspan class=\"tag\"\u003e3 MISSIONS\u003c/span\u003e\u003c/span\u003e`;\n}\n\nfunction renderShelf() {\n  shelf.innerHTML = tiles.map((g, i) =\u003e `\n    \u003cbutton class=\"tile ${g ? \u0027\u0027 : \u0027soon\u0027}\" role=\"option\" data-i=\"${i}\"\n      aria-label=\"${g ? g.title : \u0027준비 중인 게임\u0027}\"\u003e${tileArt(g)}\u003c/button\u003e`).join(\u0027\u0027);\n  shelf.querySelectorAll(\u0027.tile\u0027).forEach(t =\u003e t.addEventListener(\u0027click\u0027, () =\u003e {\n    const i = +t.dataset.i;\n    // 이미 선택된 타일을 한 번 더 누르면 바로 시작\n    if (i === sel) launch(); else select(i);\n  }));\n}\n\nfunction select(i, focus = true) {\n  sel = (i + tiles.length) % tiles.length;\n  shelf.querySelectorAll(\u0027.tile\u0027).forEach((t, j) =\u003e {\n    t.classList.toggle(\u0027sel\u0027, j === sel);\n    t.setAttribute(\u0027aria-selected\u0027, j === sel);\n  });\n  const t = shelf.children[sel];\n  if (focus) t.focus({ preventScroll: true });\n  t.scrollIntoView({ behavior: \u0027smooth\u0027, block: \u0027nearest\u0027, inline: \u0027nearest\u0027 });\n  renderInfo();\n}\n\nfunction renderInfo() {\n  const g = tiles[sel];\n  if (!g) {\n    info.innerHTML = `\n      \u003cdiv class=\"info-text\"\u003e\n        \u003ch1\u003e준비 중\u003c/h1\u003e\n        \u003cp\u003e새 게임이 곧 추가돼요.\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cbutton class=\"start\" disabled\u003e\u003cspan class=\"key\"\u003eA\u003c/span\u003e준비 중\u003c/button\u003e`;\n    return;\n  }\n  const lv = loadLv(g.lvKey);\n  const bests = Object.entries(g.bests).map(([name, key]) =\u003e {\n    const b = loadRecord(key);\n    // 정수 점수(가위바위보 15초 모드)는 소수점 없이\n    return `\u003cspan\u003e${name} \u003cb\u003e${b ? (Number.isInteger(b) ? b : b.toFixed(2)) + g.bestUnit : \u0027—\u0027}\u003c/b\u003e\u003c/span\u003e`;\n  }).join(\u0027\u0027);\n  info.innerHTML = `\n    \u003cdiv class=\"info-text\"\u003e\n      \u003ch1\u003e${g.title}\u003c/h1\u003e\n      \u003cp\u003e${g.desc}\u003c/p\u003e\n      \u003cdiv class=\"meta\"\u003e\n        \u003cspan class=\"game-lv\"\u003e\u003cb\u003eLv.${lv.lv}\u003c/b\u003e${bar(lv)}\u003c/span\u003e\n        \u003cspan class=\"bests\"\u003e${bests}\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cbutton class=\"start\" id=\"start\"\u003e\u003cspan class=\"key\"\u003eA\u003c/span\u003e시작${ICON.play}\u003c/button\u003e`;\n  info.querySelector(\u0027#start\u0027).addEventListener(\u0027click\u0027, launch);\n}\n\nfunction launch() {\n  const g = tiles[sel];\n  if (!g || document.body.classList.contains(\u0027launch\u0027)) return;\n  document.body.classList.add(\u0027launch\u0027);\n  const reduce = matchMedia(\u0027(prefers-reduced-motion: reduce)\u0027).matches;\n  setTimeout(() =\u003e goTo(g.href), reduce ? 0 : 320);\n}\n\nwindow.addEventListener(\u0027keydown\u0027, e =\u003e {\n  if (e.key === \u0027ArrowRight\u0027) { e.preventDefault(); select(sel + 1); }\n  else if (e.key === \u0027ArrowLeft\u0027) { e.preventDefault(); select(sel - 1); }\n  else if ((e.key === \u0027Enter\u0027 || e.key === \u0027 \u0027) \u0026\u0026 !e.repeat) {\n    // 시작·공유 버튼에 포커스가 있으면 버튼 자체 클릭에 맡김\n    if (document.activeElement \u0026\u0026 [\u0027start\u0027, \u0027share\u0027].includes(document.activeElement.id)) return;\n    e.preventDefault(); launch();\n  }\n});\n\n// 뒤로가기로 돌아왔을 때 닫힘 효과를 풀고 레벨·기록을 새로 읽음\nwindow.addEventListener(\u0027pageshow\u0027, () =\u003e {\n  document.body.classList.remove(\u0027launch\u0027);\n  renderProfile();\n  renderInfo();\n});\n\nfunction tick() {\n  const d = new Date();\n  document.getElementById(\u0027clock\u0027).textContent =\n    `${String(d.getHours()).padStart(2, \u00270\u0027)}:${String(d.getMinutes()).padStart(2, \u00270\u0027)}`;\n}\n\nrenderProfile();\nrenderShelf();\nselect(0, false);\ntick();\nsetInterval(tick, 10000);\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","games/brick.html":"\u003c!doctype html\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"\u003e\n\u003ctitle\u003e벽돌깨기\u003c/title\u003e\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Black+Han+Sans\u0026display=swap\" rel=\"stylesheet\"\u003e\n\u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\"\u003e\n\u003cstyle\u003e\n  /* 밤의 오락실 — 짙은 남색 화면 + 사탕색 벽돌 + 빛나는 공 */\n  :root {\n    --night: #15132B;   --night-2: #1E1B3D;  --grid: rgba(255,255,255,.04);\n    --frame: #0B0A1A;   --line: #3A3566;\n    --ink: #F4F2FF;     --ink-soft: #A9A4CF; --ink-faint: #6E6899;\n    --heart: #FF4D6D;   --heart-off: #3A3566;\n    --paddle: #5CE1FF;  --ball: #FFFFFF;\n    --b1: #FF5C7A; --b2: #FFA53D; --b3: #FFE14D; --b4: #4ADE9B;\n    --cap: \"Black Han Sans\", \"Pretendard Variable\", system-ui, sans-serif;\n    --body: \"Pretendard Variable\", Pretendard, \"Apple SD Gothic Neo\", \"Malgun Gothic\", system-ui, sans-serif;\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; }\n  body {\n    min-height: 100vh; min-height: 100dvh;\n    display: grid; place-items: center;\n    padding: 20px 16px;\n    font-family: var(--body); color: var(--ink);\n    background: radial-gradient(120% 80% at 50% 0%, #2A2560, var(--night) 60%);\n    user-select: none; -webkit-user-select: none;\n    -webkit-tap-highlight-color: transparent;\n  }\n\n  .cab { width: 100%; max-width: 420px; }\n  .top { display: flex; align-items: center; justify-content: space-between; height: 36px; }\n  .home {\n    font: 700 15px/1 var(--body); color: var(--ink-soft); text-decoration: none;\n    padding: 8px 12px; margin-left: -10px; border-radius: 99px;\n  }\n  .home:hover { color: var(--ink); background: rgba(255,255,255,.08); }\n  .home:focus-visible { outline: 2px solid var(--paddle); outline-offset: 2px; }\n  .title { font: 400 22px/1 var(--cap); letter-spacing: .02em; }\n\n  /* ---------- 점수 · 남은 공 ---------- */\n  .hud {\n    display: flex; align-items: center; justify-content: space-between;\n    margin: 10px 0 0; padding: 10px 14px;\n    background: var(--frame); border: 2px solid var(--line); border-bottom: 0;\n    border-radius: 16px 16px 0 0;\n  }\n  .score { display: flex; align-items: baseline; gap: 10px; }\n  .score .lbl { font: 800 12px/1 var(--body); letter-spacing: .14em; color: var(--ink-soft); }\n  .score b { display: inline-block; font: 400 30px/1 var(--cap); font-variant-numeric: tabular-nums; color: var(--b3); min-width: 3ch; }\n  .score b.bump { animation: bump .25s ease-out; }\n  @keyframes bump { 40% { transform: scale(1.25); } }\n  .score small { font-size: 12px; color: var(--ink-faint); }\n  .lives { display: flex; gap: 6px; }\n  .lives svg { width: 24px; height: 24px; display: block; }\n  .lives .on path { fill: var(--heart); filter: drop-shadow(0 0 6px rgba(255,77,109,.55)); }\n  .lives .off path { fill: var(--heart-off); }\n  .lives .lost svg { animation: heart-lost .6s ease-out; }\n  @keyframes heart-lost { 0% { transform: scale(1.5); } 30% { transform: scale(.7) rotate(-12deg); } 100% { transform: none; } }\n  .timer { font: 400 26px/1 var(--cap); font-variant-numeric: tabular-nums; min-width: 3.4ch; text-align: center; }\n  .timer.low { color: var(--heart); }\n  .mode-tag { min-width: 52px; text-align: right; font: 800 12px/1 var(--body); letter-spacing: .08em; color: var(--ink-soft); }\n\n  /* 스피드 단계 (화면 왼쪽 위) + SPEED UP! 알림 */\n  .speed {\n    position: absolute; left: 3%; top: 1.6%; z-index: 2; pointer-events: none;\n    font: 800 11px/1 var(--body); letter-spacing: .06em; color: var(--ink-faint);\n    padding: 4px 8px; border-radius: 99px; border: 1px solid var(--line);\n  }\n  .speed.up { animation: speed-up .6s ease-out; color: var(--paddle); border-color: var(--paddle); }\n  .speed.max { color: var(--heart); border-color: var(--heart); }\n  @keyframes speed-up { 30% { transform: scale(1.3); } }\n  .flash {\n    position: absolute; left: 0; right: 0; top: 46%; z-index: 2; text-align: center; pointer-events: none;\n    font: 400 30px/1 var(--cap); color: var(--paddle); text-shadow: 0 0 16px rgba(92,225,255,.6);\n    animation: flash .9s ease-out forwards;\n  }\n  @keyframes flash { 0% { opacity: 0; transform: scale(1.4); } 20% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }\n\n  /* ---------- 게임 화면 (논리 좌표 100 × 150, 화면에는 % 로 배치) ---------- */\n  .stage { position: relative; }\n  .field {\n    position: relative; aspect-ratio: 2 / 3; overflow: hidden;\n    background:\n      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 6.25%,\n      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 8.333% 100%,\n      linear-gradient(180deg, var(--night-2), var(--night));\n    border: 2px solid var(--line); border-radius: 0 0 16px 16px;\n    box-shadow: 0 20px 40px rgba(5,4,20,.5);\n    cursor: pointer; touch-action: none; /* 누르고 있는 동안 화면이 스크롤되지 않도록 */\n  }\n  /* 누르고 있는 쪽을 살짝 밝혀 줌 */\n  .field::after {\n    content: \"\"; position: absolute; top: 0; bottom: 0; width: 50%; pointer-events: none;\n    opacity: 0; transition: opacity .15s;\n  }\n  .field.go-left::after { left: 0; opacity: 1; background: linear-gradient(90deg, rgba(92,225,255,.10), transparent); }\n  .field.go-right::after { right: 0; opacity: 1; background: linear-gradient(270deg, rgba(92,225,255,.10), transparent); }\n  /* 미스: 화면이 붉게 번쩍 */\n  .field.missed { animation: miss-flash .7s ease-out; }\n  @keyframes miss-flash { 0%, 30% { box-shadow: inset 0 0 0 999px rgba(255,77,109,.22), 0 20px 40px rgba(5,4,20,.5); } }\n\n  .brick {\n    position: absolute; border-radius: 5px;\n    background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 45%), var(--c);\n    box-shadow: inset 0 -3px 0 rgba(0,0,0,.22), 0 0 10px color-mix(in srgb, var(--c) 45%, transparent);\n    transition: opacity .2s, transform .2s;\n  }\n  .brick.r1 { --c: var(--b1); }\n  .brick.r2 { --c: var(--b2); }\n  .brick.r3 { --c: var(--b3); }\n  .brick.r4 { --c: var(--b4); }\n  .brick.gone { opacity: 0; transform: scale(1.35); }\n\n  .ball {\n    position: absolute; left: 50%; top: 0; width: 4.4%; aspect-ratio: 1;\n    transform: translateX(-50%); border-radius: 50%;\n    background: radial-gradient(circle at 35% 30%, #fff, #DCE8FF 60%, #A9C2FF);\n    box-shadow: 0 0 12px rgba(180,210,255,.9);\n  }\n  .ball.hidden { opacity: 0; }\n  .paddle {\n    position: absolute; left: 50%; bottom: 13%; width: 26%; height: 3.2%;\n    transform: translateX(-50%); border-radius: 99px;\n    background: linear-gradient(180deg, #CFF6FF, var(--paddle) 55%, #2BA6D6);\n    box-shadow: 0 0 16px rgba(92,225,255,.6), inset 0 -2px 0 rgba(0,0,0,.2);\n  }\n  .paddle.bump { animation: paddle-bump .16s ease-out; }\n  @keyframes paddle-bump { 50% { transform: translateX(-50%) translateY(12%) scaleY(.8); } }\n\n  /* 가시 바닥: 공이 닿으면 미스 */\n  .spikes { position: absolute; left: 0; right: 0; bottom: 0; height: 6%; }\n  .spikes svg { display: block; width: 100%; height: 100%; }\n  .spikes::before {\n    content: \"\"; position: absolute; left: 0; right: 0; bottom: 100%; height: 22px;\n    background: linear-gradient(0deg, rgba(255,77,109,.18), transparent);\n    pointer-events: none;\n  }\n\n  /* 발사 안내 */\n  .prompt {\n    position: absolute; left: 0; right: 0; top: 60%; text-align: center; pointer-events: none;\n    font: 800 15px/1.4 var(--body); color: var(--ink-soft);\n    animation: blink 1.2s ease-in-out infinite;\n  }\n  .prompt.hidden { display: none; }\n  .prompt b { color: var(--paddle); }\n  @keyframes blink { 50% { opacity: .35; } }\n\n  /* ---------- 결과 (클리어 / 게임 오버) ---------- */\n  .overlay {\n    position: absolute; inset: 0; z-index: 5; display: none;\n    align-items: center; justify-content: center; padding: 16px;\n    background: rgba(11,10,26,.74); border-radius: 0 0 16px 16px;\n  }\n  .overlay.show { display: flex; animation: fade-in .3s ease-out; }\n  @keyframes fade-in { from { opacity: 0; } }\n  .card { width: 100%; max-width: 300px; text-align: center; animation: card-in .45s cubic-bezier(.34,1.56,.64,1); }\n  @keyframes card-in { from { transform: translateY(16px) scale(.92); opacity: 0; } }\n  .card h2 { margin: 0; font: 400 46px/1 var(--cap); letter-spacing: .02em; }\n  .card.clear h2 { color: var(--b3); text-shadow: 0 0 18px rgba(255,225,77,.5); }\n  .card.over h2 { color: var(--heart); text-shadow: 0 0 18px rgba(255,77,109,.5); }\n  .card .sub { margin: 8px 0 0; font-size: 14px; color: var(--ink-soft); }\n  .card .big { margin: 16px 0 0; font: 400 56px/1 var(--cap); font-variant-numeric: tabular-nums; }\n  .card .big small { font: 700 16px/1 var(--body); color: var(--ink-soft); margin-left: 4px; }\n  .card .best { display: inline-block; margin: 8px 0 0; padding: 4px 10px; border-radius: 99px; font: 800 12px/1.2 var(--body); background: var(--b3); color: var(--night); }\n  .card .best.plain { background: none; color: var(--ink-faint); font-weight: 600; }\n  .card .exp { margin: 14px 0 0; font: 800 18px/1 var(--body); color: var(--paddle); }\n  .card .lv { margin: 6px 0 0; font-size: 13px; color: var(--ink-soft); }\n  .card .lv b { color: var(--b3); }\n  /* 점수 계산표 */\n  .calc { width: 100%; margin: 14px 0 0; border-collapse: collapse; font-size: 13px; color: var(--ink-soft); }\n  .calc td { padding: 3px 0; text-align: left; }\n  .calc td:last-child { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }\n  .calc tr.total td { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 800; color: var(--ink); }\n  /* 난이도 선택 */\n  .modes { display: grid; gap: 10px; margin: 18px 0 0; }\n  .mode-btn {\n    display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left;\n    padding: 13px 16px; border-radius: 14px; cursor: pointer; font-family: var(--body); color: var(--ink);\n    background: rgba(255,255,255,.04); border: 2px solid var(--line);\n    transition: border-color .15s, background .15s;\n  }\n  .mode-btn:hover, .mode-btn:focus-visible { outline: none; border-color: var(--paddle); background: rgba(92,225,255,.06); }\n  .mode-btn b { font: 400 24px/1 var(--cap); }\n  .mode-btn.easy b { color: var(--b4); }\n  .mode-btn.normal b { color: var(--b2); }\n  .mode-btn.hard b { color: var(--heart); }\n  .mode-btn span { display: block; margin-top: 5px; font-size: 12px; color: var(--ink-soft); }\n  .mode-btn small { flex: none; font: 800 12px/1 var(--body); color: var(--b3); }\n  .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0 0; }\n  .btn {\n    padding: 12px 20px; border-radius: 99px; cursor: pointer;\n    font: 800 15px/1 var(--body); color: var(--night); background: var(--paddle); border: 0;\n    box-shadow: 0 0 16px rgba(92,225,255,.4);\n  }\n  .btn.ghost { color: var(--ink); background: transparent; border: 2px solid var(--line); box-shadow: none; text-decoration: none; }\n  .btn:focus-visible { outline: 2px solid var(--b3); outline-offset: 3px; }\n  .btn:active { transform: scale(.96); }\n\n  .hint { margin: 12px 0 0; text-align: center; font-size: 13px; line-height: 1.6; color: var(--ink-faint); }\n  .hint kbd {\n    font: 700 11px/1 var(--body); padding: 3px 6px; border-radius: 5px;\n    color: var(--ink-soft); border: 1px solid var(--line); border-bottom-width: 2px;\n  }\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n  }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cmain class=\"cab\"\u003e\n  \u003cheader class=\"top\"\u003e\n    \u003ca class=\"home\" href=\"../index.html\"\u003e← 홈\u003c/a\u003e\n    \u003cspan class=\"title\"\u003e벽돌깨기\u003c/span\u003e\n    \u003cspan class=\"mode-tag\" id=\"modeTag\"\u003e\u003c/span\u003e\n  \u003c/header\u003e\n\n  \u003cdiv class=\"hud\"\u003e\n    \u003cdiv class=\"score\"\u003e\u003cspan class=\"lbl\"\u003eSCORE\u003c/span\u003e\u003cb id=\"score\"\u003e0\u003c/b\u003e\u003c/div\u003e\n    \u003cb class=\"timer\" id=\"timer\" aria-label=\"남은 시간\"\u003e60.0\u003c/b\u003e\n    \u003cdiv class=\"lives\" id=\"lives\" aria-label=\"남은 공 3개\"\u003e\u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"stage\"\u003e\n    \u003cdiv class=\"field\" id=\"field\"\u003e\n      \u003cspan class=\"speed\" id=\"speed\"\u003eSPEED 50\u003c/span\u003e\n      \u003cdiv id=\"bricks\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"ball\" id=\"ball\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"paddle\" id=\"paddle\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"spikes\" aria-hidden=\"true\"\u003e\n        \u003csvg viewBox=\"0 0 120 10\" preserveAspectRatio=\"none\"\u003e\n          \u003cdefs\u003e\n            \u003clinearGradient id=\"spk\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"\u003e\n              \u003cstop offset=\"0\" stop-color=\"#FF4D6D\"/\u003e\u003cstop offset=\".32\" stop-color=\"#FF4D6D\"/\u003e\u003cstop offset=\".42\" stop-color=\"#E6E8F2\"/\u003e\n              \u003cstop offset=\"1\" stop-color=\"#6E7290\"/\u003e\n            \u003c/linearGradient\u003e\n            \u003cpattern id=\"spkp\" width=\"6\" height=\"10\" patternUnits=\"userSpaceOnUse\"\u003e\n              \u003cpath d=\"M0 10 L3 0 L6 10 Z\" fill=\"url(#spk)\"/\u003e\n              \u003cpath d=\"M3 0 L6 10 L3 10 Z\" fill=\"#000\" opacity=\".18\"/\u003e\n            \u003c/pattern\u003e\n          \u003c/defs\u003e\n          \u003crect width=\"120\" height=\"10\" fill=\"url(#spkp)\"/\u003e\n        \u003c/svg\u003e\n      \u003c/div\u003e\n      \u003cp class=\"prompt\" id=\"prompt\"\u003e\u003cb\u003eSpace\u003c/b\u003e 또는 화면을 눌러 발사!\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"overlay\" id=\"overlay\" role=\"dialog\" aria-live=\"assertive\"\u003e\u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cp class=\"hint\"\u003e\u003ckbd\u003e←\u003c/kbd\u003e \u003ckbd\u003e→\u003c/kbd\u003e 또는 화면 왼쪽·오른쪽을 누르고 있으면 패들 이동 · \u003ckbd\u003eSpace\u003c/kbd\u003e 발사\u003c/p\u003e\n\u003c/main\u003e\n\n\u003cscript\u003e\n// 메인 화면과 모든 게임이 함께 쓰는 코드: 게임 목록 + 레벨·경험치\n// 게임을 깨면 같은 경험치가 \u0027전체 레벨\u0027과 \u0027그 게임 레벨\u0027에 함께 쌓임\n\n// ---------- 게임 목록 ----------\n// href는 메인(index.html) 기준 경로 / lvKey: 게임별 레벨 저장 키\n// bests: { 표시 이름: 최고 기록 저장 키 } / bestUnit: 기록 단위\nconst GAMES = [\n  {\n    id: \u0027mission15\u0027,\n    title: \u002715초 미션\u0027,\n    desc: \u002715초 안에 미니게임 3개를 모두 깨라!\u0027,\n    href: \u0027games/mission15.html\u0027,\n    lvKey: \u0027lv15\u0027,\n    bests: { Easy: \u0027best15\u0027, Normal: \u0027best15_normal\u0027, Hard: \u0027best15_hard\u0027 },\n    bestUnit: \u0027초\u0027,\n  },\n  {\n    id: \u0027rps\u0027,\n    title: \u0027가위바위보\u0027,\n    desc: \u002710판 운 승부, 또는 15초 동안 이기는 패 골라내기!\u0027,\n    href: \u0027games/rps.html\u0027,\n    lvKey: \u0027lv_rps\u0027,\n    // 15초 모드는 점수 체계가 바뀌어(정답 +1 / 오답 -1) v2 키로 새로 시작\n    bests: { \u0027일반\u0027: \u0027rps_best\u0027, Easy: \u0027rps2_best_easy\u0027, Normal: \u0027rps2_best_normal\u0027, Hard: \u0027rps2_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027mole\u0027,\n    title: \u0027두더지 잡기\u0027,\n    desc: \u002715초 동안 두더지를 잡아라! 황금 두더지는 +30, 폭탄은 -50.\u0027,\n    href: \u0027games/mole.html\u0027,\n    lvKey: \u0027lv_mole\u0027,\n    // 점수 체계가 바뀌어(일반 +10 / 황금 +30 / 폭탄 -50 / 도망 -10 / 헛방 -1) v4 키로 새로 시작\n    bests: { Easy: \u0027mole4_best_easy\u0027, Normal: \u0027mole4_best_normal\u0027, Hard: \u0027mole4_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027brick\u0027,\n    title: \u0027벽돌깨기\u0027,\n    desc: \u002760초 안에 벽돌 24개를 모두 깨라! 4개마다 스피드 업.\u0027,\n    href: \u0027games/brick.html\u0027,\n    lvKey: \u0027lv_brick\u0027,\n    bests: { Easy: \u0027brick_best_easy\u0027, Normal: \u0027brick_best_normal\u0027, Hard: \u0027brick_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027runner\u0027,\n    title: \u0027시나모롤 런\u0027,\n    desc: \u0027귀를 팔랑이며 하늘을 날아라! 낮 · 밤 · 폭풍우 3가지 하늘.\u0027,\n    href: \u0027games/runner.html\u0027,\n    lvKey: \u0027lv_runner\u0027,\n    bests: { Easy: \u0027runner_best_easy\u0027, Normal: \u0027runner_best_normal\u0027, Hard: \u0027runner_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n];\n\n// ---------- 페이지 이동 ----------\n// 한 파일로 포장된 버전(dist/Claude_Game.html)에서는 바깥 틀(__pack)이 페이지를 바꿔 줌\nconst PACK = (() =\u003e { try { return (window.parent !== window \u0026\u0026 window.parent.__pack) || null; } catch { return null; } })();\nfunction goTo(href) { if (PACK) PACK.go(href); else location.href = href; }\nif (PACK) document.addEventListener(\u0027click\u0027, e =\u003e {\n  const a = e.target.closest(\u0027a[href]\u0027);\n  if (!a || /^(https?:|#|mailto:)/.test(a.getAttribute(\u0027href\u0027))) return;\n  e.preventDefault();\n  PACK.go(a.getAttribute(\u0027href\u0027));\n});\n\n// 예전 점수 체계(정답 +3)의 가위바위보 15초 모드 기록 정리\ntry { [\u0027rps_best_easy\u0027, \u0027rps_best_normal\u0027, \u0027rps_best_hard\u0027].forEach(k =\u003e localStorage.removeItem(k)); } catch {}\n// 예전 점수 체계의 두더지 잡기 · 난이도가 없던 벽돌깨기·시나모롤 런 기록 정리\ntry { [\u0027mole_best_easy\u0027, \u0027mole2_best_easy\u0027, \u0027mole2_best_normal\u0027, \u0027mole2_best_hard\u0027, \u0027mole3_best_easy\u0027, \u0027mole3_best_normal\u0027, \u0027mole3_best_hard\u0027, \u0027brick_best\u0027, \u0027runner_best\u0027].forEach(k =\u003e localStorage.removeItem(k)); } catch {}\n\n// ---------- 레벨 ----------\n// 다음 레벨까지 필요 경험치 = Lv² × 1000 (exp는 현재 레벨 안에서 쌓인 양)\nconst LV_ALL_KEY = \u0027lv_all\u0027;\nconst needExp = lv =\u003e lv * lv * 1000;\nconst fmt = n =\u003e n.toLocaleString(\u0027ko-KR\u0027);\n\nfunction loadLv(key = LV_ALL_KEY) {\n  try {\n    const s = JSON.parse(localStorage.getItem(key));\n    if (s \u0026\u0026 s.lv \u003e= 1 \u0026\u0026 s.exp \u003e= 0) return { lv: s.lv, exp: s.exp };\n  } catch {}\n  return { lv: 1, exp: 0 };\n}\nfunction saveLv(key, s) { try { localStorage.setItem(key, JSON.stringify(s)); } catch {} }\n\nfunction gainExp(key, gain) {\n  const from = loadLv(key);\n  const to = { ...from, exp: from.exp + gain };\n  while (to.exp \u003e= needExp(to.lv)) { to.exp -= needExp(to.lv); to.lv++; }\n  saveLv(key, to);\n  return { from, to };\n}\n\n// 게임 클리어 시 호출 → { all: 전체 레벨 변화, game: 게임 레벨 변화 }\nfunction giveExp(gameLvKey, gain) {\n  gain = Math.max(0, gain); // 음수 EXP로 레벨이 깎이지 않도록\n  return { all: gainExp(LV_ALL_KEY, gain), game: gainExp(gameLvKey, gain) };\n}\n\nfunction loadRecord(key) {\n  try { return parseFloat(localStorage.getItem(key)) || null; } catch { return null; }\n}\n\n\u003c/script\u003e\n\u003cscript\u003e\nconst GAME = GAMES.find(g =\u003e g.id === \u0027brick\u0027);\n\n// ---------- 규칙 ----------\nconst TIME_LIMIT = 60;       // 초\nconst BRICK_PTS = 10;        // 벽돌 1개\nconst TIME_BONUS = 10;       // (클리어) 남은 시간 1초당\nconst LIFE_BONUS = 100;      // (클리어 · 타임 오버) 남은 공 1개당\nconst MAX_LIVES = 3;\nconst SPEED_EVERY = 4;       // 벽돌 4개 깰 때마다 스피드 업\nconst PADDLE_STEP = .2;      // 패들 속도 +0.2 (공은 난이도별 step)\nconst SPEED_MAX_STACK = 5;   // 최대 5번\n\n// 난이도: speed = 공의 처음 속도 배율 / step = 스피드 업 1번에 오르는 공 속도 / layout = 벽돌 배치(\u0027#\u0027 = 벽돌, 줄마다 6칸) / expRate = EXP 배율\n// 배치는 모두 24개, 가장 아래 줄도 패들과 충분히 떨어지도록 최대 6줄\nconst MODES = {\n  easy: {\n    label: \u0027Easy\u0027, speed: 1.25, step: .075, expRate: 2, desc: \u0027공 속도 50~65 · 반듯한 4줄\u0027,\n    layout: [\n      \u0027######\u0027,\n      \u0027######\u0027,\n      \u0027######\u0027,\n      \u0027######\u0027,\n    ],\n  },\n  normal: {\n    label: \u0027Normal\u0027, speed: 1.5, step: .1, expRate: 4, desc: \u0027공 속도 60~80 · 빈틈 있는 5줄\u0027,\n    layout: [\n      \u0027######\u0027,\n      \u0027.####.\u0027,\n      \u0027######\u0027,\n      \u0027.####.\u0027,\n      \u0027##..##\u0027,\n    ],\n  },\n  hard: {\n    label: \u0027Hard\u0027, speed: 1.5, step: .2, expRate: 6, desc: \u0027공 속도 60~100 · 구멍 숭숭 6줄\u0027,\n    layout: [\n      \u0027##..##\u0027,\n      \u0027.####.\u0027,\n      \u0027#.##.#\u0027,\n      \u0027##..##\u0027,\n      \u0027.####.\u0027,\n      \u0027#.##.#\u0027,\n    ],\n  },\n};\n\n// ---------- 좌표 (가로 100 × 세로 150 의 논리 좌표, 화면 비율 2:3 과 같음) ----------\nconst W = 100, H = 150;\nconst pctY = y =\u003e y / H * 100;\nconst PADDLE_W = 26;                         // .paddle width: 26%\nconst PADDLE_H = H * .032;                   // .paddle height: 3.2%\nconst PADDLE_TOP = H * (1 - .13) - PADDLE_H; // .paddle bottom: 13%\nconst R = W * .044 / 2;                      // 공 반지름 (.ball width: 4.4%)\nconst SPIKE_TOP = H * (1 - .06);             // 가시 바닥 윗선 (.spikes height: 6%)\nconst PADDLE_BASE = 80;                      // 속도 1.0 일 때 패들: 1초에 화면 너비의 80%\nconst BALL_BASE = 85;                        // 속도 1.0 일 때 공: 1초에 85\nconst MAX_BOUNCE = 60 * Math.PI / 180;       // 패들 끝에 맞으면 최대 60° 로 튕김\n// 벽돌 칸: 양옆 여백 4, 칸 사이 1.8 / 줄 사이 2.2, 가로:세로 = 5:2\nconst COLS = 6;\nconst BRICK_LEFT = 4, BRICK_TOP = 10.5, GAP_X = 1.8, GAP_Y = 2.2;\nconst BRICK_W = (W - BRICK_LEFT * 2 - GAP_X * (COLS - 1)) / COLS;\nconst BRICK_H = BRICK_W * .4;\n\nconst field = document.getElementById(\u0027field\u0027);\nconst paddleEl = document.getElementById(\u0027paddle\u0027);\nconst ballEl = document.getElementById(\u0027ball\u0027);\nconst promptEl = document.getElementById(\u0027prompt\u0027);\nconst overlay = document.getElementById(\u0027overlay\u0027);\nconst timerEl = document.getElementById(\u0027timer\u0027);\nconst speedEl = document.getElementById(\u0027speed\u0027);\n\n// mode: select(난이도 선택) → ready(공이 패들 위) → play(날아다님) → miss(잠깐 멈춤) → ready …\n//       끝: clear(모두 파괴) · over(남은 공 0) · timeup(시간 0)\nlet M = MODES.easy, modeId = \u0027easy\u0027;\nlet mode = \u0027select\u0027, score, lives, bricks, broken, stack, paddleX, ball, timeLeft, clockOn;\n\nconst ballSpeed = () =\u003e BALL_BASE * (M.speed + stack * M.step);\nconst paddleSpeed = () =\u003e PADDLE_BASE * (1 + stack * PADDLE_STEP);\nconst bestKey = id =\u003e GAME.bests[MODES[id].label];\n\n// ---------- 그리기 ----------\nconst HEART = \u0027\u003csvg viewBox=\"0 0 24 24\"\u003e\u003cpath d=\"M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.9 4.5 6.6 4.5c2.2 0 3.6 1.2 5.4 3.2 1.8-2 3.2-3.2 5.4-3.2 3.7 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z\"/\u003e\u003c/svg\u003e\u0027;\n\nfunction buildBricks() {\n  bricks = [];\n  M.layout.forEach((line, r) =\u003e [...line].forEach((ch, c) =\u003e {\n    if (ch === \u0027#\u0027) bricks.push({ x: BRICK_LEFT + c * (BRICK_W + GAP_X), y: BRICK_TOP + r * (BRICK_H + GAP_Y), w: BRICK_W, h: BRICK_H, row: r, alive: true });\n  }));\n  const box = document.getElementById(\u0027bricks\u0027);\n  box.innerHTML = bricks.map(b =\u003e\n    `\u003cspan class=\"brick r${b.row % 4 + 1}\" style=\"left:${b.x}%;top:${pctY(b.y)}%;width:${b.w}%;height:${pctY(b.h)}%\"\u003e\u003c/span\u003e`).join(\u0027\u0027);\n  [...box.children].forEach((el, i) =\u003e { bricks[i].el = el; });\n}\n\nfunction renderHud(lostIndex = -1) {\n  const s = document.getElementById(\u0027score\u0027);\n  if (s.textContent !== String(score)) {\n    s.textContent = score;\n    s.classList.remove(\u0027bump\u0027); void s.offsetWidth; s.classList.add(\u0027bump\u0027);\n  }\n  const el = document.getElementById(\u0027lives\u0027);\n  el.innerHTML = Array.from({ length: MAX_LIVES }, (_, i) =\u003e\n    `\u003cspan class=\"${i \u003c lives ? \u0027on\u0027 : \u0027off\u0027} ${i === lostIndex ? \u0027lost\u0027 : \u0027\u0027}\"\u003e${HEART}\u003c/span\u003e`).join(\u0027\u0027);\n  el.setAttribute(\u0027aria-label\u0027, `남은 공 ${lives}개`);\n}\n\nfunction renderTimer() {\n  timerEl.textContent = timeLeft.toFixed(1);\n  timerEl.classList.toggle(\u0027low\u0027, timeLeft \u003c= 10);\n}\n\nfunction renderSpeed() {\n  // 화면 표시는 속도 1.0배 = 40 기준 (예: 1.25배 → SPEED 50)\n  speedEl.textContent = `SPEED ${+((M.speed + stack * M.step) * 40).toFixed(1)}${stack \u003e= SPEED_MAX_STACK ? \" MAX\" : \"\"}`;\n  speedEl.classList.toggle(\u0027max\u0027, stack \u003e= SPEED_MAX_STACK);\n}\n\nfunction draw() {\n  paddleEl.style.left = paddleX + \u0027%\u0027;\n  ballEl.style.left = ball.x + \u0027%\u0027;\n  ballEl.style.top = pctY(ball.y - R) + \u0027%\u0027;\n}\n\nfunction retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }\n\nfunction flash(text) {\n  field.querySelectorAll(\u0027.flash\u0027).forEach(f =\u003e f.remove());\n  const f = document.createElement(\u0027div\u0027);\n  f.className = \u0027flash\u0027;\n  f.textContent = text;\n  field.appendChild(f);\n  f.addEventListener(\u0027animationend\u0027, () =\u003e f.remove());\n}\n\n// ---------- 난이도 선택 ----------\nfunction showSelect() {\n  mode = \u0027select\u0027;\n  promptEl.classList.add(\u0027hidden\u0027);\n  document.getElementById(\u0027modeTag\u0027).textContent = \u0027\u0027;\n  overlay.innerHTML = `\n    \u003cdiv class=\"card\"\u003e\n      \u003ch2 style=\"color:var(--paddle)\"\u003e난이도\u003c/h2\u003e\n      \u003cp class=\"sub\"\u003e제한 시간 ${TIME_LIMIT}초 · 벽돌 24개\u003c/p\u003e\n      \u003cdiv class=\"modes\"\u003e${Object.entries(MODES).map(([id, m]) =\u003e {\n        const b = loadRecord(bestKey(id));\n        return `\u003cbutton class=\"mode-btn ${id}\" data-mode=\"${id}\"\u003e\n          \u003cdiv\u003e\u003cb\u003e${m.label}\u003c/b\u003e\u003cspan\u003e${m.desc} · EXP ×${m.expRate}\u003c/span\u003e\u003c/div\u003e\n          \u003csmall\u003e${b !== null ? `최고 ${b}` : \u0027\u0027}\u003c/small\u003e\u003c/button\u003e`;\n      }).join(\u0027\u0027)}\u003c/div\u003e\n    \u003c/div\u003e`;\n  overlay.classList.add(\u0027show\u0027);\n  overlay.querySelectorAll(\u0027.mode-btn\u0027).forEach(b =\u003e b.addEventListener(\u0027click\u0027, () =\u003e newGame(b.dataset.mode)));\n  overlay.querySelector(\u0027.mode-btn\u0027).focus();\n}\n\n// ---------- 게임 흐름 ----------\nfunction newGame(id = modeId) {\n  modeId = id; M = MODES[id];\n  document.getElementById(\u0027modeTag\u0027).textContent = M.label.toUpperCase();\n  score = 0; lives = MAX_LIVES; broken = 0; stack = 0; paddleX = 50;\n  timeLeft = TIME_LIMIT; clockOn = false;\n  ball = { x: 50, y: PADDLE_TOP - R, vx: 0, vy: 0 };\n  buildBricks();\n  overlay.classList.remove(\u0027show\u0027);\n  overlay.innerHTML = \u0027\u0027;\n  renderHud(); renderTimer(); renderSpeed();\n  ready();\n}\n\n// 공을 패들 위에 올려 두고 발사를 기다림\nfunction ready() {\n  mode = \u0027ready\u0027;\n  ballEl.classList.remove(\u0027hidden\u0027);\n  promptEl.classList.remove(\u0027hidden\u0027);\n}\n\nfunction launch() {\n  if (mode !== \u0027ready\u0027) return;\n  // 거의 수직으로, 좌우 ±20° 안에서 살짝 무작위\n  const a = (Math.random() * 2 - 1) * 20 * Math.PI / 180;\n  ball.vx = ballSpeed() * Math.sin(a);\n  ball.vy = -ballSpeed() * Math.cos(a);\n  mode = \u0027play\u0027;\n  clockOn = true; // 제한 시간은 첫 발사부터 흐름 (미스 뒤 대기 중에도 계속)\n  promptEl.classList.add(\u0027hidden\u0027);\n}\n\nfunction miss() {\n  mode = \u0027miss\u0027;\n  lives--;\n  renderHud(lives);\n  ballEl.classList.add(\u0027hidden\u0027);\n  retrigger(field, \u0027missed\u0027);\n  if (lives \u003c= 0) { clockOn = false; setTimeout(() =\u003e finish(\u0027over\u0027), 900); }\n  else setTimeout(() =\u003e { if (mode === \u0027miss\u0027) ready(); }, 1000);\n}\n\n// 벽돌 4개마다 공 속도 +step · 패들 +0.2 (최대 5번). 날아가는 공도 방향은 그대로 빨라짐\nfunction speedUp() {\n  if (stack \u003e= SPEED_MAX_STACK || broken % SPEED_EVERY) return;\n  stack++;\n  const k = ballSpeed() / Math.hypot(ball.vx, ball.vy);\n  ball.vx *= k; ball.vy *= k;\n  renderSpeed();\n  retrigger(speedEl, \u0027up\u0027);\n  flash(stack \u003e= SPEED_MAX_STACK ? \u0027SPEED MAX!\u0027 : \u0027SPEED UP!\u0027);\n}\n\n// ---------- 공 움직임 + 충돌 ----------\nconst clamp = (v, lo, hi) =\u003e Math.max(lo, Math.min(hi, v));\n\nfunction moveBall(dt) {\n  // 빠르게 움직여도 벽돌을 뚫고 지나가지 않도록 한 번에 0.8 이하씩 나눠서 이동\n  const steps = Math.max(1, Math.ceil(ballSpeed() * dt / .8));\n  const h = dt / steps;\n  for (let k = 0; k \u003c steps \u0026\u0026 mode === \u0027play\u0027; k++) {\n    const px = ball.x, py = ball.y;\n    ball.x += ball.vx * h;\n    ball.y += ball.vy * h;\n\n    // 왼쪽 · 오른쪽 · 위 벽\n    if (ball.x \u003c R) { ball.x = R; ball.vx = Math.abs(ball.vx); }\n    if (ball.x \u003e W - R) { ball.x = W - R; ball.vx = -Math.abs(ball.vx); }\n    if (ball.y \u003c R) { ball.y = R; ball.vy = Math.abs(ball.vy); }\n\n    // 패들: 위에서 내려와 패들 윗면을 지날 때만. 맞은 위치가 끝일수록 비스듬히 튕김\n    if (ball.vy \u003e 0 \u0026\u0026 py + R \u003c= PADDLE_TOP \u0026\u0026 ball.y + R \u003e= PADDLE_TOP\n        \u0026\u0026 Math.abs(ball.x - paddleX) \u003c= PADDLE_W / 2 + R * .6) {\n      const off = clamp((ball.x - paddleX) / (PADDLE_W / 2), -1, 1);\n      ball.vx = ballSpeed() * Math.sin(off * MAX_BOUNCE);\n      ball.vy = -ballSpeed() * Math.cos(off * MAX_BOUNCE);\n      ball.y = PADDLE_TOP - R;\n      retrigger(paddleEl, \u0027bump\u0027);\n    }\n\n    hitBrick(px, py);\n\n    if (mode === \u0027play\u0027 \u0026\u0026 ball.y + R \u003e= SPIKE_TOP) miss();\n  }\n}\n\n// 공(원)과 벽돌(사각형)이 겹치면 튕기고 벽돌 파괴 (한 번에 1개)\nfunction hitBrick(px, py) {\n  for (const b of bricks) {\n    if (!b.alive) continue;\n    const cx = clamp(ball.x, b.x, b.x + b.w), cy = clamp(ball.y, b.y, b.y + b.h);\n    const dx = ball.x - cx, dy = ball.y - cy;\n    if (dx * dx + dy * dy \u003e R * R) continue;\n\n    // 직전 위치로 어느 면에 맞았는지 판단: 옆에서 왔으면 좌우 반전, 위·아래에서 왔으면 상하 반전\n    const fromSide = px \u003c b.x || px \u003e b.x + b.w;\n    const fromTopBottom = py \u003c b.y || py \u003e b.y + b.h;\n    const sideDir = px \u003c b.x + b.w / 2 ? -1 : 1;  // 벽돌 왼쪽에서 왔으면 왼쪽으로\n    const vertDir = py \u003c b.y + b.h / 2 ? -1 : 1;  // 벽돌 위쪽에서 왔으면 위로\n    if (fromSide \u0026\u0026 !fromTopBottom) ball.vx = sideDir * Math.abs(ball.vx);\n    else if (!fromSide) ball.vy = vertDir * Math.abs(ball.vy);\n    else { ball.vx = sideDir * Math.abs(ball.vx); ball.vy = vertDir * Math.abs(ball.vy); } // 모서리\n\n    b.alive = false;\n    b.el.classList.add(\u0027gone\u0027);\n    broken++;\n    score += BRICK_PTS;\n    renderHud();\n    if (broken === bricks.length) {\n      mode = \u0027clear\u0027;\n      clockOn = false;\n      setTimeout(() =\u003e finish(\u0027clear\u0027), 600);\n    } else speedUp();\n    return;\n  }\n}\n\n// ---------- 결과 ----------\nfunction finish(kind) {\n  mode = kind;\n  // 보너스: 클리어 → 남은 시간 + 남은 공 / 타임 오버 → 남은 공 / 게임 오버 → 없음\n  const secLeft = Math.max(0, timeLeft);\n  const timePts = kind === \u0027clear\u0027 ? Math.floor(secLeft * TIME_BONUS) : 0;\n  const lifePts = kind === \u0027over\u0027 ? 0 : lives * LIFE_BONUS;\n  const brickPts = broken * BRICK_PTS;\n  score = brickPts + timePts + lifePts;\n  renderHud();\n\n  const key = bestKey(modeId);\n  const best = loadRecord(key);\n  const isBest = score \u003e 0 \u0026\u0026 (best === null || score \u003e best);\n  if (isBest) { try { localStorage.setItem(key, String(score)); } catch {} }\n\n  const gain = score * M.expRate;\n  const { all, game } = giveExp(GAME.lvKey, gain);\n  const up = all.to.lv \u003e all.from.lv || game.to.lv \u003e game.from.lv;\n\n  const title = { clear: \u0027CLEAR!\u0027, over: \u0027GAME OVER\u0027, timeup: \u0027TIME UP\u0027 }[kind];\n  const sub = {\n    clear: `벽돌을 모두 깼어요! ${secLeft.toFixed(1)}초 남김`,\n    over: \u0027공을 모두 잃었어요\u0027,\n    timeup: `시간 종료! 벽돌 ${broken} / ${bricks.length}개`,\n  }[kind];\n  const row = (label, v) =\u003e `\u003ctr\u003e\u003ctd\u003e${label}\u003c/td\u003e\u003ctd\u003e${fmt(v)}\u003c/td\u003e\u003c/tr\u003e`;\n  overlay.innerHTML = `\n    \u003cdiv class=\"card ${kind === \u0027clear\u0027 ? \u0027clear\u0027 : \u0027over\u0027}\"\u003e\n      \u003ch2\u003e${title}\u003c/h2\u003e\n      \u003cp class=\"sub\"\u003e${M.label} · ${sub}\u003c/p\u003e\n      \u003cdiv class=\"big\"\u003e${fmt(score)}\u003csmall\u003e점\u003c/small\u003e\u003c/div\u003e\n      ${isBest ? \u0027\u003cspan class=\"best\"\u003e최고 기록!\u003c/span\u003e\u0027 : best !== null ? `\u003cspan class=\"best plain\"\u003e최고 ${fmt(best)}점\u003c/span\u003e` : \u0027\u0027}\n      \u003ctable class=\"calc\"\u003e\n        ${row(`벽돌 ${broken}개 × ${BRICK_PTS}`, brickPts)}\n        ${kind === \u0027clear\u0027 ? row(`남은 시간 ${secLeft.toFixed(1)}초 × ${TIME_BONUS}`, timePts) : \u0027\u0027}\n        ${kind !== \u0027over\u0027 ? row(`남은 공 ${lives}개 × ${LIFE_BONUS}`, lifePts) : \u0027\u0027}\n        \u003ctr class=\"total\"\u003e\u003ctd\u003e합계\u003c/td\u003e\u003ctd\u003e${fmt(score)}\u003c/td\u003e\u003c/tr\u003e\n      \u003c/table\u003e\n      \u003cp class=\"exp\"\u003e+${fmt(gain)} EXP \u003csmall style=\"color:var(--ink-faint);font-weight:600\"\u003e(× ${M.expRate})\u003c/small\u003e\u003c/p\u003e\n      \u003cp class=\"lv\"\u003e${up ? \u0027\u003cb\u003e레벨 업!\u003c/b\u003e · \u0027 : \u0027\u0027}${GAME.title} Lv.${game.to.lv} · 전체 Lv.${all.to.lv}\u003c/p\u003e\n      \u003cdiv class=\"btns\"\u003e\n        \u003cbutton class=\"btn\" id=\"again\"\u003e다시 하기\u003c/button\u003e\n        \u003cbutton class=\"btn ghost\" id=\"pick\"\u003e난이도 선택\u003c/button\u003e\n        \u003ca class=\"btn ghost\" href=\"../index.html\"\u003e홈으로\u003c/a\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e`;\n  overlay.classList.add(\u0027show\u0027);\n  const again = overlay.querySelector(\u0027#again\u0027);\n  const pick = overlay.querySelector(\u0027#pick\u0027);\n  again.addEventListener(\u0027click\u0027, () =\u003e newGame());\n  pick.addEventListener(\u0027click\u0027, showSelect);\n  // 연타하던 Space로 바로 재시작되지 않도록 잠깐 뒤에 포커스\n  again.disabled = pick.disabled = true;\n  setTimeout(() =\u003e { again.disabled = pick.disabled = false; again.focus(); }, 600);\n}\n\n// ---------- 입력 ----------\n// 패들: 누르고 있는 동안 일정한 속도로 미끄러지고, 떼면 바로 멈춤\nconst held = { ArrowLeft: false, ArrowRight: false }; // 키보드\nconst pointers = new Map();                             // 누르고 있는 손가락·마우스 → -1(왼쪽) / 1(오른쪽)\n\n// 지금 가야 할 방향: -1 왼쪽, 1 오른쪽, 0 멈춤 (양쪽을 같이 누르면 상쇄)\nfunction moveDir() {\n  let d = (held.ArrowRight ? 1 : 0) - (held.ArrowLeft ? 1 : 0);\n  for (const v of pointers.values()) d += v;\n  return Math.sign(d);\n}\n\nwindow.addEventListener(\u0027keydown\u0027, e =\u003e {\n  if (e.key in held) { e.preventDefault(); held[e.key] = true; return; }\n  if ((e.key === \u0027 \u0027 || e.key === \u0027ArrowUp\u0027) \u0026\u0026 (mode === \u0027ready\u0027 || mode === \u0027play\u0027)) {\n    e.preventDefault();\n    if (!e.repeat) launch();\n  }\n});\nwindow.addEventListener(\u0027keyup\u0027, e =\u003e {\n  if (e.key in held) held[e.key] = false;\n});\n\n// 화면 왼쪽 절반을 누르면 왼쪽, 오른쪽 절반이면 오른쪽 (누른 채 반대편으로 끌면 방향도 바뀜)\nfunction sideOf(e) {\n  const r = field.getBoundingClientRect();\n  return e.clientX \u003c r.left + r.width / 2 ? -1 : 1;\n}\nfield.addEventListener(\u0027pointerdown\u0027, e =\u003e {\n  e.preventDefault();\n  try { field.setPointerCapture(e.pointerId); } catch {} // 화면 밖으로 끌고 나가도 뗄 때까지 추적\n  pointers.set(e.pointerId, sideOf(e));\n  launch(); // 발사 대기 중이면 화면을 누르는 것으로도 발사\n});\nfield.addEventListener(\u0027pointermove\u0027, e =\u003e {\n  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, sideOf(e));\n});\n[\u0027pointerup\u0027, \u0027pointercancel\u0027, \u0027lostpointercapture\u0027].forEach(type =\u003e\n  field.addEventListener(type, e =\u003e pointers.delete(e.pointerId)));\n\n// 다른 창으로 가면 누르던 키·손가락을 모두 뗀 것으로 처리 (계속 굴러가지 않도록)\nwindow.addEventListener(\u0027blur\u0027, () =\u003e { held.ArrowLeft = held.ArrowRight = false; pointers.clear(); });\n\n// ---------- 메인 루프 ----------\nconst ENDED = [\u0027select\u0027, \u0027clear\u0027, \u0027over\u0027, \u0027timeup\u0027];\nlet lastT = performance.now();\nfunction loop(t) {\n  const dt = Math.min(.033, Math.max(0, (t - lastT) / 1000)); // 탭이 멈췄다 돌아와도 순간이동하지 않도록\n  lastT = t;\n\n  if (clockOn) {\n    timeLeft = Math.max(0, timeLeft - dt);\n    renderTimer();\n    if (timeLeft \u003c= 0) {\n      clockOn = false;\n      mode = \u0027timeup\u0027;\n      ballEl.classList.add(\u0027hidden\u0027);\n      flash(\u0027TIME UP!\u0027);\n      setTimeout(() =\u003e finish(\u0027timeup\u0027), 900);\n    }\n  }\n\n  const dir = ENDED.includes(mode) ? 0 : moveDir();\n  if (dir) paddleX = clamp(paddleX + dir * paddleSpeed() * dt, PADDLE_W / 2, W - PADDLE_W / 2);\n  field.classList.toggle(\u0027go-left\u0027, dir \u003c 0);\n  field.classList.toggle(\u0027go-right\u0027, dir \u003e 0);\n\n  if (mode === \u0027ready\u0027) { ball.x = paddleX; ball.y = PADDLE_TOP - R; }\n  else if (mode === \u0027play\u0027) moveBall(dt);\n\n  if (ball) draw();\n  requestAnimationFrame(loop);\n}\n\n// 처음엔 Easy 판을 뒤에 깔아 두고 난이도 선택 창을 띄움\nnewGame(\u0027easy\u0027);\nshowSelect();\nrequestAnimationFrame(loop);\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","games/mission15.html":"\u003c!doctype html\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"\u003e\n\u003ctitle\u003e15초 미션\u003c/title\u003e\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Black+Han+Sans\u0026display=swap\" rel=\"stylesheet\"\u003e\n\u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\"\u003e\n\u003cstyle\u003e\n  /* 예능 미션 자막 — 스튜디오 핑크 배경 + 흰 미션 카드 + 외곽선 자막 */\n  :root {\n    --set: #FF3D8B;     --set-d: #D81E6C;   /* 스튜디오 배경 핑크 */\n    --ink: #17121C;     --ink-soft: #5E5468;\n    --paper: #FFFFFF;   --paper-2: #F6F1F4; --rule: #E6DCE2;\n    --yellow: #FFE14D;  --yellow-d: #E5B800;\n    --pink: #FF3D8B;    --pink-d: #C3165E;\n    --cyan: #27D3F5;    --cyan-d: #0E9DC0;\n    --green: #2FD07A;   --green-d: #179A55;\n    --win: #19C6E8;     --lose: #2A2230;\n\n    --cap: \"Black Han Sans\", \"Pretendard Variable\", system-ui, sans-serif;\n    --body: \"Pretendard Variable\", Pretendard, \"Apple SD Gothic Neo\", \"Malgun Gothic\", system-ui, sans-serif;\n    --pop: cubic-bezier(.34, 1.56, .64, 1);\n    --ease-out: cubic-bezier(.16, 1, .3, 1);\n    --line: 3px solid var(--ink);\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; min-height: 100%; }\n  ::selection { background: var(--yellow); color: var(--ink); }\n\n  body {\n    min-height: 100vh;\n    min-height: 100dvh;\n    display: grid;\n    place-items: center;\n    padding: 56px 16px 24px;\n    font-family: var(--body);\n    color: var(--ink);\n    background:\n      radial-gradient(rgba(255,255,255,.22) 2px, transparent 2.2px) 0 0 / 18px 18px,\n      var(--set);\n    background-attachment: fixed;\n    transition: background-color .5s var(--ease-out);\n    user-select: none;\n    -webkit-user-select: none;\n    -webkit-tap-highlight-color: transparent;\n    touch-action: manipulation;\n  }\n  body[data-state=\"win\"] { --set: var(--win); }\n  body[data-state=\"lose\"] { --set: var(--lose); }\n\n  /* 방송 화면 좌상단 로고 버그 */\n  .bug {\n    position: fixed; top: 14px; left: 16px; z-index: 0;\n    display: flex; align-items: center; gap: 8px;\n    font: 400 15px/1 var(--cap); color: #fff; letter-spacing: .02em;\n    opacity: .92; pointer-events: none;\n  }\n  .bug i { width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: blink 1.4s steps(2, jump-none) infinite; }\n  .bug b { font-weight: 400; padding: 4px 8px 3px; border-radius: 6px; background: var(--ink); }\n  @keyframes blink { 50% { opacity: .25; } }\n\n  /* 외곽선 자막 */\n  /* text-stroke는 글자 안쪽까지 먹어서, 그림자 링으로 바깥 외곽선만 그림 */\n  .cap {\n    --o: var(--ink); --d: 5px;\n    font-family: var(--cap); font-weight: 400;\n    letter-spacing: .01em;\n    text-shadow:\n      3px 0 0 var(--o), -3px 0 0 var(--o), 0 3px 0 var(--o), 0 -3px 0 var(--o),\n      2.1px 2.1px 0 var(--o), -2.1px 2.1px 0 var(--o), 2.1px -2.1px 0 var(--o), -2.1px -2.1px 0 var(--o),\n      2.8px 1.1px 0 var(--o), -2.8px 1.1px 0 var(--o), 2.8px -1.1px 0 var(--o), -2.8px -1.1px 0 var(--o),\n      1.1px 2.8px 0 var(--o), -1.1px 2.8px 0 var(--o), 1.1px -2.8px 0 var(--o), -1.1px -2.8px 0 var(--o),\n      0 var(--d) 0 var(--o), 2px var(--d) 0 var(--o), -2px var(--d) 0 var(--o);\n  }\n\n  .device {\n    position: relative; z-index: 1;\n    width: 100%;\n    max-width: 420px;\n    background: var(--paper);\n    border: var(--line);\n    border-radius: 26px;\n    overflow: hidden;\n    box-shadow: 0 18px 40px rgba(23,18,28,.35), 0 4px 10px rgba(23,18,28,.2);\n  }\n\n  svg.i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }\n\n  /* ---------- 카드 헤더 (HUD) ---------- */\n  .hud {\n    display: flex; align-items: center; justify-content: space-between; gap: 12px;\n    padding: 14px 18px 12px;\n    background: var(--yellow);\n    border-bottom: var(--line);\n  }\n  .clock { display: flex; align-items: center; gap: 8px; font-size: 22px; }\n  #time {\n    font: 400 38px/1 var(--cap);\n    font-variant-numeric: tabular-nums;\n    min-width: 3.4ch;\n    color: var(--ink);\n  }\n  .clock.low #time { color: var(--pink); animation: pulse .5s ease-in-out infinite alternate; }\n  @keyframes pulse { to { transform: scale(1.08); } }\n\n  .steps { display: flex; gap: 6px; margin: 0; padding: 0; list-style: none; }\n  .steps li {\n    width: 36px; height: 36px; border-radius: 10px;\n    display: grid; place-items: center;\n    font-size: 18px;\n    background: var(--paper); color: #B8AEBD;\n    border: 2.5px solid var(--ink);\n    transition: background .25s, color .25s, transform .35s var(--pop);\n  }\n  .steps li.now { background: var(--pink); color: #fff; transform: translateY(-3px) rotate(-6deg); }\n  .steps li.done { background: var(--ink); color: var(--yellow); animation: pop .4s var(--pop); }\n  @keyframes pop { 0% { transform: scale(.5); } 100% { transform: scale(1); } }\n\n  .timebar { height: 10px; background: var(--paper-2); border-bottom: var(--line); }\n  #timefill { height: 100%; width: 100%; background: var(--ink); transition: background-color .3s; }\n  #timefill.mid { background: var(--yellow-d); }\n  #timefill.low { background: var(--pink); }\n\n  /* ---------- Stage ---------- */\n  #stage { position: relative; min-height: 430px; display: flex; padding: 20px 20px 24px; }\n  .scene {\n    flex: 1;\n    display: flex; flex-direction: column; align-items: center; text-align: center;\n    animation: enter .45s var(--ease-out) both;\n  }\n  @keyframes enter { from { opacity: 0; transform: translateY(26px) rotate(1.5deg); } }\n  .shake { animation: shake .32s; }\n  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }\n\n  /* 미션 제목 = 자막이 \u0027팡\u0027 하고 박힘 */\n  h1 {\n    margin: 2px 0 8px; font-size: 31px; line-height: 1.15; color: #fff; text-wrap: balance;\n    animation: stamp .5s var(--pop) .08s both;\n  }\n  h1.yellow { color: var(--yellow); }\n  @keyframes stamp { from { opacity: 0; transform: scale(1.6) rotate(-4deg); } }\n  .desc { margin: 6px 0 4px; color: var(--ink-soft); font-size: 15px; line-height: 1.55; text-wrap: balance; }\n  .desc b { color: var(--ink); }\n  .rule {\n    display: inline-flex; align-items: center; gap: 6px;\n    margin: 8px 0 0; padding: 6px 12px 5px; border-radius: 8px;\n    background: var(--ink); color: var(--yellow);\n    font: 400 14px/1 var(--cap); letter-spacing: .01em;\n    transform: rotate(-1.5deg);\n  }\n  .play { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding-top: 14px; }\n\n  /* 실수 자막 (꽝!) */\n  .toast {\n    position: absolute; left: 50%; top: 42%; z-index: 5;\n    display: flex; flex-direction: column; align-items: center; gap: 2px;\n    color: var(--yellow); font-size: 40px; line-height: 1.05; white-space: nowrap;\n    pointer-events: none;\n    animation: toast 1.1s var(--ease-out) both;\n  }\n  .toast small { font-size: 22px; color: #fff; --d: 4px; }\n  @keyframes toast {\n    0% { opacity: 0; transform: translate(-50%, -50%) scale(1.9) rotate(-8deg); }\n    18% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-6deg); }\n    75% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-6deg); }\n    100% { opacity: 0; transform: translate(-50%, -64%) scale(.96) rotate(-6deg); }\n  }\n\n  /* ---------- Buttons ---------- */\n  .btn {\n    display: inline-flex; align-items: center; justify-content: center; gap: 10px;\n    font: 400 21px/1 var(--cap);\n    padding: 16px 26px 15px; border: var(--line); border-radius: 16px; cursor: pointer;\n    background: var(--yellow); color: var(--ink);\n    box-shadow: 0 5px 0 var(--ink), 0 12px 22px rgba(23,18,28,.18);\n    transition: transform .08s, box-shadow .08s, filter .15s;\n  }\n  .btn:hover { filter: brightness(1.04); }\n  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink), 0 4px 10px rgba(23,18,28,.15); }\n  .btn:disabled { filter: saturate(.25) brightness(1.05); cursor: default; }\n  .btn.pink { background: var(--pink); color: #fff; }\n  .btn.ghost { background: var(--paper); }\n  button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px; }\n\n  /* ---------- Intro ---------- */\n  .logo {\n    display: flex; flex-direction: column; align-items: center;\n    margin: 4px 0 4px; line-height: .92;\n    transform: rotate(-3deg);\n    animation: stamp .55s var(--pop) both;\n  }\n  .logo .n { font-size: 82px; color: var(--yellow); --d: 8px; }\n  .logo .w { font-size: 50px; color: #fff; margin-top: -4px; }\n  .tagline {\n    margin: 14px 0 0; padding: 7px 14px 6px; border-radius: 8px;\n    background: var(--pink); color: #fff; font: 400 16px/1.2 var(--cap);\n    transform: rotate(1.5deg);\n  }\n  /* 큐시트(진행표) */\n  .cue { list-style: none; margin: 20px 0 18px; padding: 0; width: 100%; text-align: left; counter-reset: cue; }\n  .cue li {\n    display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 12px;\n    padding: 10px 2px; border-bottom: 2px dashed var(--rule);\n  }\n  .cue li:first-child { border-top: 2px dashed var(--rule); }\n  .cue li::before {\n    counter-increment: cue; content: counter(cue);\n    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;\n    font: 400 18px/1 var(--cap); color: #fff; background: var(--ink);\n  }\n  .cue strong { display: block; font: 400 18px/1.2 var(--cap); }\n  .cue span { font-size: 13px; color: var(--ink-soft); }\n\n  .diff-row { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\n  .diff {\n    display: flex; flex-direction: column; align-items: center; gap: 7px;\n    padding: 15px 4px 12px; border: var(--line); border-radius: 16px; cursor: pointer;\n    font: 400 21px/1 var(--cap); letter-spacing: .02em;\n    box-shadow: 0 5px 0 var(--ink), 0 12px 22px rgba(23,18,28,.18);\n    transition: transform .08s, box-shadow .08s, filter .15s;\n  }\n  .diff small { font: 700 12px/1.2 var(--body); letter-spacing: 0; opacity: .85; font-variant-numeric: tabular-nums; }\n  .diff:hover { filter: brightness(1.05); }\n  .diff:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }\n  .diff:disabled { filter: saturate(.25); cursor: default; }\n  .diff.easy { background: var(--yellow); color: var(--ink); }\n  .diff.normal { background: var(--pink); color: #fff; }\n  .diff.hard { background: var(--ink); color: var(--yellow); box-shadow: 0 5px 0 var(--pink-d), 0 12px 22px rgba(23,18,28,.18); }\n  .diff.hard:active { box-shadow: 0 1px 0 var(--pink-d); }\n  .diff-tag {\n    display: inline-block; padding: 5px 10px 4px; border-radius: 7px; border: 2.5px solid var(--ink);\n    font: 400 14px/1 var(--cap); letter-spacing: .04em; transform: rotate(-3deg);\n  }\n  .diff-tag.easy { background: var(--yellow); }\n  .diff-tag.normal { background: var(--pink); color: #fff; }\n  .diff-tag.hard { background: var(--ink); color: var(--yellow); }\n  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }\n  .btn-row .btn { padding: 15px 18px 14px; font-size: 19px; }\n  .hint { margin: 16px 0 0; font-size: 13px; color: var(--ink-soft); }\n  .hint kbd {\n    font: 700 12px var(--body); padding: 2px 7px; border-radius: 6px;\n    background: var(--paper-2); border: 1.5px solid var(--ink); border-bottom-width: 3px;\n  }\n  @media (pointer: coarse) { .hint { display: none; } }\n\n  /* ---------- Mission 1: 딱 N번 ---------- */\n  .mash {\n    position: relative; overflow: hidden;\n    width: 184px; height: 184px; border-radius: 50%; border: 4px solid var(--ink); cursor: pointer;\n    background: var(--pink); color: #fff;\n    box-shadow: 0 9px 0 var(--ink), 0 22px 36px rgba(23,18,28,.25);\n    display: flex; flex-direction: column; align-items: center; justify-content: center;\n    transition: transform .06s, box-shadow .06s, background .2s;\n  }\n  .mash:active { transform: translateY(7px); box-shadow: 0 2px 0 var(--ink), 0 8px 16px rgba(23,18,28,.2); }\n  .mash-num { position: relative; z-index: 1; font-size: 76px; line-height: 1; }\n  .mash-label { position: relative; z-index: 1; font: 400 17px/1 var(--cap); margin-top: 6px; }\n  .mash-fill { position: absolute; inset: auto 0 0 0; height: 0; background: rgba(255,255,255,.35); }\n  .mash.wait { background: var(--yellow); color: var(--ink); }\n  .mash.wait .mash-num { color: var(--pink); font-size: 46px; }\n  .mash.wait .mash-fill { height: 100%; transition: height .5s linear; }\n  .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 220px; }\n  .dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--paper-2); border: 2px solid var(--ink); transition: background .12s, transform .25s var(--pop); }\n  .dots i.on { background: var(--pink); transform: scale(1.15); }\n  .dots.full i { background: var(--yellow); }\n\n  /* ---------- Mission 2: 순서대로 ---------- */\n  .next { font: 400 18px/1 var(--cap); color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }\n  .next b { font-weight: 400; font-size: 34px; color: var(--cyan); }\n  .field {\n    position: relative; width: 100%; height: 260px; border-radius: 18px; border: var(--line);\n    background:\n      radial-gradient(var(--rule) 1.6px, transparent 1.8px) 0 0 / 16px 16px,\n      var(--paper-2);\n  }\n  .num {\n    position: absolute; width: var(--size, 60px); height: var(--size, 60px); border-radius: 50%; padding: 0; cursor: pointer;\n    border: calc(var(--size, 60px) * .05 + 1px) solid var(--ink);\n    background: var(--cyan); color: var(--ink); font: 400 calc(var(--size, 60px) * .48)/1 var(--cap);\n    box-shadow: 0 calc(var(--size, 60px) * .07) 0 var(--ink);\n    transition: transform .06s, box-shadow .06s;\n    animation: appear .35s var(--pop) both;\n  }\n  .num:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }\n  .num.hit { animation: vanish .25s var(--ease-out) forwards; pointer-events: none; }\n  @keyframes appear { from { opacity: 0; transform: scale(.3); } }\n  @keyframes vanish { to { opacity: 0; transform: scale(1.6) rotate(12deg); } }\n\n  /* ---------- Mission 3: 타이밍 ---------- */\n  .track {\n    position: relative; width: 100%; height: 68px; border-radius: 16px; border: var(--line);\n    background: var(--paper-2);\n  }\n  .zone {\n    position: absolute; top: 7px; bottom: 7px; border-radius: 8px;\n    background: repeating-linear-gradient(-45deg, var(--green) 0 8px, #5BE39A 8px 16px);\n    box-shadow: inset 0 0 0 2.5px var(--ink);\n  }\n  .cursor {\n    position: absolute; top: -9px; bottom: -9px; width: 12px; margin-left: -6px; border-radius: 99px;\n    background: var(--ink); box-shadow: 0 3px 8px rgba(23,18,28,.35);\n    transition: background .15s;\n  }\n  .track.frozen .cursor { background: var(--pink); }\n  .track.frozen { animation: shake .32s; }\n  .btn.locked { background: var(--paper-2); color: var(--ink-soft); }\n\n  /* ---------- Result ---------- */\n  .result-cap { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 18px 0 2px; }\n  .result-cap h1 { font-size: 48px; margin: 0; transform: rotate(-3deg); }\n  .result-cap.lose h1 { color: var(--pink); }\n  .big-time {\n    font: 400 78px/1 var(--cap); letter-spacing: -0.02em;\n    font-variant-numeric: tabular-nums; margin: 14px 0 6px;\n  }\n  .big-time small { font-size: 28px; margin-left: 4px; color: var(--ink-soft); }\n  .record {\n    display: inline-flex; align-items: center; gap: 6px;\n    padding: 7px 14px; border-radius: 99px; margin: 6px 0 24px;\n    font-size: 14px; font-weight: 700;\n    background: var(--paper-2); color: var(--ink-soft);\n  }\n  /* 신기록 = 비스듬히 붙는 스티커 */\n  .record.new {\n    border-radius: 10px; border: var(--line);\n    background: var(--yellow); color: var(--ink);\n    font: 400 20px/1 var(--cap); padding: 9px 16px 8px;\n    animation: sticker .6s var(--pop) .35s both;\n  }\n  @keyframes sticker { from { opacity: 0; transform: scale(2.2) rotate(-14deg); } to { transform: rotate(-5deg); } }\n  .progress-row { display: flex; gap: 10px; margin: 18px 0 24px; }\n  .progress-row span {\n    width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center;\n    font-size: 24px; background: var(--paper-2); color: #B8AEBD; border: 2.5px solid var(--rule);\n  }\n  .progress-row span.done { background: var(--ink); color: var(--yellow); border-color: var(--ink); }\n  .progress-row span.fail { background: var(--pink); color: #fff; border-color: var(--ink); transform: rotate(-6deg); }\n  .spacer { flex: 1; }\n\n  /* ---------- 레벨 / 경험치 ---------- */\n  .lv { width: 100%; display: flex; align-items: center; gap: 12px; margin: 0 0 14px; text-align: left; }\n  .lv-badge {\n    flex: none; min-width: 64px; text-align: center;\n    padding: 8px 10px 7px; border-radius: 10px; border: 2.5px solid var(--ink);\n    background: var(--ink); color: var(--yellow);\n    font: 400 19px/1 var(--cap); letter-spacing: .02em; font-variant-numeric: tabular-nums;\n    transform: rotate(-3deg);\n  }\n  .lv-badge.up { animation: lvup .55s var(--pop); }\n  @keyframes lvup { 0% { transform: scale(1.8) rotate(-12deg); background: var(--yellow); color: var(--ink); } 100% { transform: rotate(-3deg); } }\n  .lv-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }\n  .lv-bar { height: 16px; border-radius: 99px; border: 2.5px solid var(--ink); background: var(--paper-2); overflow: hidden; }\n  .lv-fill { display: block; height: 100%; background: var(--cyan); border-right: 2.5px solid var(--ink); transition: width .7s var(--ease-out); }\n  .lv-fill[style*=\"width:0%\"], .lv-fill[style*=\"width: 0%\"] { border-right: 0; }\n  .lv-num { font: 700 12px/1 var(--body); color: var(--ink-soft); font-variant-numeric: tabular-nums; }\n  /* 전체 레벨 = 게임 레벨 아래 한 줄 작게 */\n  .lv + .lv.small { margin-top: -6px; }\n  .lv.s

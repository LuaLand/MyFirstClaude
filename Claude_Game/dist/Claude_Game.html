  .pick kbd { font: 400 14px/1 var(--hand); color: var(--ink-faint); }\n  .pick:hover { background: var(--hl); }\n  .pick:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--ink); }\n  .pick:disabled { cursor: default; background: var(--paper); }\n  .pick.chosen { background: var(--hl); }\n  @media (pointer: coarse) { .pick kbd { display: none; } }\n\n  /* ---------- 결과 ---------- */\n  .final { position: relative; text-align: center; margin: 18px 0 0; }\n  .final .lbl { font-size: 20px; color: var(--ink-soft); }\n  .final .score { position: relative; display: inline-block; margin-top: 2px; padding: 0 22px; font: 400 88px/1 var(--pen); color: var(--red); font-variant-numeric: tabular-nums; }\n  .final .score::after {\n    content: \"\"; position: absolute; inset: 2px -4px -2px; pointer-events: none;\n    border: 3.5px solid var(--red); border-radius: 50% 46% 52% 48% / 54% 50% 48% 46%;\n    transform: rotate(-3deg);\n  }\n  .final .score small { font-size: 40px; }\n  .wdl { margin: 8px 0 0; font-size: 19px; }\n  .wdl b { font-size: 24px; }\n  .new-best {\n    display: inline-block; margin-top: 8px; padding: 4px 12px 2px;\n    font: 700 19px/1.2 var(--hand); color: var(--red);\n    border: 2.5px solid var(--red); border-radius: 6px; transform: rotate(-5deg);\n    animation: stamp .45s var(--pop) .3s both;\n  }\n  .exp-gain { margin: 14px 0 0; text-align: center; font: 400 40px/1 var(--pen); color: var(--ink); animation: stamp .45s var(--pop) .45s both; }\n  .exp-gain mark { background: linear-gradient(transparent 50%, var(--hl-blue) 50% 92%, transparent 92%); color: inherit; padding: 0 6px; }\n  .exp-calc { margin: 2px 0 10px; text-align: center; font-size: 16px; color: var(--ink-soft); }\n\n  /* ---------- 레벨 (연필 칠한 막대) ---------- */\n  .lv { display: flex; align-items: center; gap: 10px; margin: 10px 0 0; }\n  .lv-badge {\n    flex: none; min-width: 66px; text-align: center;\n    font: 700 21px/1 var(--hand); padding: 5px 8px 3px;\n    border: 2.5px x 0 0; }\n  .mode-card {\n    display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;\n    padding: 12px 14px 10px; cursor: pointer;\n    background: var(--paper); border: 3px solid var(--ink); border-radius: var(--wobble);\n    box-shadow: 3px 4px 0 var(--ink); color: var(--ink);\n    transition: transform .08s, box-shadow .08s, background .15s;\n  }\n  .mode-card:nth-child(even) { border-radius: 16px 225px 14px 255px / 225px 14px 255px 16px; }\n  .mode-card:hover { background: var(--hl); }\n  .mode-card:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--ink); }\n  .mode-card:focus-visible { outline: 2px dashed var(--red); outline-offset: 4px; }\n  .mode-card b { font: 400 34px/1 var(--pen); }\n  .mode-card.hard b { color: var(--red); }\n  .mode-card span { font: 400 16px/1.25 var(--hand); color: var(--ink-soft); }\n  .mode-card small { font: 700 15px/1 var(--hand); color: var(--red); margin-top: 2px; }\n  .mode-card.wide { grid-column: 1 / -1; }\n  .section-note { margin: 18px 0 0; font-size: 17px; color: var(--ink-soft); }\n  .back { align-self: flex-start; margin: 10px 0 0 -8px; font: 700 18px/1 var(--hand); color: var(--ink-soft); background: none; border: 0; padding: 4px 8px; cursor: pointer; border-radius: 6px; }\n  .back:hover { background: var(--hl-blue); color: var(--ink); }\n\n  /* ---------- 15초 모드 ---------- */\n  .qhud { display: flex; align-items: baseline; justify-content: space-between; margin: 10px 2px 0; }\n  .qclock { font-size: 20px; color: var(--ink-soft); }\n  .qclock b { font: 400 54px/1 var(--pen); color: var(--ink); font-variant-numeric: tabular-nums; display: inline-block; min-width: 2.6ch; }\n  .qclock.low b { color: var(--red); }\n  .qscore { font-size: 20px; color: var(--ink-soft); }\n  .qscore b { display: inline-block; font: 400 54px/1 var(--pen); color: var(--red); font-variant-numeric: tabular-nums; }\n  /* 연필로 그은 남은 시간 줄 */\n  .tbar { height: 10px; margin: 4px 0 0; border-bottom: 2px dashed var(--ink-faint); }\n  .tbar i { display: block; height: 7px; width: 100%; border-radius: 4px; background: repeating-linear-gradient(-55deg, var(--ink) 0 2px, transparent 2px 4px); opacity: .7; }\n  .tbar.low i { background: repeating-linear-gradient(-55deg, var(--red) 0 2px, transparent 2px 4px); }\n\n  .cue { position: relative; display: flex; flex-direction: column; align-items: center; margin: 14px 0 0; padding: 6px 0 4px; }\n  .cue .who { font-size: 18px; }\n  .cue .hand { width: 128px; height: 128px; transition: transform .3s var(--pop); }\n  .cue .hand.next { animation: reveal .3s var(--pop); }\n  .ask { margin-top: 2px; font: 700 21px/1.2 var(--hand); }\n  .ask mark { background: linear-gradient(transparent 55%, var(--hl) 55% 92%, transparent 92%); color: inherit; padding: 0 3px; }\n  /* 리버스: 상대 패가 뒤집히고 빨간 도장이 찍힘 */\n  .cue { border: 2.5px dashed transparent; border-radius: 14px; transition: background .2s, border-color .2s; }\n  .cue.rev { background: rgba(222,62,46,.08); border-color: var(--red); }\n  .cue.rev .hand { transform: rotate(180deg); }\n  .cue.rev .ask { color: var(--red); }\n  .cue.rev .ask mark { background: linear-gradient(transparent 55%, #FFC9C2 55% 92%, transparent 92%); }\n  .rev-stamp {\n    position: absolute; top: 18px; right: 6px; display: none;\n    font: 400 30px/1 var(--pen); color: var(--red); letter-spacing: .04em;\n    padding: 4px 10px 1px; border: 3px solid var(--red); border-radius: 6px; transform: rotate(12deg);\n  }\n  .cue.rev .rev-stamp { display: block; animation: stamp .3s var(--pop); }\n\n  .fb { min-height: 46px; margin: 4px 0 0; text-align: center; font: 400 38px/1.1 var(--pen); }\n  .fb .win { color: var(--red); }\n  .fb .draw { color: var(--ink); }\n  .fb .miss { color: var(--ink-soft); }\n  .fb span { display: inline-block; animation: stamp .3s var(--pop) both; }\n  .picks.locked .pick { background: #EEEAE0; color: var(--ink-faint); border-color: var(--ink-faint); box-shadow: 3px 4px 0 var(--ink-faint); }\n  .picks.locked .pick span { opacity: .4; }\n  .picks.shake { animation: wiggle .32s; }\n  @keyframes wiggle { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }\n\n  @media (max-width: 400px) {\n    .page { padding: 16px 14px 20px 40px; }\n    .page { background:\n      linear-gradient(90deg, transparent 29px, var(--margin) 29px 31px, transparent 31px),\n      repeating-linear-gradient(180deg, transparent 0 31px, var(--rule) 31px 32px) 0 14px,\n      var(--paper); }\n    .page::before { left: 8px; }\n    .cell .mk { width: 22px; height: 22px; }\n    .cell .pt { font-size: 11px; }\n    .hand { width: 100px; height: 100px; }\n    .pick span { width: 52px; height: 52px; }\n  }\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n  }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003c!-- 볼펜 선을 살짝 떨리게 만드는 필터 --\u003e\n\u003csvg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\"\u003e\n  \u003cfilter id=\"rough\"\u003e\u003cfeTurbulence type=\"fractalNoise\" baseFrequency=\"0.035\" numOctaves=\"2\" seed=\"7\"/\u003e\u003cfeDisplacementMap in=\"SourceGraphic\" scale=\"3.2\"/\u003e\u003c/filter\u003e\n\u003c/svg\u003e\n\n\u003cmain class=\"page\"\u003e\n  \u003cheader class=\"pg-head\"\u003e\n    \u003ca class=\"home\" href=\"../index.html\"\u003e← 홈\u003c/a\u003e\n    \u003cspan class=\"mode\" id=\"modeTag\"\u003e모드 선택\u003c/span\u003e\n  \u003c/header\u003e\n  \u003csection id=\"stage\" aria-live=\"polite\"\u003e\u003c/section\u003e\n\u003c/main\u003e\n\n\u003cscript\u003e\n// 메인 화면과 모든 게임이 함께 쓰는 코드: 게임 목록 + 레벨·경험치\n// 게임을 깨면 같은 경험치가 \u0027전체 레벨\u0027과 \u0027그 게임 레벨\u0027에 함께 쌓임\n\n// ---------- 게임 목록 ----------\n// href는 메인(index.html) 기준 경로 / lvKey: 게임별 레벨 저장 키\n// bests: { 표시 이름: 최고 기록 저장 키 } / bestUnit: 기록 단위\nconst GAMES = [\n  {\n    id: \u0027mission15\u0027,\n    title: \u002715초 미션\u0027,\n    desc: \u002715초 안에 미니게임 3개를 모두 깨라!\u0027,\n    href: \u0027games/mission15.html\u0027,\n    lvKey: \u0027lv15\u0027,\n    bests: { Easy: \u0027best15\u0027, Normal: \u0027best15_normal\u0027, Hard: \u0027best15_hard\u0027 },\n    bestUnit: \u0027초\u0027,\n  },\n  {\n    id: \u0027rps\u0027,\n    title: \u0027가위바위보\u0027,\n    desc: \u002710판 운 승부, 또는 15초 동안 이기는 패 골라내기!\u0027,\n    href: \u0027games/rps.html\u0027,\n    lvKey: \u0027lv_rps\u0027,\n    // 15초 모드는 점수 체계가 바뀌어(정답 +1 / 오답 -1) v2 키로 새로 시작\n    bests: { \u0027일반\u0027: \u0027rps_best\u0027, Easy: \u0027rps2_best_easy\u0027, Normal: \u0027rps2_best_normal\u0027, Hard: \u0027rps2_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027mole\u0027,\n    title: \u0027두더지 잡기\u0027,\n    desc: \u002715초 동안 두더지를 잡아라! 황금 두더지는 +30, 폭탄은 -50.\u0027,\n    href: \u0027games/mole.html\u0027,\n    lvKey: \u0027lv_mole\u0027,\n    // 점수 체계가 바뀌어(일반 +10 / 황금 +30 / 폭탄 -50 / 도망 -10 / 헛방 -1) v4 키로 새로 시작\n    bests: { Easy: \u0027mole4_best_easy\u0027, Normal: \u0027mole4_best_normal\u0027, Hard: \u0027mole4_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027brick\u0027,\n    title: \u0027벽돌깨기\u0027,\n    desc: \u002760초 안에 벽돌 24개를 모두 깨라! 4개마다 스피드 업.\u0027,\n    href: \u0027games/brick.html\u0027,\n    lvKey: \u0027lv_brick\u0027,\n    bests: { Easy: \u0027brick_best_easy\u0027, Normal: \u0027brick_best_normal\u0027, Hard: \u0027brick_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027runner\u0027,\n    title: \u0027시나모롤 런\u0027,\n    desc: \u0027귀를 팔랑이며 하늘을 날아라! 낮 · 밤 · 폭풍우 3가지 하늘.\u0027,\n    href: \u0027games/runner.html\u0027,\n    lvKey: \u0027lv_runner\u0027,\n    bests: { Easy: \u0027runner_best_easy\u0027, Normal: \u0027runner_best_normal\u0027, Hard: \u0027runner_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n];\n\n// ---------- 페이지 이동 ----------\n// 한 파일로 포장된 버전(dist/Claude_Game.html)에서는 바깥 틀(__pack)이 페이지를 바꿔 줌\nconst PACK = (() =\u003e { try { return (window.parent !== window \u0026\u0026 window.parent.__pack) || null; } catch { return null; } })();\nfunction goTo(href) { if (PACK) PACK.go(href); else location.href = href; }\nif (PACK) document.addEventListener(\u0027click\u0027, e =\u003e {\n  const a = e.target.closest(\u0027a[href]\u0027);\n  if (!a || /^(https?:|#|mailto:)/.test(a.getAttribute(\u0027href\u0027))) return;\n  e.preventDefault();\n  PACK.go(a.getAttribute(\u0027href\u0027));\n});\n\n// 예전 점수 체계(정답 +3)의 가위바위보 15초 모드 기록 정리\ntry { [\u0027rps_best_easy\u0027, \u0027rps_best_normal\u0027, \u0027rps_best_hard\u0027].forEach(k =\u003e localStorage.removeItem(k)); } catch {}\n// 예전 점수 체계의 두더지 잡기 · 난이도가 없던 벽돌깨기·시나모롤 런 기록 정리\ntry { [\u0027mole_best_easy\u0027, \u0027mole2_best_easy\u0027, \u0027mole2_best_normal\u0027, \u0027mole2_best_hard\u0027, \u0027mole3_best_easy\u0027, \u0027mole3_best_normal\u0027, \u0027mole3_best_hard\u0027, \u0027brick_best\u0027, \u0027runner_best\u0027].forEach(k =\u003e localStorage.removeItem(k)); } catch {}\n\n// ---------- 레벨 ----------\n// 다음 레벨까지 필요 경험치 = Lv² × 1000 (exp는 현재 레벨 안에서 쌓인 양)\nconst LV_ALL_KEY = \u0027lv_all\u0027;\nconst needExp = lv =\u003e lv * lv * 1000;\nconst fmt = n =\u003e n.toLocaleString(\u0027ko-KR\u0027);\n\nfunction loadLv(key = LV_ALL_KEY) {\n  try {\n    const s = JSON.parse(localStorage.getItem(key));\n    if (s \u0026\u0026 s.lv \u003e= 1 \u0026\u0026 s.exp \u003e= 0) return { lv: s.lv, exp: s.exp };\n  } catch {}\n  return { lv: 1, exp: 0 };\n}\nfunction saveLv(key, s) { try { localStorage.setItem(key, JSON.stringify(s)); } catch {} }\n\nfunction gainExp(key, gain) {\n  const from = loadLv(key);\n  const to = { ...from, exp: from.exp + gain };\n  while (to.exp \u003e= needExp(to.lv)) { to.exp -= needExp(to.lv); to.lv++; }\n  saveLv(key, to);\n  return { from, to };\n}\n\n// 게임 클리어 시 호출 → { all: 전체 레벨 변화, game: 게임 레벨 변화 }\nfunction giveExp(gameLvKey, gain) {\n  gain = Math.max(0, gain); // 음수 EXP로 레벨이 깎이지 않도록\n  return { all: gainExp(LV_ALL_KEY, gain), game: gainExp(gameLvKey, gain) };\n}\n\nfunction loadRecord(key) {\n  try { return parseFloat(localStorage.getItem(key)) || null; } catch { return null; }\n}\n\n\u003c/script\u003e\n\u003cscript\u003e\nconst ROUNDS = 10;\nconst GAME = GAMES.find(g =\u003e g.id === \u0027rps\u0027);\nconst stage = document.getElementById(\u0027stage\u0027);\nconst sleep = ms =\u003e new Promise(r =\u003e setTimeout(r, ms));\n// 점수는 소수 둘째 자리까지라 1/100점 단위 정수로 계산 (부동소수 오차 방지)\nconst pts = n =\u003e (n / 100).toFixed(2);\n\n// ---------- 손그림 ----------\nconst DOODLE = {\n  // 가위: 손잡이 두 개 + 날 두 개\n  scissors: `\u003csvg class=\"doodle rough\" viewBox=\"0 0 100 100\"\u003e\n    \u003cpath class=\"fl\" fill=\"#E9EEF5\" d=\"M41 63 L60 11 Q64 12 63 18 L48 65 Z\"/\u003e\n    \u003cpath class=\"fl\" fill=\"#E9EEF5\" d=\"M59 63 L40 11 Q36 12 37 18 L52 65 Z\"/\u003e\n    \u003cellipse class=\"fl\" fill=\"#F47C6B\" cx=\"33\" cy=\"76\" rx=\"14\" ry=\"11\" transform=\"rotate(-18 33 76)\"/\u003e\n    \u003cellipse class=\"fl\" fill=\"#F47C6B\" cx=\"67\" cy=\"76\" rx=\"14\" ry=\"11\" transform=\"rotate(18 67 76)\"/\u003e\n    \u003cellipse fill=\"#FFFEF7\" cx=\"33\" cy=\"76\" rx=\"6.5\" ry=\"4.5\" transform=\"rotate(-18 33 76)\"/\u003e\n    \u003cellipse fill=\"#FFFEF7\" cx=\"67\" cy=\"76\" rx=\"6.5\" ry=\"4.5\" transform=\"rotate(18 67 76)\"/\u003e\n    \u003ccircle fill=\"#27314F\" cx=\"50\" cy=\"41\" r=\"3.6\"/\u003e\u003c/svg\u003e`,\n  // 바위: 울퉁불퉁한 돌 + 금\n  rock: `\u003csvg class=\"doodle rough\" viewBox=\"0 0 100 100\"\u003e\n    \u003cpath class=\"fl\" fill=\"#C9C2B5\" d=\"M16 70 Q12 50 28 38 Q36 20 58 24 Q80 26 86 48 Q92 68 76 78 Q56 88 34 84 Q18 81 16 70 Z\"/\u003e\n    \u003cpath class=\"ln\" d=\"M40 40 Q47 48 43 58 M64 50 L72 57 M30 66 Q36 64 38 70\"/\u003e\n    \u003cpath class=\"ln\" stroke-width=\"2.4\" d=\"M58 32 Q70 33 75 42\" opacity=\".5\"/\u003e\u003c/svg\u003e`,\n  // 보: 귀퉁이 접힌 종이\n  paper: `\u003csvg class=\"doodle rough\" viewBox=\"0 0 100 100\"\u003e\n    \u003cg transform=\"rotate(-6 50 50)\"\u003e\n      \u003cpath class=\"fl\" fill=\"#FFFFFF\" d=\"M22 12 H64 L80 28 V88 H22 Z\"/\u003e\n      \u003cpath class=\"ln\" d=\"M64 12 V28 H80\"/\u003e\n      \u003cpath class=\"ln\" stroke=\"#9AB8DA\" d=\"M30 42 H72 M30 54 H72 M30 66 H62\"/\u003e\n    \u003c/g\u003e\u003c/svg\u003e`,\n};\nconst HANDS = [\n  { id: \u0027scissors\u0027, name: \u0027가위\u0027, key: \u00271\u0027 },\n  { id: \u0027rock\u0027,     name: \u0027바위\u0027, key: \u00272\u0027 },\n  { id: \u0027paper\u0027,    name: \u0027보\u0027,   key: \u00273\u0027 },\n];\n// 빨간 펜 채점 표시: 승 = 동그라미, 무 = 세모, 패 = X\nconst MARK = {\n  win:  \u0027\u003cpath pathLength=\"1\" d=\"M52 12 C80 10 92 34 87 54 C82 78 56 92 33 85 C11 78 7 50 18 30 C27 15 45 10 62 15\"/\u003e\u0027,\n  draw: \u0027\u003cpath pathLength=\"1\" d=\"M50 14 L87 82 L12 80 L54 10\"/\u003e\u0027,\n  lose: \u0027\u003cpath pathLength=\"1\" d=\"M20 18 L82 84 M82 18 L18 82\"/\u003e\u0027,\n};\nconst markSVG = (res, anim) =\u003e `\u003csvg class=\"mk ${anim ? \u0027draw-in\u0027 : \u0027\u0027}\" viewBox=\"0 0 100 100\"\u003e${MARK[res]}\u003c/svg\u003e`;\n\n// ---------- 레벨 (계산·저장은 shared.js) ----------\nfunction lvHTML(s, id, label, small = false) {\n  const need = needExp(s.lv);\n  return `\u003cdiv class=\"lv ${small ? \u0027small\u0027 : \u0027\u0027}\" id=\"${id}\" data-label=\"${label}\"\u003e\n    \u003cspan class=\"lv-badge\"\u003eLv.${s.lv}\u003c/span\u003e\n    \u003cdiv class=\"lv-main\"\u003e\n      \u003cdiv class=\"lv-bar\"\u003e\u003ci class=\"lv-fill\" style=\"width:${s.exp / need * 100}%\"\u003e\u003c/i\u003e\u003c/div\u003e\n      \u003cspan class=\"lv-num\"\u003e${label} · ${fmt(s.exp)} / ${fmt(need)} EXP\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e`;\n}\nfunction lvBlock() {\n  return lvHTML(loadLv(GAME.lvKey), \u0027lv-game\u0027, GAME.title) + lvHTML(loadLv(), \u0027lv-all\u0027, \u0027전체\u0027, true);\n}\n\n// 경험치 바를 이전 상태 → 새 상태로 채움 (레벨업 시 한 칸씩 꽉 채우고 넘어감)\nasync function playExp(id, from, to) {\n  const el = stage.querySelector(\u0027#\u0027 + id);\n  if (!el) return;\n  const badge = el.querySelector(\u0027.lv-badge\u0027), fill = el.querySelector(\u0027.lv-fill\u0027), num = el.querySelector(\u0027.lv-num\u0027);\n  const label = el.dataset.label;\n  await sleep(800);\n  for (let lv = from.lv; lv \u003c to.lv; lv++) {\n    if (!el.isConnected) return;\n    fill.style.width = \u0027100%\u0027;\n    num.textContent = `${label} · ${fmt(needExp(lv))} / ${fmt(needExp(lv))} EXP`;\n    await sleep(750);\n    if (!el.isConnected) return;\n    badge.textContent = `Lv.${lv + 1}`;\n    badge.classList.remove(\u0027up\u0027); void badge.offsetWidth; badge.classList.add(\u0027up\u0027);\n    fill.style.transition = \u0027none\u0027; fill.style.width = \u00270%\u0027; void fill.offsetWidth; fill.style.transition = \u0027\u0027;\n  }\n  if (!el.isConnected) return;\n  fill.style.width = (to.exp / needExp(to.lv) * 100) + \u0027%\u0027;\n  num.textContent = `${label} · ${fmt(to.exp)} / ${fmt(needExp(to.lv))} EXP`;\n}\n\nasync function playAllExp({ all, game }) {\n  await Promise.all([playExp(\u0027lv-game\u0027, game.from, game.to), playExp(\u0027lv-all\u0027, all.from, all.to)]);\n  if (!stage.querySelector(\u0027#lv-game\u0027)) return;\n  // 둘 다 오르면 전체 레벨 업을 우선 보여줌\n  if (all.to.lv \u003e all.from.lv) toast(\u0027레벨 업!\u0027, `전체 Lv.${all.to.lv} 달성`);\n  else if (game.to.lv \u003e game.from.lv) toast(\u0027레벨 업!\u0027, `${GAME.title} Lv.${game.to.lv} 달성`);\n}\n\nfunction toast(big, small) {\n  document.querySelectorAll(\u0027.toast\u0027).forEach(t =\u003e t.remove());\n  const t = document.createElement(\u0027div\u0027);\n  t.className = \u0027toast\u0027;\n  t.setAttribute(\u0027role\u0027, \u0027status\u0027);\n  t.innerHTML = `${big}\u003csmall\u003e${small}\u003c/small\u003e`;\n  document.body.appendChild(t);\n  t.addEventListener(\u0027animationend\u0027, () =\u003e t.remove());\n}\n\n// ---------- 모드 ----------\n// classic: 10판 운 게임 (점수는 1/100점 단위, EXP = 점수 × 25, 소수점 버림)\n// 나머지: 15초 동안 상대 패를 보고 맞히기 (EXP = 득점 × expRate)\n// shuffle: 문제마다 선택지 순서 섞기 / reverse: 리버스 문제가 나올 확률\nconst QUICK_LIMIT = 15;\nconst LOCK_MS = 1000; // 틀렸을 때 조작 불가 시간\nconst MODES = {\n  classic: { label: \u0027일반\u0027,   kind: \u0027classic\u0027, best: GAME.bests[\u0027일반\u0027],   blurb: \u002710판 승부 · 운에 맡겨요\u0027 },\n  easy:    { label: \u0027Easy\u0027,   kind: \u0027quick\u0027,   best: GAME.bests.Easy,     blurb: \u002715초 · 선택지 순서 고정\u0027, expRate: 50, shuffle: false, reverse: 0 },\n  normal:  { label: \u0027Normal\u0027, kind: \u0027quick\u0027,   best: GAME.bests.Normal,   blurb: \u002715초 · 선택지 순서가 섞여요\u0027, expRate: 100, shuffle: true, reverse: 0 },\n  hard:    { label: \u0027Hard\u0027,   kind: \u0027quick\u0027,   best: GAME.bests.Hard,     blurb: \u002715초 · 순서 섞임 + 리버스!\u0027, expRate: 150, shuffle: true, reverse: .3 },\n};\nlet modeId = \u0027classic\u0027;\nlet M = MODES.classic;\nconst modeTag = document.getElementById(\u0027modeTag\u0027);\n\n// 가위(0) → 바위(1) → 보(2): 바로 다음 것이 이김\nconst beats = h =\u003e (h + 1) % 3;\nconst losesTo = h =\u003e (h + 2) % 3;\nconst showRecord = (b, kind) =\u003e kind === \u0027classic\u0027 ? `${b.toFixed(2)}점` : `${b}점`;\n\n// ---------- 게임 흐름 ----------\nlet keyOff = null;\n\nfunction scene(html) {\n  if (keyOff) { keyOff(); keyOff = null; }\n  stage.innerHTML = `\u003cdiv class=\"scene\"\u003e${html}\u003c/div\u003e`;\n  return stage.firstChild;\n}\n\nfunction onKeys(fn) {\n  const h = e =\u003e { if (!e.repeat) fn(e); };\n  window.addEventListener(\u0027keydown\u0027, h);\n  keyOff = () =\u003e window.removeEventListener(\u0027keydown\u0027, h);\n}\n\nfunction intro() {\n  modeTag.textContent = \u0027모드 선택\u0027;\n  scene(`\n    \u003ch1 class=\"title\"\u003e\u003cmark\u003e가위바위보\u003c/mark\u003e\u003c/h1\u003e\n    \u003cp class=\"sub\"\u003e모드를 골라 주세요.\u003c/p\u003e\n    \u003cdiv class=\"trio\"\u003e${HANDS.map(h =\u003e `\u003cspan\u003e${DOODLE[h.id]}\u003c/span\u003e`).join(\u0027\u0027)}\u003c/div\u003e\n    \u003cdiv class=\"modes\"\u003e${Object.entries(MODES).map(([id, m]) =\u003e {\n      const b = loadRecord(m.best);\n      return `\u003cbutton class=\"mode-card ${id}\" data-mode=\"${id}\"\u003e\n        \u003cb\u003e${m.label}\u003c/b\u003e\u003cspan\u003e${m.blurb}\u003c/span\u003e\n        \u003csmall\u003e${b !== null ? \u0027최고 \u0027 + showRecord(b, m.kind) : \u0027\u0026nbsp;\u0027}\u003c/small\u003e\u003c/button\u003e`;\n    }).join(\u0027\u0027)}\u003c/div\u003e\n    \u003cdiv class=\"spacer\"\u003e\u003c/div\u003e\n    ${lvBlock()}`);\n  stage.querySelectorAll(\u0027.mode-card\u0027).forEach(b =\u003e b.addEventListener(\u0027click\u0027, () =\u003e modeIntro(b.dataset.mode)));\n  stage.querySelector(\u0027.mode-card\u0027).focus();\n}\n\nfunction modeIntro(id) {\n  modeId = id; M = MODES[id];\n  modeTag.textContent = `${M.label} 모드`;\n  const best = loadRecord(M.best);\n  const rules = M.kind === \u0027classic\u0027 ? `\n      \u003cli\u003e\u003cb\u003e10판\u003c/b\u003e 동안 가위·바위·보 중 하나를 내요\u003c/li\u003e\n      \u003cli\u003e\u003cb\u003e승리 3점\u003c/b\u003e · 무승부 1점 · 패배 0점\u003c/li\u003e\n      \u003cli\u003e\u003cb\u003e연승 보너스\u003c/b\u003e +0.02 × 연승 \u003csmall\u003e(지거나 비기면 0)\u003c/small\u003e\u003c/li\u003e\n      \u003cli\u003e\u003cb\u003e무패 보너스\u003c/b\u003e +0.01 × 무패 \u003csmall\u003e(지면 0)\u003c/small\u003e\u003c/li\u003e\n      \u003cli\u003e얻는 EXP = \u003cspan class=\"red\"\u003e최종 점수 × 25\u003c/span\u003e \u003csmall\u003e(소수점 버림)\u003c/small\u003e\u003c/li\u003e` : `\n      \u003cli\u003e\u003cb\u003e15초\u003c/b\u003e 동안 상대 패를 보고 골라요\u003c/li\u003e\n      \u003cli\u003e\u003cb\u003e이기는 패 +1점\u003c/b\u003e · 비기는 패 0점\u003c/li\u003e\n      \u003cli\u003e\u003cb\u003e지는 패\u003c/b\u003e를 고르면 \u003cspan class=\"red\"\u003e-1점, 1초 동안 못 골라요\u003c/span\u003e\u003c/li\u003e\n      \u003cli\u003e선택지 순서: ${M.shuffle ? \u0027\u003cb\u003e문제마다 섞여요\u003c/b\u003e\u0027 : \u0027가위 · 바위 · 보 고정\u0027}\u003c/li\u003e\n      ${M.reverse ? \u0027\u003cli\u003e\u003cspan class=\"red\"\u003e리버스\u003c/span\u003e가 뜨면 반대로! \u003cb\u003e지는 패가 +1점\u003c/b\u003e, 이기는 패는 -1점\u003c/li\u003e\u0027 : \u0027\u0027}\n      \u003cli\u003e얻는 EXP = \u003cspan class=\"red\"\u003e득점 × ${M.expRate}\u003c/span\u003e \u003csmall\u003e(0점 이하는 EXP·기록 없음)\u003c/small\u003e\u003c/li\u003e`;\n  scene(`\n    \u003cbutton class=\"back\" id=\"back\"\u003e← 모드 선택\u003c/button\u003e\n    \u003ch1 class=\"title\"\u003e\u003cmark\u003e${M.label}\u003c/mark\u003e 모드\u003c/h1\u003e\n    \u003cul class=\"rules\"\u003e${rules}\u003c/ul\u003e\n    \u003cdiv class=\"spacer\"\u003e\u003c/div\u003e\n    ${lvBlock()}\n    \u003cdiv class=\"btn-row\" style=\"margin-top:16px\"\u003e\u003cbutton class=\"pen-btn\" id=\"go\"\u003e시작하기 ✎\u003c/button\u003e\u003c/div\u003e\n    \u003cp class=\"best-line\"\u003e${best !== null ? `최고 점수 ${showRecord(best, M.kind)}` : \u0027아직 기록이 없어요\u0027}\u003c/p\u003e`);\n  stage.querySelector(\u0027#back\u0027).addEventListener(\u0027click\u0027, intro);\n  const go = stage.querySelector(\u0027#go\u0027);\n  go.addEventListener(\u0027click\u0027, start);\n  go.focus();\n}\n\nfunction start() {\n  if (M.kind === \u0027classic\u0027) startClassic(); else startQuick();\n}\n\n// 결과 화면 공통: 최고 기록 저장 + EXP 지급 + 레벨 바\nfunction resultTail(gain, calc) {\n  const before = { game: loadLv(GAME.lvKey), all: loadLv() };\n  const change = giveExp(GAME.lvKey, gain);\n  return {\n    change,\n    html: `\n    \u003cdiv class=\"exp-gain\"\u003e\u003cmark\u003e+${fmt(gain)} EXP\u003c/mark\u003e\u003c/div\u003e\n    \u003cp class=\"exp-calc\"\u003e${calc}\u003c/p\u003e\n    ${lvHTML(before.game, \u0027lv-game\u0027, GAME.title)}${lvHTML(before.all, \u0027lv-all\u0027, \u0027전체\u0027, true)}\n    \u003cdiv class=\"spacer\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"btn-row\"\u003e\n      \u003cbutton class=\"pen-btn\" id=\"again\"\u003e한 번 더 ✎\u003c/button\u003e\n      \u003cbutton class=\"pen-btn ghost\" id=\"modes\"\u003e모드 선택\u003c/button\u003e\n    \u003c/div\u003e`,\n  };\n}\n\nfunction bindResult(change) {\n  const again = stage.querySelector(\u0027#again\u0027);\n  const modes = stage.querySelector(\u0027#modes\u0027);\n  again.addEventListener(\u0027click\u0027, start);\n  modes.addEventListener(\u0027click\u0027, intro);\n  // 연타하던 키로 바로 재시작되지 않도록 잠깐 막음\n  again.disabled = modes.disabled = true;\n  setTimeout(() =\u003e { again.disabled = modes.disabled = false; again.focus(); }, 700);\n  playAllExp(change);\n}\n\n// 최고 기록이면 저장하고 true\nfunction saveIfBest(score, text) {\n  const best = loadRecord(M.best);\n  const isBest = score \u003e 0 \u0026\u0026 (best === null || score \u003e best);\n  if (isBest) { try { localStorage.setItem(M.best, text); } catch {} }\n  return { best, isBest };\n}\n\n// ========== 일반 모드: 10판 ==========\nlet round, streak, combo, total, log, busy;\n\nfunction sheetHTML() {\n  return `\u003cdiv class=\"sheet\" id=\"sheet\"\u003e${Array.from({ length: ROUNDS }, (_, i) =\u003e {\n    const r = log[i];\n    return `\u003cdiv class=\"cell ${i === round \u0026\u0026 round \u003c ROUNDS ? \u0027now\u0027 : \u0027\u0027}\"\u003e\n      \u003cspan class=\"no\"\u003e${i + 1}\u003c/span\u003e\n      ${r ? markSVG(r.res, false) : \u0027\u003csvg class=\"mk\" viewBox=\"0 0 100 100\"\u003e\u003c/svg\u003e\u0027}\n      \u003cspan class=\"pt\"\u003e${r ? pts(r.pts) : \u0027\u0027}\u003c/span\u003e\u003c/div\u003e`;\n  }).join(\u0027\u0027)}\u003c/div\u003e`;\n}\n\nfunction startClassic() {\n  round = 0; streak = 0; combo = 0; total = 0; log = []; busy = false;\n  const s = scene(`\n    ${sheetHTML()}\n    \u003cdiv class=\"tally\"\u003e\n      \u003cspan\u003e연승 \u003cb id=\"streak\"\u003e0\u003c/b\u003e\u003c/span\u003e\n      \u003cspan\u003e무패 \u003cb id=\"combo\"\u003e0\u003c/b\u003e\u003c/span\u003e\n      \u003cspan class=\"total\"\u003e합계 \u003cb id=\"total\"\u003e0.00\u003c/b\u003e점\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"arena\"\u003e\n      \u003cdiv class=\"side\"\u003e\u003cspan class=\"who\"\u003e상대\u003c/span\u003e\u003cdiv class=\"hand cpu-q\" id=\"cpu\"\u003e?\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"vs\"\u003evs\u003c/div\u003e\n      \u003cdiv class=\"side\"\u003e\u003cspan class=\"who\"\u003e나\u003c/span\u003e\u003cdiv class=\"hand\" id=\"me\"\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"verdict\" id=\"verdict\"\u003e\u003cspan class=\"big\"\u003e1판, 골라 보세요!\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv class=\"spacer\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"picks\"\u003e${HANDS.map((h, i) =\u003e `\n      \u003cbutton class=\"pick\" data-i=\"${i}\" aria-label=\"${h.name}\"\u003e\u003cspan\u003e${DOODLE[h.id]}\u003c/span\u003e${h.name}\u003ckbd\u003e${h.key}\u003c/kbd\u003e\u003c/button\u003e`).join(\u0027\u0027)}\n    \u003c/div\u003e`);\n  s.querySelectorAll(\u0027.pick\u0027).forEach(b =\u003e b.addEventListener(\u0027click\u0027, () =\u003e play(+b.dataset.i)));\n  onKeys(e =\u003e { const i = HANDS.findIndex(h =\u003e h.key === e.key); if (i \u003e= 0) play(i); });\n}\n\nasync function play(me) {\n  if (busy || round \u003e= ROUNDS) return;\n  busy = true;\n  const cpuEl = stage.querySelector(\u0027#cpu\u0027), meEl = stage.querySelector(\u0027#me\u0027);\n  const verdict = stage.querySelector(\u0027#verdict\u0027);\n  const picks = stage.querySelectorAll(\u0027.pick\u0027);\n  picks.forEach((b, i) =\u003e { b.disabled = true; b.classList.toggle(\u0027chosen\u0027, i === me); });\n\n  // 가위, 바위, 보! — 두 손이 흔들린 뒤 공개\n  meEl.className = \u0027hand shake\u0027; meEl.innerHTML = DOODLE[HANDS[me].id];\n  cpuEl.className = \u0027hand cpu-q shake\u0027; cpuEl.textContent = \u0027?\u0027;\n  verdict.innerHTML = \u0027\u003cspan class=\"big\"\u003e가위, 바위, 보!\u003c/span\u003e\u0027;\n  await sleep(500);\n  if (!cpuEl.isConnected) return;\n\n  const cpu = Math.floor(Math.random() * 3);\n  cpuEl.className = \u0027hand reveal\u0027; cpuEl.innerHTML = DOODLE[HANDS[cpu].id];\n  const res = me === beats(cpu) ? \u0027win\u0027 : me === cpu ? \u0027draw\u0027 : \u0027lose\u0027;\n\n  let p = 0, calc;\n  if (res === \u0027win\u0027) {\n    streak++; combo++;\n    p = 300 + 2 * streak + combo;\n    calc = `3 + 연승 0.02×${streak} + 무패 0.01×${combo}`;\n  } else if (res === \u0027draw\u0027) {\n    streak = 0; combo++;\n    p = 100 + combo;\n    calc = `1 + 무패 0.01×${combo}`;\n  } else {\n    streak = 0; combo = 0;\n    calc = \u0027연승·무패 모두 0으로\u0027;\n  }\n  total += p;\n  log.push({ res, pts: p });\n  if (res === \u0027win\u0027) cpuEl.classList.add(\u0027lost\u0027);\n  if (res === \u0027lose\u0027) meEl.classList.add(\u0027lost\u0027);\n\n  const word = { win: \u0027이겼다!\u0027, draw: \u0027비겼다\u0027, lose: \u0027졌다…\u0027 }[res];\n  verdict.innerHTML = `\u003cspan class=\"big ${res} stamp\"\u003e${word} +${pts(p)}\u003c/span\u003e\u003cspan class=\"calc\"\u003e${calc}\u003c/span\u003e`;\n\n  const cell = stage.querySelectorAll(\u0027.cell\u0027)[round];\n  cell.querySelector(\u0027.mk\u0027).outerHTML = markSVG(res, true);\n  cell.querySelector(\u0027.pt\u0027).textContent = pts(p);\n  round++;\n  stage.querySelectorAll(\u0027.cell\u0027).forEach((c, i) =\u003e c.classList.toggle(\u0027now\u0027, i === round \u0026\u0026 round \u003c ROUNDS));\n  setTally(\u0027streak\u0027, streak); setTally(\u0027combo\u0027, combo); setTally(\u0027total\u0027, pts(total));\n\n  if (round \u003e= ROUNDS) {\n    await sleep(1300);\n    if (cpuEl.isConnected) finishClassic();\n    return;\n  }\n  await sleep(350);\n  if (!cpuEl.isConnected) return;\n  picks.forEach(b =\u003e { b.disabled = false; b.classList.remove(\u0027chosen\u0027); });\n  busy = false;\n}\n\nfunction setTally(id, v) {\n  const el = stage.querySelector(\u0027#\u0027 + id);\n  if (el.textContent === String(v)) return;\n  el.textContent = v;\n  el.classList.remove(\u0027bump\u0027); void el.offsetWidth; el.classList.add(\u0027bump\u0027);\n}\n\nfunction finishClassic() {\n  const count = r =\u003e log.filter(l =\u003e l.res === r).length;\n  const { best, isBest } = saveIfBest(total / 100, pts(total));\n  // 점수 × 25 = (1/100점 단위) ÷ 4, 소수점은 버림\n  const tail = resultTail(Math.floor(total / 4), `최종 점수 ${pts(total)} × 25`);\n  scene(`\n    ${sheetHTML()}\n    \u003cdiv class=\"final\"\u003e\n      \u003cdiv class=\"lbl\"\u003e최종 점수\u003c/div\u003e\n      \u003cdiv class=\"score\"\u003e${pts(total)}\u003csmall\u003e점\u003c/small\u003e\u003c/div\u003e\n      \u003cp class=\"wdl\"\u003e승 \u003cb\u003e${count(\u0027win\u0027)}\u003c/b\u003e · 무 \u003cb\u003e${count(\u0027draw\u0027)}\u003c/b\u003e · 패 \u003cb\u003e${count(\u0027lose\u0027)}\u003c/b\u003e\u003c/p\u003e\n      ${isBest ? \u0027\u003cspan class=\"new-best\"\u003e최고 기록!\u003c/span\u003e\u0027 : best !== null ? `\u003cp class=\"best-line\" style=\"margin:0\"\u003e최고 점수 ${best.toFixed(2)}점\u003c/p\u003e` : \u0027\u0027}\n    \u003c/div\u003e\n    ${tail.html}`);\n  bindResult(tail.change);\n}\n\n// ========== Easy / Normal / Hard: 15초 맞히기 ==========\nlet q, score, hits, draws, misses, lockUntil, qStart, qRaf, qOver;\n\nfunction startQuick() {\n  score = 0; hits = 0; draws = 0; misses = 0; lockUntil = 0; qOver = false;\n  scene(`\n    \u003cdiv class=\"qhud\"\u003e\n      \u003cspan class=\"qclock\" id=\"qclock\"\u003e\u003cb id=\"qtime\"\u003e15.00\u003c/b\u003e초\u003c/span\u003e\n      \u003cspan class=\"qscore\"\u003e점수 \u003cb id=\"qscore\"\u003e0\u003c/b\u003e\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"tbar\" id=\"tbar\"\u003e\u003ci id=\"tfill\"\u003e\u003c/i\u003e\u003c/div\u003e\n    \u003cdiv class=\"cue\" id=\"cue\"\u003e\n      \u003cspan class=\"who\"\u003e상대가 낸 패\u003c/span\u003e\n      \u003cdiv class=\"hand\" id=\"cpu\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"ask\" id=\"ask\"\u003e\u003c/div\u003e\n      \u003cspan class=\"rev-stamp\"\u003e리버스!\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"fb\" id=\"fb\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"spacer\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"picks\" id=\"picks\"\u003e\u003c/div\u003e`);\n  onKeys(e =\u003e { const i = [\u00271\u0027, \u00272\u0027, \u00273\u0027].indexOf(e.key); if (i \u003e= 0) answer(i); });\n  nextQ();\n  qStart = performance.now();\n  qRaf = requestAnimationFrame(qTick);\n}\n\nfunction nextQ() {\n  const cpu = Math.floor(Math.random() * 3);\n  const order = [0, 1, 2];\n  if (M.shuffle) {\n    for (let i = 2; i \u003e 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }\n  }\n  q = { cpu, order, rev: Math.random() \u003c M.reverse };\n\n  const cue = stage.querySelector(\u0027#cue\u0027);\n  const cpuEl = stage.querySelector(\u0027#cpu\u0027);\n  cue.classList.toggle(\u0027rev\u0027, q.rev);\n  cpuEl.innerHTML = DOODLE[HANDS[cpu].id];\n  cpuEl.classList.remove(\u0027next\u0027); void cpuEl.offsetWidth; cpuEl.classList.add(\u0027next\u0027);\n  stage.querySelector(\u0027#ask\u0027).innerHTML = q.rev ? \u0027반대로! \u003cmark\u003e지는 패\u003c/mark\u003e를 골라요\u0027 : \u0027\u003cmark\u003e이기는 패\u003c/mark\u003e를 골라요\u0027;\n\n  const picks = stage.querySelector(\u0027#picks\u0027);\n  picks.innerHTML = order.map((h, pos) =\u003e `\n    \u003cbutton class=\"pick\" data-pos=\"${pos}\" aria-label=\"${HANDS[h].name}\"\u003e\u003cspan\u003e${DOODLE[HANDS[h].id]}\u003c/span\u003e${HANDS[h].name}\u003ckbd\u003e${pos + 1}\u003c/kbd\u003e\u003c/button\u003e`).join(\u0027\u0027);\n  picks.querySelectorAll(\u0027.pick\u0027).forEach(b =\u003e b.addEventListener(\u0027pointerdown\u0027, () =\u003e answer(+b.dataset.pos)));\n}\n\nfunction answer(pos) {\n  if (qOver || performance.now() \u003c lockUntil) return;\n  const me = q.order[pos];\n  const good = q.rev ? losesTo(q.cpu) : beats(q.cpu);\n  const fb = stage.querySelector(\u0027#fb\u0027);\n  if (me === good) {\n    score += 1; hits++;\n    fb.innerHTML = \u0027\u003cspan class=\"win\"\u003e+1\u003c/span\u003e\u0027;\n  } else if (me === q.cpu) {\n    draws++;\n    fb.innerHTML = \u0027\u003cspan class=\"draw\"\u003e0 비김\u003c/span\u003e\u0027;\n  } else {\n    // 틀림 → -1점 + 1초 조작 불가, 문제는 그대로 (마구 누르기 방지)\n    score -= 1; misses++;\n    lockUntil = performance.now() + LOCK_MS;\n    fb.innerHTML = \u0027\u003cspan class=\"miss\"\u003e땡! -1 · 1초 멈춤\u003c/span\u003e\u0027;\n    setTally(\u0027qscore\u0027, score);\n    const picks = stage.querySelector(\u0027#picks\u0027);\n    picks.classList.remove(\u0027shake\u0027); void picks.offsetWidth;\n    picks.classList.add(\u0027shake\u0027, \u0027locked\u0027);\n    setTimeout(() =\u003e { if (picks.isConnected) picks.classList.remove(\u0027locked\u0027); }, LOCK_MS);\n    return;\n  }\n  setTally(\u0027qscore\u0027, score);\n  nextQ();\n}\n\nfunction qTick(now) {\n  const left = Math.max(0, QUICK_LIMIT - (now - qStart) / 1000);\n  const timeEl = stage.querySelector(\u0027#qtime\u0027);\n  if (!timeEl) return;\n  timeEl.textContent = left.toFixed(2);\n  stage.querySelector(\u0027#tfill\u0027).style.width = (left / QUICK_LIMIT * 100) + \u0027%\u0027;\n  stage.querySelector(\u0027#qclock\u0027).classList.toggle(\u0027low\u0027, left \u003c 5);\n  stage.querySelector(\u0027#tbar\u0027).classList.toggle(\u0027low\u0027, left \u003c 5);\n  if (left \u003c= 0) {\n    qOver = true;\n    stage.querySelector(\u0027#fb\u0027).innerHTML = \u0027\u003cspan class=\"win\"\u003e그만!\u003c/span\u003e\u0027;\n    stage.querySelector(\u0027#picks\u0027).classList.add(\u0027locked\u0027);\n    setTimeout(() =\u003e { if (stage.querySelector(\u0027#qtime\u0027)) finishQuick(); }, 800);\n    return;\n  }\n  qRaf = requestAnimationFrame(qTick);\n}\n\nfunction finishQuick() {\n  const { best, isBest } = saveIfBest(score, String(score));\n  // 득점이 0 이하면 EXP 없음 (음수 EXP로 레벨이 깎이지 않도록)\n  const tail = score \u003e 0\n    ? resultTail(score * M.expRate, `득점 ${score} × ${M.expRate}`)\n    : resultTail(0, \u0027득점이 0점 이하라 EXP가 없어요\u0027);\n  scene(`\n    \u003cdiv class=\"final\"\u003e\n      \u003cdiv class=\"lbl\"\u003e${M.label} 모드 · 15초 득점\u003c/div\u003e\n      \u003cdiv class=\"score\"\u003e${score}\u003csmall\u003e점\u003c/small\u003e\u003c/div\u003e\n      \u003cp class=\"wdl\"\u003e이김 \u003cb\u003e${hits}\u003c/b\u003e · 비김 \u003cb\u003e${draws}\u003c/b\u003e · 실수 \u003cb\u003e${misses}\u003c/b\u003e\u003c/p\u003e\n      ${isBest ? \u0027\u003cspan class=\"new-best\"\u003e최고 기록!\u003c/span\u003e\u0027 : best !== null ? `\u003cp class=\"best-line\" style=\"margin:0\"\u003e최고 점수 ${best}점\u003c/p\u003e` : \u0027\u0027}\n    \u003c/div\u003e\n    ${tail.html}`);\n  bindResult(tail.change);\n}\n\nintro();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","games/runner.html":"\u003c!doctype html\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"\u003e\n\u003ctitle\u003e시나모롤 런\u003c/title\u003e\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Jua\u0026display=swap\" rel=\"stylesheet\"\u003e\n\u003cstyle\u003e\n  /* 하늘 3종 — 낮(Easy) · 밤(Normal) · 폭풍우(Hard), 페이지 바탕도 스테이지 따라 바뀜 */\n  :root {\n    --ink: #3B5675;  --ink-soft: #6F88A6;\n    --card: #FFFFFF; --line: #C9E4F5;\n    --pink: #FF8FB1; --blue: #4DA8E8; --gold: #F2A541;\n    --page: linear-gradient(180deg, #D8F1FF, #EAF7FF);\n    --page-ink: #6F88A6; --page-title: #4DA8E8;\n    --font: \"Jua\", \"Apple SD Gothic Neo\", \"Malgun Gothic\", system-ui, sans-serif;\n  }\n  body[data-theme=\"night\"] { --page: linear-gradient(180deg, #1A2050, #2E3670); --page-ink: #AEB6E8; --page-title: #FFE38A; }\n  body[data-theme=\"storm\"] { --page: linear-gradient(180deg, #3A3F4C, #555B69); --page-ink: #C5CAD6; --page-title: #FFE46B; }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; }\n  body {\n    min-height: 100vh; min-height: 100dvh;\n    display: grid; place-items: center; padding: 16px;\n    font-family: var(--font); color: var(--ink);\n    background: var(--page); transition: background .4s;\n    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;\n  }\n  .wrap { width: 100%; max-width: 420px; }\n  .top { display: flex; align-items: center; justify-content: space-between; height: 36px; }\n  .home { font: 17px/1 var(--font); color: var(--page-ink); text-decoration: none; padding: 8px 12px; margin-left: -10px; border-radius: 99px; }\n  .home:hover { background: rgba(255,255,255,.2); }\n  .home:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }\n  .title { font: 22px/1 var(--font); color: var(--page-title); }\n  .stage-tag { min-width: 60px; text-align: center; padding: 6px 10px 5px; border-radius: 99px; font-size: 13px; letter-spacing: .06em; color: #fff; background: var(--tag, #7FD08A); }\n  .stage-tag:empty { visibility: hidden; }\n\n  .stage { position: relative; margin-top: 8px; }\n  canvas {\n    display: block; width: 100%; aspect-ratio: 2 / 3;\n    border-radius: 22px; border: 3px solid rgba(255,255,255,.85);\n    box-shadow: 0 14px 30px rgba(20,30,60,.25);\n    touch-action: none; cursor: pointer; background: #8FD3F4;\n  }\n\n  /* 난이도 선택 · 결과 */\n  .overlay {\n    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 18px;\n    border-radius: 22px; background: rgba(20,30,60,.35);\n  }\n  .overlay.show { display: flex; animation: fade .3s ease-out; }\n  @keyframes fade { from { opacity: 0; } }\n  .card {\n    width: 100%; max-width: 300px; text-align: center; padding: 22px 18px 18px;\n    background: var(--card); border-radius: 22px; box-shadow: 0 10px 24px rgba(20,30,60,.25);\n    animation: pop .45s cubic-bezier(.34,1.56,.64,1);\n  }\n  @keyframes pop { from { transform: scale(.9) translateY(10px); opacity: 0; } }\n  .card h2 { margin: 0; font: 34px/1 var(--font); color: var(--pink); }\n  .card h2.pick { color: var(--blue); }\n  .card .big { margin: 12px 0 0; font: 58px/1 var(--font); color: var(--ink); font-variant-numeric: tabular-nums; }\n  .card .big small { font-size: 20px; color: var(--ink-soft); margin-left: 2px; }\n  .card .best { display: inline-block; margin-top: 8px; padding: 5px 12px 4px; border-radius: 99px; font-size: 14px; background: #FFE9A8; color: #8A5A00; }\n  .card .best.plain { background: none; color: var(--ink-soft); }\n  .card .info { margin: 12px 0 0; font-size: 14px; color: var(--ink-soft); line-height: 1.5; }\n  .card .exp { margin: 10px 0 0; font-size: 19px; color: var(--blue); }\n  .modes { display: grid; gap: 10px; margin-top: 16px; }\n  .mode-btn {\n    display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer;\n    padding: 12px 14px; border-radius: 16px; border: 2px solid var(--line); background: #fff;\n    font-family: var(--font); color: var(--ink); transition: border-color .15s, transform .1s;\n  }\n  .mode-btn:hover, .mode-btn:focus-visible { outline: none; border-color: var(--c); }\n  .mode-btn:active { transform: scale(.98); }\n  .mode-btn .sw { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--bg); box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }\n  .mode-btn .txt { flex: 1; min-width: 0; }\n  .mode-btn b { display: block; font-size: 20px; font-weight: 400; color: var(--c); }\n  .mode-btn span { display: block; margin-top: 3px; font-size: 12.5px; color: var(--ink-soft); }\n  .mode-btn small { flex: none; font-size: 12.5px; color: var(--gold); }\n  .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }\n  .btn { font: 17px/1 var(--font); padding: 13px 18px 11px; border-radius: 99px; border: 0; cursor: pointer; color: #fff; background: var(--blue); box-shadow: 0 4px 0 #2F7FBA; text-decoration: none; }\n  .btn.ghost { color: var(--ink); background: #EEF7FD; box-shadow: 0 4px 0 var(--line); }\n  .btn:active { transform: translateY(3px); box-shadow: none; }\n  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }\n  .hint { margin: 12px 0 0; text-align: center; font-size: 14px; color: var(--page-ink); }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody data-theme=\"day\"\u003e\n\u003cmain class=\"wrap\"\u003e\n  \u003cheader class=\"top\"\u003e\n    \u003ca class=\"home\" href=\"../index.html\"\u003e← 홈\u003c/a\u003e\n    \u003cspan class=\"title\"\u003e시나모롤 런\u003c/span\u003e\n    \u003cspan class=\"stage-tag\" id=\"stageTag\"\u003e\u003c/span\u003e\n  \u003c/header\u003e\n  \u003cdiv class=\"stage\"\u003e\n    \u003ccanvas id=\"cv\" aria-label=\"시나모롤 런 게임 화면\"\u003e\u003c/canvas\u003e\n    \u003cdiv class=\"overlay\" id=\"overlay\" role=\"dialog\" aria-live=\"assertive\"\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cp class=\"hint\"\u003e스페이스바 · 클릭 · 터치로 날갯짓(귀 팔랑!) · 구름과 장애물을 피하세요\u003c/p\u003e\n\u003c/main\u003e\n\n\u003cscript\u003e\n// 메인 화면과 모든 게임이 함께 쓰는 코드: 게임 목록 + 레벨·경험치\n// 게임을 깨면 같은 경험치가 \u0027전체 레벨\u0027과 \u0027그 게임 레벨\u0027에 함께 쌓임\n\n// ---------- 게임 목록 ----------\n// href는 메인(index.html) 기준 경로 / lvKey: 게임별 레벨 저장 키\n// bests: { 표시 이름: 최고 기록 저장 키 } / bestUnit: 기록 단위\nconst GAMES = [\n  {\n    id: \u0027mission15\u0027,\n    title: \u002715초 미션\u0027,\n    desc: \u002715초 안에 미니게임 3개를 모두 깨라!\u0027,\n    href: \u0027games/mission15.html\u0027,\n    lvKey: \u0027lv15\u0027,\n    bests: { Easy: \u0027best15\u0027, Normal: \u0027best15_normal\u0027, Hard: \u0027best15_hard\u0027 },\n    bestUnit: \u0027초\u0027,\n  },\n  {\n    id: \u0027rps\u0027,\n    title: \u0027가위바위보\u0027,\n    desc: \u002710판 운 승부, 또는 15초 동안 이기는 패 골라내기!\u0027,\n    href: \u0027games/rps.html\u0027,\n    lvKey: \u0027lv_rps\u0027,\n    // 15초 모드는 점수 체계가 바뀌어(정답 +1 / 오답 -1) v2 키로 새로 시작\n    bests: { \u0027일반\u0027: \u0027rps_best\u0027, Easy: \u0027rps2_best_easy\u0027, Normal: \u0027rps2_best_normal\u0027, Hard: \u0027rps2_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027mole\u0027,\n    title: \u0027두더지 잡기\u0027,\n    desc: \u002715초 동안 두더지를 잡아라! 황금 두더지는 +30, 폭탄은 -50.\u0027,\n    href: \u0027games/mole.html\u0027,\n    lvKey: \u0027lv_mole\u0027,\n    // 점수 체계가 바뀌어(일반 +10 / 황금 +30 / 폭탄 -50 / 도망 -10 / 헛방 -1) v4 키로 새로 시작\n    bests: { Easy: \u0027mole4_best_easy\u0027, Normal: \u0027mole4_best_normal\u0027, Hard: \u0027mole4_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027brick\u0027,\n    title: \u0027벽돌깨기\u0027,\n    desc: \u002760초 안에 벽돌 24개를 모두 깨라! 4개마다 스피드 업.\u0027,\n    href: \u0027games/brick.html\u0027,\n    lvKey: \u0027lv_brick\u0027,\n    bests: { Easy: \u0027brick_best_easy\u0027, Normal: \u0027brick_best_normal\u0027, Hard: \u0027brick_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027runner\u0027,\n    title: \u0027시나모롤 런\u0027,\n    desc: \u0027귀를 팔랑이며 하늘을 날아라! 낮 · 밤 · 폭풍우 3가지 하늘.\u0027,\n    href: \u0027games/runner.html\u0027,\n    lvKey: \u0027lv_runner\u0027,\n    bests: { Easy: \u0027runner_best_easy\u0027, Normal: \u0027runner_best_normal\u0027, Hard: \u0027runner_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n];\n\n// ---------- 페이지 이동 ----------\n// 한 파일로 포장된 버전(dist/Claude_Game.html)에서는 바깥 틀(__pack)이 페이지를 바꿔 줌\nconst PACK = (() =\u003e { try { return (window.parent !== window \u0026\u0026 window.parent.__pack) || null; } catch { return null; } })();\nfunction goTo(href) { if (PACK) PACK.go(href); else location.href = href; }\nif (PACK) document.addEventListener(\u0027click\u0027, e =\u003e {\n  const a = e.target.closest(\u0027a[href]\u0027);\n  if (!a || /^(https?:|#|mailto:)/.test(a.getAttribute(\u0027href\u0027))) return;\n  e.preventDefault();\n  PACK.go(a.getAttribute(\u0027href\u0027));\n});\n\n// 예전 점수 체계(정답 +3)의 가위바위보 15초 모드 기록 정리\ntry { [\u0027rps_best_easy\u0027, \u0027rps_best_normal\u0027, \u0027rps_best_hard\u0027].forEach(k =\u003e localStorage.removeItem(k)); } catch {}\n// 예전 점수 체계의 두더지 잡기 · 난이도가 없던 벽돌깨기·시나모롤 런 기록 정리\ntry { [\u0027mole_best_easy\u0027, \u0027mole2_best_easy\u0027, \u0027mole2_best_normal\u0027, \u0027mole2_best_hard\u0027, \u0027mole3_best_easy\u0027, \u0027mole3_best_normal\u0027, \u0027mole3_best_hard\u0027, \u0027brick_best\u0027, \u0027runner_best\u0027].forEach(k =\u003e localStorage.removeItem(k)); } catch {}\n\n// ---------- 레벨 ----------\n// 다음 레벨까지 필요 경험치 = Lv² × 1000 (exp는 현재 레벨 안에서 쌓인 양)\nconst LV_ALL_KEY = \u0027lv_all\u0027;\nconst needExp = lv =\u003e lv * lv * 1000;\nconst fmt = n =\u003e n.toLocaleString(\u0027ko-KR\u0027);\n\nfunction loadLv(key = LV_ALL_KEY) {\n  try {\n    const s = JSON.parse(localStorage.getItem(key));\n    if (s \u0026\u0026 s.lv \u003e= 1 \u0026\u0026 s.exp \u003e= 0) return { lv: s.lv, exp: s.exp };\n  } catch {}\n  return { lv: 1, exp: 0 };\n}\nfunction saveLv(key, s) { try { localStorage.setItem(key, JSON.stringify(s)); } catch {} }\n\nfunction gainExp(key, gain) {\n  const from = loadLv(key);\n  const to = { ...from, exp: from.exp + gain };\n  while (to.exp \u003e= needExp(to.lv)) { to.exp -= needExp(to.lv); to.lv++; }\n  saveLv(key, to);\n  return { from, to };\n}\n\n// 게임 클리어 시 호출 → { all: 전체 레벨 변화, game: 게임 레벨 변화 }\nfunction giveExp(gameLvKey, gain) {\n  gain = Math.max(0, gain); // 음수 EXP로 레벨이 깎이지 않도록\n  return { all: gainExp(LV_ALL_KEY, gain), game: gainExp(gameLvKey, gain) };\n}\n\nfunction loadRecord(key) {\n  try { return parseFloat(localStorage.getItem(key)) || null; } catch { return null; }\n}\n\n\u003c/script\u003e\n\u003cscript\u003e\nconst GAME = GAMES.find(g =\u003e g.id === \u0027runner\u0027);\n\n// ---------- 공통 규칙 ----------\nconst W = 400, H = 600;            // 논리 화면 크기 (2:3)\nconst CLOUD_BAND = 46;             // 위·아래 구름 띠 두께 (닿으면 데미지, 못 넘어감)\nconst PLAYER_X = 96;               // 캐릭터는 왼쪽 고정\nconst PLAYER_SIZE = Math.SQRT1_2;  // 캐릭터 크기: 처음 그림의 면적 50% (가로세로 각 약 70%)\nconst PLAYER_R = 17 * PLAYER_SIZE; // 몸 반지름 (시나몬롤 줍기 범위) ≈ 12\nconst HURT_R = PLAYER_R * Math.SQRT1_2; // 피격 범위: 몸의 면적 약 50% ≈ 8.5\n// 아래 값은 속도 ×1.0 기준. 속도 배율 k 일 때 중력은 ×k², 날갯짓은 ×k^1.5, 떨어지는 최고 속도는 ×k\n// → 빨라질수록 한 번에 오르는 높이가 조금씩(×k) 커져서, 누르는 박자를 너무 서두르지 않아도 따라갈 수 있음\nconst GRAVITY = 1250;              // 자연 하강 가속도\nconst FLAP = 340;                  // 한 번 누를 때 위로 튀는 속도\nconst MAX_FALL = 560;\nconst BASE_SPEED = 170;            // 화면이 흐르는 기본 속도 ×1.0 (px/초)\nconst SPEED_EVERY = 5;             // 5초마다\nconst SPEED_STEP = .2;             // 기본 속도의 20%p 증가\nconst INVULN = 1.0;                // 시작 · 데미지 직후 무적 시간(초)\nconst MAX_HP = 3;\nconst ITEM_PTS = 10;               // 시나몬롤 1개\nconst TICK_PTS = 1;                // 0.1초마다 +1\n// 장애물 생성 간격(초, Easy 기준): 시간으로 고정 → 속도가 빨라져도 \u0027나오는 빈도\u0027는 그대로, 다가오는 속도만 빨라짐\n// 빈도가 n배면 간격은 1/n. (예전 거리 간격 210~330px 을 속도 ×1.0 으로 나눈 값)\nconst FOE_EVERY_MIN = 210 / 170, FOE_EVERY_MAX = 330 / 170; // 약 1.24 ~ 1.94초\nconst ITEM_CHANCE = .4;            // 장애물 사이에 시나몬롤이 놓일 확률\nconst ITEM_R = 14;\n\n// ---------- 스테이지 ----------\n// speed: 시작 속도 배율 / freq: 장애물 빈도 (Easy 대비) / gravity: 중력 배율 / expRate: EXP = 점수 × expRate\n// foe: 장애물 종류 / theme: 하늘 / rx·ry: 장애물 충돌 반지름 (가로 · 세로)\nconst STAGES = {\n  easy:   { label: \u0027Easy\u0027,   speed: 1.0, freq: 1.0, gravity: 1.0, expRate: 3, foe: \u0027crow\u0027, theme: \u0027day\u0027,   tag: \u0027#7FD08A\u0027, color: \u0027#4CAF63\u0027, swatch: \u0027linear-gradient(#7CC8F0, #E2F5FF)\u0027, desc: \u0027낮 하늘 · 까마귀 · 속도 ×1.0 · EXP ×3\u0027 },\n  normal: { label: \u0027Normal\u0027, speed: 1.5, freq: 1.5, gravity: 1.0, expRate: 5, foe: \u0027ufo\u0027,  theme: \u0027night\u0027, tag: \u0027#7B83D6\u0027, color: \u0027#5B63C9\u0027, swatch: \u0027linear-gradient(#0E1438, #3D3F7A)\u0027, desc: \u0027밤하늘 · UFO · 속도 ×1.5 · 빈도 ×1.5 · EXP ×5\u0027 },\n  hard:   { label: \u0027Hard\u0027,   speed: 2.0, freq: 1.5, gravity: 1.2, expRate: 7, foe: \u0027bolt\u0027, theme: \u0027storm\u0027, tag: \u0027#E5674F\u0027, color: \u0027#D9533B\u0027, swatch: \u0027linear-gradient(#2B2F3A, #6B7280)\u0027, desc: \u0027폭풍우 · 번개 · 속도 ×2.0 · 중력 ×1.2 · EXP ×7\u0027 },\n};\nconst FOES = {\n  crow: { rx: 16, ry: 16, name: \u0027까마귀\u0027 },\n  ufo:  { rx: 16, ry: 16, name: \u0027UFO\u0027 },\n  bolt: { rx: 16, ry: 16, name: \u0027번개\u0027 },\n};\nlet stageId = \u0027easy\u0027, S = STAGES.easy;\n\nconst cv = document.getElementById(\u0027cv\u0027);\nconst ctx = cv.getContext(\u00272d\u0027);\nconst overlay = document.getElementById(\u0027overlay\u0027);\nconst stageTag = document.getElementById(\u0027stageTag\u0027);\n\n// 고해상도 화면에서도 선명하게\nfunction fitCanvas() {\n  const dpr = Math.min(3, window.devicePixelRatio || 1);\n  cv.width = W * dpr; cv.height = H * dpr;\n  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n}\nfitCanvas();\nwindow.addEventListener(\u0027resize\u0027, fitCanvas);\n\n// ---------- 상태 ----------\n// mode: select(난이도 선택) → ready(시작 대기) → play → over\nlet mode, player, foes, items, elapsed, ticks, itemPts, hp, invuln, hurtFlash, scroll, nextFoeIn, foeCount, speedLevel, popups, shake, storm;\n\nfunction reset() {\n  mode = \u0027ready\u0027;\n  player = { y: H * .45, vy: 0, flap: 0, bob: 0 };\n  foes = []; items = []; popups = [];\n  elapsed = 0; ticks = 0; itemPts = 0; hp = MAX_HP;\n  invuln = 0; hurtFlash = 0; shake = 0;\n  scroll = 0; foeCount = 0; speedLevel = 0;\n  nextFoeIn = (W + 120) / (BASE_SPEED * S.speed); // 첫 장애물은 화면 너비만큼 흐른 뒤\n  storm = { flash: 0, next: rand(1.5, 4) };\n  overlay.classList.remove(\u0027show\u0027); overlay.innerHTML = \u0027\u0027;\n}\n\nfunction setStage(id) {\n  stageId = id; S = STAGES[id];\n  document.body.dataset.theme = S.theme;\n  stageTag.textContent = S.label.toUpperCase();\n  stageTag.style.setProperty(\u0027--tag\u0027, S.tag);\n}\n\nconst score = () =\u003e ticks * TICK_PTS + itemPts;\nconst speedMul = () =\u003e S.speed + speedLevel * SPEED_STEP; // 화면 · 캐릭터 속도 배율 k\nconst rand = (a, b) =\u003e a + Math.random() * (b - a);\nconst clamp = (v, lo, hi) =\u003e Math.max(lo, Math.min(hi, v));\n\n// ---------- 입력 ----------\nfunction flap() {\n  if (mode !== \u0027ready\u0027 \u0026\u0026 mode !== \u0027play\u0027) return;\n  if (mode === \u0027ready\u0027) { mode = \u0027play\u0027; invuln = INVULN; }\n  const k = speedMul();\n  player.vy = -FLAP * k ** 1.5; // 속도 배율의 1.5제곱만큼 힘차게 (×k 와 ×k² 의 중간)\n  player.flap = 1;           // 귀 팔랑 애니메이션 (1 → 0)\n}\nwindow.addEventListener(\u0027keydown\u0027, e =\u003e {\n  if (e.key === \u0027 \u0027 || e.key === \u0027ArrowUp\u0027) {\n    if (mode !== \u0027ready\u0027 \u0026\u0026 mode !== \u0027play\u0027) return; // 선택 · 결과 화면에선 버튼에 맡김\n    e.preventDefault();\n    if (!e.repeat) flap();\n  }\n});\ncv.addEventListener(\u0027pointerdown\u0027, e =\u003e { e.preventDefault(); flap(); });\n\n// ---------- 진행 ----------\nfunction spawnFoe() {\n  const top = CLOUD_BAND + 34, bottom = H - CLOUD_BAND - 34;\n  const every = rand(FOE_EVERY_MIN, FOE_EVERY_MAX) / S.freq; // 다음 장애물까지 (초)\n  // 홀수 번째는 지금 캐릭터 높이로 정조준, 짝수 번째는 무작위 높이\n  foeCount++;\n  const y = foeCount % 2 ? clamp(player.y, top, bottom) : rand(top, bottom);\n  foes.push({ x: W + 50, y, phase: Math.random() * 6, wob: rand(.6, 1.2), seed: Math.random() * 100 });\n  // 다음 장애물과의 가운데쯤에 가끔 시나몬롤 (장애물과 겹치지 않게)\n  if (Math.random() \u003c ITEM_CHANCE) {\n    items.push({ x: W + 50 + BASE_SPEED * speedMul() * every / 2, y: rand(top, bottom), spin: 0 });\n  }\n  nextFoeIn = every;\n}\n\nfunction damage() {\n  if (invuln \u003e 0 || mode !== \u0027play\u0027) return;\n  hp--;\n  invuln = INVULN;\n  hurtFlash = .35;\n  shake = .3;\n  if (hp \u003c= 0) gameOver();\n}\n\n// 장애물(타원) 과 캐릭터 피격 범위(원) 가 겹치는지\nfunction hits(f) {\n  const d = FOES[S.foe];\n  const nx = (f.x - PLAYER_X) / (d.rx + HURT_R), ny = (f.y - player.y) / (d.ry + HURT_R);\n  return nx * nx + ny * ny \u003c 1;\n}\n\nfunction update(dt) {\n  player.bob += dt;\n  player.flap = Math.max(0, player.flap - dt * 4);\n  hurtFlash = Math.max(0, hurtFlash - dt);\n  shake = Math.max(0, shake - dt);\n  popups.forEach(p =\u003e { p.t += dt; p.y -= 40 * dt; });\n  popups = popups.filter(p =\u003e p.t \u003c .8);\n  // 폭풍우: 가끔 하늘이 번쩍\n  if (S.theme === \u0027storm\u0027) {\n    storm.flash = Math.max(0, storm.flash - dt * 2.5);\n    storm.next -= dt;\n    if (storm.next \u003c= 0) { storm.flash = 1; storm.next = rand(2.5, 6); }\n  }\n\n  if (mode === \u0027ready\u0027 || mode === \u0027select\u0027) {\n    player.y = H * .45 + Math.sin(player.bob * 3) * 8;\n    scroll += BASE_SPEED * .5 * dt; // 배경만 천천히 흐름\n    return;\n  }\n  if (mode !== \u0027play\u0027) return;\n\n  // 시간 · 점수 · 속도\n  elapsed += dt;\n  ticks = Math.floor(elapsed * 10);\n  const lv = Math.floor(elapsed / SPEED_EVERY);\n  if (lv \u003e speedLevel) {\n    speedLevel = lv;\n    popups.push({ x: W / 2, y: H * .3, t: 0, text: \u0027SPEED UP!\u0027, color: \u0027#4DA8E8\u0027, size: 30 });\n  }\n  invuln = Math.max(0, invuln - dt);\n\n  const k = speedMul();\n  const v = BASE_SPEED * k;\n  scroll += v * dt;\n\n  // 캐릭터: 중력 + 구름 벽 (구름도 피격 범위로 판정)\n  player.vy = Math.min(MAX_FALL * k, player.vy + GRAVITY * S.gravity * k * k * dt);\n  player.y += player.vy * dt;\n  const top = CLOUD_BAND + HURT_R, bottom = H - CLOUD_BAND - HURT_R;\n  if (player.y \u003c top) { player.y = top; player.vy = 60 * k; damage(); }             // 위 구름에 부딪혀 살짝 튕겨 내려옴\n  if (player.y \u003e bottom) { player.y = bottom; player.vy = -FLAP * k ** 1.5 * .75; damage(); } // 아래 구름에서 통 튀어 오름\n\n  // 장애물 · 시나몬롤\n  nextFoeIn -= dt;\n  if (nextFoeIn \u003c= 0) spawnFoe();\n  foes.forEach(f =\u003e { f.x -= v * dt; f.phase += dt * 10; f.y += Math.sin(f.phase * .3) * f.wob * 12 * dt; });\n  items.forEach(it =\u003e { it.x -= v * dt; it.spin += dt; });\n  foes = foes.filter(f =\u003e f.x \u003e -60);\n  items = items.filter(it =\u003e it.x \u003e -40 \u0026\u0026 !it.got);\n\n  for (const f of foes) if (hits(f)) damage();\n  for (const it of items) {\n    if (Math.hypot(it.x - PLAYER_X, it.y - player.y) \u003c ITEM_R + PLAYER_R + 4) {\n      it.got = true;\n      itemPts += ITEM_PTS;\n      popups.push({ x: it.x, y: it.y - 10, t: 0, text: `+${ITEM_PTS}`, color: \u0027#F2A541\u0027, size: 24 });\n    }\n  }\n}\n\n// ---------- 그리기: 하늘 ----------\n// 밤하늘 별 · 폭풍우 빗줄기 위치는 한 번만 정해 둠\nconst STARS = Array.from({ length: 46 }, () =\u003e ({ x: Math.random() * W, y: CLOUD_BAND + Math.random() * (H - CLOUD_BAND * 2), r: rand(.6, 1.8), tw: Math.random() * 6 }));\nconst RAIN = Array.from({ length: 70 }, () =\u003e ({ x: Math.random() * W, y: Math.random() * H, len: rand(10, 22), sp: rand(.8, 1.2) }));\n\nfunction drawSky() {\n  const g = ctx.createLinearGradient(0, 0, 0, H);\n  if (S.theme === \u0027day\u0027) {\n    g.addColorStop(0, \u0027#7CC8F0\u0027); g.addColorStop(.6, \u0027#B7E4FA\u0027); g.addColorStop(1, \u0027#E2F5FF\u0027);\n    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);\n    ctx.fillStyle = \u0027rgba(255,240,170,.55)\u0027; ctx.beginPath(); ctx.arc(330, 120, 46, 0, 7); ctx.fill();\n    ctx.fillStyle = \u0027#FFF4B8\u0027; ctx.beginPath(); ctx.arc(330, 120, 30, 0, 7); ctx.fill();\n    farClouds(\u0027rgba(255,255,255,.55)\u0027);\n  } else if (S.theme === \u0027night\u0027) {\n    g.addColorStop(0, \u0027#0E1438\u0027); g.addColorStop(.6, \u0027#26306B\u0027); g.addColorStop(1, \u0027#3D3F7A\u0027);\n    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);\n    const t = player.bob;\n    for (const s of STARS) {\n      ctx.globalAlpha = .45 + .55 * Math.abs(Math.sin(t * 1.6 + s.tw));\n      ctx.fillStyle = \u0027#FFF8D8\u0027;\n      ctx.beginPath(); ctx.arc((s.x - scroll * .05 + W * 10) % W, s.y, s.r, 0, 7); ctx.fill();\n    }\n    ctx.globalAlpha = 1;\n    // 초승달\n    ctx.fillStyle = \u0027rgba(255,236,160,.18)\u0027; ctx.beginPath(); ctx.arc(320, 116, 44, 0, 7); ctx.fill();\n    ctx.fillStyle = \u0027#FFE9A0\u0027; ctx.beginPath(); ctx.arc(320, 116, 26, 0, 7); ctx.fill();\n    ctx.fillStyle = \u0027#16204A\u0027; ctx.beginPath(); ctx.arc(331, 108, 23, 0, 7); ctx.fill();\n    farClouds(\u0027rgba(150,160,220,.16)\u0027);\n  } else {\n    g.addColorStop(0, \u0027#2B2F3A\u0027); g.addColorStop(.6, \u0027#464C5B\u0027); g.addColorStop(1, \u0027#646B7A\u0027);\n    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);\n    farClouds(\u0027rgba(25,27,35,.35)\u0027);\n    // 빗줄기 (비스듬히 떨어짐)\n    ctx.strokeStyle = \u0027rgba(200,215,235,.35)\u0027; ctx.lineWidth = 1.4; ctx.beginPath();\n    for (const r of RAIN) {\n      const y = (r.y + player.bob * 620 * r.sp) % H, x = ((r.x - player.bob * 140 * r.sp - scroll * .3) % W + W) % W;\n      ctx.moveTo(x, y); ctx.lineTo(x - r.len * .35, y + r.len);\n    }\n    ctx.stroke();\n  }\n}\n\n// 멀리 떠 있는 장식 구름 (천천히 흐름, 충돌 없음)\nfunction farClouds(color) {\n  for (let i = 0; i \u003c 4; i++) {\n    const x = ((i * 150 - scroll * .25) % 600 + 600) % 600 - 100;\n    puff(x, 170 + (i % 2) * 150 + i * 20, .7, color);\n  }\n}\nfunction puff(x, y, s, color) {\n  ctx.fillStyle = color;\n  ctx.beginPath();\n  ctx.arc(x, y, 22 * s, 0, 7); ctx.arc(x + 24 * s, y - 10 * s, 26 * s, 0, 7);\n  ctx.arc(x + 52 * s, y, 22 * s, 0, 7); ctx.arc(x + 26 * s, y + 8 * s, 22 * s, 0, 7);\n  ctx.fill();\n}\n\n// 위·아래 구름 띠: 몽글몽글한 원을 이어 그리고 흐르게 (하늘 색에 맞춰 구름 색도 바뀜)\nconst BAND = {\n  day:   { fill: \u0027#FFFFFF\u0027, shade: \u0027rgba(160,200,230,.25)\u0027 },\n  night: { fill: \u0027#8790C4\u0027, shade: \u0027rgba(20,24,60,.35)\u0027 },\n  storm: { fill: \u0027#80869A\u0027, shade: \u0027rgba(20,22,30,.4)\u0027 },\n};\nfunction drawCloudBands() {\n  const step = 38, off = scroll * .9 % step, b = BAND[S.theme];\n  for (const side of [0, 1]) {\n    const edge = side ? H - CLOUD_BAND : CLOUD_BAND;\n    ctx.fillStyle = b.fill;\n    ctx.fillRect(0, side ? edge + 6 : 0, W, CLOUD_BAND - 6);\n    ctx.beginPath();\n    for (let x = -step - off; x \u003c W + step; x += step) {\n      const k = Math.round((x + scroll * .9) / step);\n      const r = 22 + (k % 3) * 4;\n ); ctx.ellipse(-4, -10, 3, 2, -.5, 0, 7); ctx.fill();\n  // 접시\n  const g = ctx.createLinearGradient(0, -6, 0, 8);\n  g.addColorStop(0, \u0027#E9EDF5\u0027); g.addColorStop(1, \u0027#8D96AB\u0027);\n  ctx.fillStyle = g; ctx.strokeStyle = \u0027#5F677C\u0027; ctx.lineWidth = 1.5;\n  ctx.beginPath(); ctx.ellipse(0, 1, 28, 8, 0, 0, 7); ctx.fill(); ctx.stroke();\n  // 불빛\n  const colors = [\u0027#FF6F96\u0027, \u0027#FFE46B\u0027, \u0027#7CF7C4\u0027];\n  for (let i = 0; i \u003c 5; i++) {\n    ctx.fillStyle = colors[(i + Math.floor(u.phase)) % 3];\n    ctx.beginPath(); ctx.arc(-18 + i * 9, 3, 2.2, 0, 7); ctx.fill();\n  }\n  ctx.restore();\n}\n\n// 번개: 가로로 지글지글 튀는 전기 줄기 (까마귀 · UFO 보다 가로 1.5배)\nfunction drawBolt(b) {\n  ctx.save();\n  ctx.translate(b.x, b.y);\n  const n = 5, half = 29; // 까마귀 · UFO 와 같은 가로 길이\n  const jitter = Math.floor(b.phase * 1.5); // 조금씩 모양이 바뀜\n  const pts = [];\n  for (let i = 0; i \u003c= n; i++) {\n    const s = Math.sin((i + 1) * 12.9898 + b.seed + jitter * 78.233) * 43758.5453;\n    const r = s - Math.floor(s);\n    pts.push([-half + (half * 2) * i / n, (i % 2 ? -1 : 1) * (6 + r * 8) * (i === 0 || i === n ? .3 : 1)]);\n  }\n  const path = () =\u003e { ctx.beginPath(); pts.forEach(([x, y], i) =\u003e i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); };\n  ctx.lineJoin = \u0027miter\u0027; ctx.lineCap = \u0027round\u0027;\n  path(); ctx.strokeStyle = \u0027rgba(255,236,120,.28)\u0027; ctx.lineWidth = 16; ctx.stroke();\n  path(); ctx.strokeStyle = \u0027#FFD93B\u0027; ctx.lineWidth = 7; ctx.stroke();\n  path(); ctx.strokeStyle = \u0027#FFFDF0\u0027; ctx.lineWidth = 2.8; ctx.stroke();\n  // 끝에서 튀는 작은 불꽃\n  ctx.fillStyle = \u0027#FFF6B0\u0027;\n  for (const sx of [-half, half]) { ctx.beginPath(); ctx.arc(sx, 0, 3 + Math.abs(Math.sin(b.phase * 2)) * 2, 0, 7); ctx.fill(); }\n  ctx.restore();\n}\nconst DRAW_FOE = { crow: drawCrow, ufo: drawUfo, bolt: drawBolt };\n\n// 시나몬롤 (시나모롤이 좋아하는 빵)\nfunction drawItem(it) {\n  ctx.save();\n  ctx.translate(it.x, it.y + Math.sin(it.spin * 4) * 3);\n  ctx.fillStyle = \u0027rgba(255,220,140,.35)\u0027; ctx.beginPath(); ctx.arc(0, 0, ITEM_R + 7, 0, 7); ctx.fill();\n  ctx.fillStyle = \u0027#E3A35E\u0027; ctx.strokeStyle = \u0027#A8672E\u0027; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.arc(0, 0, ITEM_R, 0, 7); ctx.fill(); ctx.stroke();\n  ctx.strokeStyle = \u0027#B8743A\u0027; ctx.lineWidth = 2.2; ctx.beginPath();\n  for (let a = 0; a \u003c 13; a += .3) { const r = a * .95; const px = Math.cos(a) * r, py = Math.sin(a) * r; a ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }\n  ctx.stroke();\n  ctx.strokeStyle = \u0027rgba(255,255,255,.9)\u0027; ctx.lineWidth = 2.4;\n  ctx.beginPath(); ctx.moveTo(-8, -4); ctx.quadraticCurveTo(-2, 2, 4, -6); ctx.quadraticCurveTo(7, -2, 9, 3); ctx.stroke();\n  ctx.restore();\n}\n\n// ---------- 그리기: 화면 위 정보 ----------\nconst HEART_PATH = new Path2D(\u0027M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.9 4.5 6.6 4.5c2.2 0 3.6 1.2 5.4 3.2 1.8-2 3.2-3.2 5.4-3.2 3.7 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z\u0027);\n// 구름 띠 색이 하늘마다 달라서 글자색도 맞춤\nconst HUD = {\n  day:   { ink: \u0027#3B5675\u0027, sub: \u0027#6F88A6\u0027, stroke: \u0027#fff\u0027,    off: \u0027rgba(59,86,117,.25)\u0027 },\n  night: { ink: \u0027#FFFFFF\u0027, sub: \u0027#E3E6FF\u0027, stroke: \u0027#2C346E\u0027, off: \u0027rgba(255,255,255,.3)\u0027 },\n  storm: { ink: \u0027#FFFFFF\u0027, sub: \u0027#EEF0F5\u0027, stroke: \u0027#2B2F3A\u0027, off: \u0027rgba(255,255,255,.3)\u0027 },\n};\nfunction drawHud() {\n  const c = HUD[S.theme];\n  for (let i = 0; i \u003c MAX_HP; i++) {\n    ctx.save(); ctx.translate(14 + i * 30, 10); ctx.scale(1.1, 1.1);\n    ctx.fillStyle = i \u003c hp ? \u0027#FF6F96\u0027 : c.off;\n    ctx.fill(HEART_PATH); ctx.restore();\n  }\n  ctx.textAlign = \u0027right\u0027; ctx.textBaseline = \u0027top\u0027;\n  ctx.font = \u002730px Jua, sans-serif\u0027;\n  ctx.lineWidth = 5; ctx.strokeStyle = c.stroke; ctx.strokeText(score(), W - 14, 8);\n  ctx.fillStyle = c.ink; ctx.fillText(score(), W - 14, 8);\n  ctx.font = \u002713px Jua, sans-serif\u0027; ctx.fillStyle = c.sub;\n  ctx.fillText(`SPEED ×${speedMul().toFixed(1)}`, W - 14, 40);\n}\n\nfunction drawPopups() {\n  ctx.textAlign = \u0027center\u0027; ctx.textBaseline = \u0027middle\u0027;\n  for (const p of popups) {\n    ctx.globalAlpha = 1 - p.t / .8;\n    ctx.font = `${p.size}px Jua, sans-serif`;\n    ctx.lineWidth = 5; ctx.strokeStyle = \u0027#fff\u0027; ctx.strokeText(p.text, p.x, p.y);\n    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);\n  }\n  ctx.globalAlpha = 1;\n}\n\nfunction drawReady() {\n  ctx.textAlign = \u0027center\u0027; ctx.textBaseline = \u0027middle\u0027;\n  ctx.fillStyle = \u0027rgba(255,255,255,.88)\u0027;\n  roundRect(W / 2 - 130, H * .62, 260, 70, 20); ctx.fill();\n  ctx.fillStyle = S.color; ctx.font = \u002722px Jua, sans-serif\u0027;\n  ctx.fillText(`${S.label} · 스페이스 · 클릭으로 출발!`, W / 2, H * .62 + 26);\n  ctx.fillStyle = \u0027#6F88A6\u0027; ctx.font = \u002714px Jua, sans-serif\u0027;\n  ctx.fillText(`${FOES[S.foe].name}와 구름을 피해 날아올라요`, W / 2, H * .62 + 50);\n}\nfunction roundRect(x, y, w, h, r) {\n  ctx.beginPath();\n  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();\n}\n\nfunction render() {\n  ctx.save();\n  if (shake \u003e 0) ctx.translate(rand(-4, 4) * shake / .3, rand(-4, 4) * shake / .3);\n  drawSky();\n  items.forEach(drawItem);\n  foes.forEach(DRAW_FOE[S.foe]);\n  drawPlayer();\n  drawCloudBands();\n  ctx.restore();\n  if (S.theme === \u0027storm\u0027 \u0026\u0026 storm.flash \u003e 0) { ctx.fillStyle = `rgba(255,255,240,${storm.flash * .35})`; ctx.fillRect(0, 0, W, H); }\n  if (hurtFlash \u003e 0) { ctx.fillStyle = `rgba(255,111,150,${hurtFlash})`; ctx.fillRect(0, 0, W, H); }\n  drawHud();\n  drawPopups();\n  if (mode === \u0027ready\u0027) drawReady();\n}\n\n// ---------- 난이도 선택 ----------\nfunction showSelect() {\n  mode = \u0027select\u0027;\n  overlay.innerHTML = `\n    \u003cdiv class=\"card\"\u003e\n      \u003ch2 class=\"pick\"\u003e난이도\u003c/h2\u003e\n      \u003cp class=\"info\" style=\"margin-top:8px\"\u003e5초마다 속도 +20%p · 하트 3개\u003c/p\u003e\n      \u003cdiv class=\"modes\"\u003e${Object.entries(STAGES).map(([id, s]) =\u003e {\n        const b = loadRecord(GAME.bests[s.label]);\n        return `\u003cbutton class=\"mode-btn\" data-stage=\"${id}\" style=\"--c:${s.color};--bg:${s.swatch}\"\u003e\n          \u003cspan class=\"sw\"\u003e\u003c/span\u003e\n          \u003cspan class=\"txt\"\u003e\u003cb\u003e${s.label}\u003c/b\u003e\u003cspan\u003e${s.desc}\u003c/span\u003e\u003c/span\u003e\n          \u003csmall\u003e${b !== null ? `최고 ${fmt(b)}` : \u0027\u0027}\u003c/small\u003e\u003c/button\u003e`;\n      }).join(\u0027\u0027)}\u003c/div\u003e\n    \u003c/div\u003e`;\n  overlay.classList.add(\u0027show\u0027);\n  overlay.querySelectorAll(\u0027.mode-btn\u0027).forEach(b =\u003e b.addEventListener(\u0027click\u0027, () =\u003e { setStage(b.dataset.stage); reset(); }));\n  overlay.querySelector(\u0027.mode-btn\u0027).focus();\n}\n\n// ---------- 게임 오버 ----------\nfunction gameOver() {\n  mode = \u0027over\u0027;\n  const s = score();\n  const key = GAME.bests[S.label];\n  const best = loadRecord(key);\n  const isBest = s \u003e 0 \u0026\u0026 (best === null || s \u003e best);\n  if (isBest) { try { localStorage.setItem(key, String(s)); } catch {} }\n  const gain = s * S.expRate;\n  const { all, game } = giveExp(GAME.lvKey, gain);\n  const up = all.to.lv \u003e all.from.lv || game.to.lv \u003e game.from.lv;\n  setTimeout(() =\u003e {\n    overlay.innerHTML = `\n      \u003cdiv class=\"card\"\u003e\n        \u003ch2\u003e게임 오버\u003c/h2\u003e\n        \u003cp class=\"info\" style=\"margin-top:6px;color:${S.color}\"\u003e${S.label}\u003c/p\u003e\n        \u003cdiv class=\"big\"\u003e${fmt(s)}\u003csmall\u003e점\u003c/small\u003e\u003c/div\u003e\n        ${isBest ? \u0027\u003cspan class=\"best\"\u003e최고 기록!\u003c/span\u003e\u0027 : best !== null ? `\u003cspan class=\"best plain\"\u003e최고 ${fmt(best)}점\u003c/span\u003e` : \u0027\u0027}\n        \u003cp class=\"info\"\u003e${elapsed.toFixed(1)}초 비행 · 시나몬롤 ${itemPts / ITEM_PTS}개\u003c/p\u003e\n        \u003cp class=\"exp\"\u003e+${fmt(gain)} EXP \u003csmall style=\"color:var(--ink-soft)\"\u003e(× ${S.expRate})\u003c/small\u003e\u003c/p\u003e\n        \u003cp class=\"info\" style=\"margin-top:4px\"\u003e${up ? \u0027레벨 업! · \u0027 : \u0027\u0027}${GAME.title} Lv.${game.to.lv} · 전체 Lv.${all.to.lv}\u003c/p\u003e\n        \u003cdiv class=\"btns\"\u003e\n          \u003cbutton class=\"btn\" id=\"again\"\u003e다시 하기\u003c/button\u003e\n          \u003cbutton class=\"btn ghost\" id=\"pick\"\u003e난이도 선택\u003c/button\u003e\n          \u003ca class=\"btn ghost\" href=\"../index.html\"\u003e홈으로\u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e`;\n    overlay.classList.add(\u0027show\u0027);\n    const again = overlay.querySelector(\u0027#again\u0027), pick = overlay.querySelector(\u0027#pick\u0027);\n    again.addEventListener(\u0027click\u0027, reset);\n    pick.addEventListener(\u0027click\u0027, showSelect);\n    // 연타하던 스페이스로 바로 재시작되지 않도록 잠깐 뒤에 포커스\n    again.disabled = pick.disabled = true;\n    setTimeout(() =\u003e { again.disabled = pick.disabled = false; again.focus(); }, 600);\n  }, 700);\n}\n\n// ---------- 메인 루프 ----------\nlet lastT = performance.now();\nfunction loop(t) {\n  const dt = Math.min(.033, Math.max(0, (t - lastT) / 1000)); // 탭이 멈췄다 돌아와도 순간이동하지 않도록\n  lastT = t;\n  update(dt);\n  render();\n  requestAnimationFrame(loop);\n}\n\n// 처음엔 Easy 하늘을 뒤에 깔아 두고 난이도 선택 창을 띄움\nsetStage(\u0027easy\u0027);\nreset();\nshowSelect();\nrequestAnimationFrame(loop);\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"}</script>
<script>
// 포장본 바깥 틀: 페이지 이동 · 뒤로가기 · 이 파일 다시 저장하기
const PAGES = JSON.parse(document.getElementById('pages').textContent);
const view = document.getElementById('view');
let cur = 'index.html';

// 지금 페이지 기준 상대 경로 → 'games/rps.html' 같은 키
function resolve(from, href) {
  const parts = from.split('/'); parts.pop();
  for (const p of href.split('#')[0].split('/')) {
    if (p === '..') parts.pop(); else if (p && p !== '.') parts.push(p);
  }
  return parts.join('/');
}

function show(path, mode) {
  if (!PAGES[path]) path = 'index.html';
  cur = path;
  view.srcdoc = PAGES[path];
  try {
    if (mode === 'push') history.pushState({ path: path }, '', '#' + path);
    else if (mode === 'replace') history.replaceState({ path: path }, '', '#' + path);
  } catch (e) {}
}

window.__pack = {
  go: function (href) { show(resolve(cur, href), 'push'); },
  save: function () {
    const root = document.documentElement.cloneNode(true);
    root.querySelector('#view').removeAttribute('srcdoc');
    const blob = new Blob(['<!doctype html>\n' + root.outerHTML], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Claude_Game.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  },
};

view.addEventListener('load', function () {
  try { document.title = view.contentDocument.title || document.title; } catch (e) {}
  view.focus();
});
addEventListener('popstate', function (e) { show((e.state && e.state.path) || 'index.html'); });
show(decodeURIComponent(location.hash.slice(1)) || 'index.html', 'replace');
</script>

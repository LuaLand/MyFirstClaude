mall .lv-badge { min-width: 64px; padding: 5px 8px 4px; font-size: 14px; background: var(--paper); color: var(--ink); transform: none; }\n  .lv.small .lv-bar { height: 10px; border-width: 2px; }\n  .lv.small .lv-fill { background: var(--yellow); border-right-width: 2px; }\n\n  /* 메인(홈)으로 */\n  .home {\n    position: fixed; top: 10px; right: 16px; z-index: 2;\n    display: inline-flex; align-items: center; gap: 6px;\n    padding: 7px 12px 6px; border-radius: 99px; border: 2.5px solid var(--ink);\n    background: var(--paper); color: var(--ink); text-decoration: none;\n    font: 400 14px/1 var(--cap); box-shadow: 0 3px 0 var(--ink);\n  }\n  .home:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }\n  .home:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }\n  body[data-state=\"play\"] .home { opacity: .55; }\n  .exp-gain { margin: 4px 0 0; font-size: 34px; color: var(--cyan); --d: 4px; transform: rotate(-2deg); animation: stamp .5s var(--pop) .5s both; }\n  .exp-calc { margin: 6px 0 14px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }\n\n  @media (max-width: 380px) {\n    #stage { padding: 16px 14px 20px; }\n    .hud { padding: 12px 14px 10px; }\n    .logo .n { font-size: 68px; }\n    .logo .w { font-size: 42px; }\n    .mash { width: 160px; height: 160px; }\n    .mash-num { font-size: 62px; }\n    .diff { font-size: 18px; }\n  }\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n  }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"bug\" aria-hidden=\"true\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003eLIVE\u003c/b\u003e15초 미션\u003c/div\u003e\n\u003ca class=\"home\" href=\"../index.html\"\u003e\u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003cpath d=\"M4 11.5 12 5l8 6.5M6.5 10v9h11v-9\"/\u003e\u003c/svg\u003e홈\u003c/a\u003e\n\u003cmain class=\"device\"\u003e\n  \u003cheader class=\"hud\"\u003e\n    \u003cdiv class=\"clock\" id=\"clock\"\u003e\n      \u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003ccircle cx=\"12\" cy=\"14\" r=\"8\"/\u003e\u003cpath d=\"M12 14V10M10 2h4M12 2v4M19 7l1.5-1.5\"/\u003e\u003c/svg\u003e\n      \u003cspan id=\"time\"\u003e15.00\u003c/span\u003e\n    \u003c/div\u003e\n    \u003col class=\"steps\" id=\"steps\"\u003e\u003c/ol\u003e\n  \u003c/header\u003e\n  \u003cdiv class=\"timebar\"\u003e\u003cdiv id=\"timefill\"\u003e\u003c/div\u003e\u003c/div\u003e\n  \u003csection id=\"stage\" aria-live=\"polite\"\u003e\u003c/section\u003e\n\u003c/main\u003e\n\n\u003cscript\u003e\n// 메인 화면과 모든 게임이 함께 쓰는 코드: 게임 목록 + 레벨·경험치\n// 게임을 깨면 같은 경험치가 \u0027전체 레벨\u0027과 \u0027그 게임 레벨\u0027에 함께 쌓임\n\n// ---------- 게임 목록 ----------\n// href는 메인(index.html) 기준 경로 / lvKey: 게임별 레벨 저장 키\n// bests: { 표시 이름: 최고 기록 저장 키 } / bestUnit: 기록 단위\nconst GAMES = [\n  {\n    id: \u0027mission15\u0027,\n    title: \u002715초 미션\u0027,\n    desc: \u002715초 안에 미니게임 3개를 모두 깨라!\u0027,\n    href: \u0027games/mission15.html\u0027,\n    lvKey: \u0027lv15\u0027,\n    bests: { Easy: \u0027best15\u0027, Normal: \u0027best15_normal\u0027, Hard: \u0027best15_hard\u0027 },\n    bestUnit: \u0027초\u0027,\n  },\n  {\n    id: \u0027rps\u0027,\n    title: \u0027가위바위보\u0027,\n    desc: \u002710판 운 승부, 또는 15초 동안 이기는 패 골라내기!\u0027,\n    href: \u0027games/rps.html\u0027,\n    lvKey: \u0027lv_rps\u0027,\n    // 15초 모드는 점수 체계가 바뀌어(정답 +1 / 오답 -1) v2 키로 새로 시작\n    bests: { \u0027일반\u0027: \u0027rps_best\u0027, Easy: \u0027rps2_best_easy\u0027, Normal: \u0027rps2_best_normal\u0027, Hard: \u0027rps2_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027mole\u0027,\n    title: \u0027두더지 잡기\u0027,\n    desc: \u002715초 동안 두더지를 잡아라! 황금 두더지는 +30, 폭탄은 -50.\u0027,\n    href: \u0027games/mole.html\u0027,\n    lvKey: \u0027lv_mole\u0027,\n    // 점수 체계가 바뀌어(일반 +10 / 황금 +30 / 폭탄 -50 / 도망 -10 / 헛방 -1) v4 키로 새로 시작\n    bests: { Easy: \u0027mole4_best_easy\u0027, Normal: \u0027mole4_best_normal\u0027, Hard: \u0027mole4_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027brick\u0027,\n    title: \u0027벽돌깨기\u0027,\n    desc: \u002760초 안에 벽돌 24개를 모두 깨라! 4개마다 스피드 업.\u0027,\n    href: \u0027games/brick.html\u0027,\n    lvKey: \u0027lv_brick\u0027,\n    bests: { Easy: \u0027brick_best_easy\u0027, Normal: \u0027brick_best_normal\u0027, Hard: \u0027brick_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027runner\u0027,\n    title: \u0027시나모롤 런\u0027,\n    desc: \u0027귀를 팔랑이며 하늘을 날아라! 낮 · 밤 · 폭풍우 3가지 하늘.\u0027,\n    href: \u0027games/runner.html\u0027,\n    lvKey: \u0027lv_runner\u0027,\n    bests: { Easy: \u0027runner_best_easy\u0027, Normal: \u0027runner_best_normal\u0027, Hard: \u0027runner_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n];\n\n// ---------- 페이지 이동 ----------\n// 한 파일로 포장된 버전(dist/Claude_Game.html)에서는 바깥 틀(__pack)이 페이지를 바꿔 줌\nconst PACK = (() =\u003e { try { return (window.parent !== window \u0026\u0026 window.parent.__pack) || null; } catch { return null; } })();\nfunction goTo(href) { if (PACK) PACK.go(href); else location.href = href; }\nif (PACK) document.addEventListener(\u0027click\u0027, e =\u003e {\n  const a = e.target.closest(\u0027a[href]\u0027);\n  if (!a || /^(https?:|#|mailto:)/.test(a.getAttribute(\u0027href\u0027))) return;\n  e.preventDefault();\n  PACK.go(a.getAttribute(\u0027href\u0027));\n});\n\n// 예전 점수 체계(정답 +3)의 가위바위보 15초 모드 기록 정리\ntry { [\u0027rps_best_easy\u0027, \u0027rps_best_normal\u0027, \u0027rps_best_hard\u0027].forEach(k =\u003e localStorage.removeItem(k)); } catch {}\n// 예전 점수 체계의 두더지 잡기 · 난이도가 없던 벽돌깨기·시나모롤 런 기록 정리\ntry { [\u0027mole_best_easy\u0027, \u0027mole2_best_easy\u0027, \u0027mole2_best_normal\u0027, \u0027mole2_best_hard\u0027, \u0027mole3_best_easy\u0027, \u0027mole3_best_normal\u0027, \u0027mole3_best_hard\u0027, \u0027brick_best\u0027, \u0027runner_best\u0027].forEach(k =\u003e localStorage.removeItem(k)); } catch {}\n\n// ---------- 레벨 ----------\n// 다음 레벨까지 필요 경험치 = Lv² × 1000 (exp는 현재 레벨 안에서 쌓인 양)\nconst LV_ALL_KEY = \u0027lv_all\u0027;\nconst needExp = lv =\u003e lv * lv * 1000;\nconst fmt = n =\u003e n.toLocaleString(\u0027ko-KR\u0027);\n\nfunction loadLv(key = LV_ALL_KEY) {\n  try {\n    const s = JSON.parse(localStorage.getItem(key));\n    if (s \u0026\u0026 s.lv \u003e= 1 \u0026\u0026 s.exp \u003e= 0) return { lv: s.lv, exp: s.exp };\n  } catch {}\n  return { lv: 1, exp: 0 };\n}\nfunction saveLv(key, s) { try { localStorage.setItem(key, JSON.stringify(s)); } catch {} }\n\nfunction gainExp(key, gain) {\n  const from = loadLv(key);\n  const to = { ...from, exp: from.exp + gain };\n  while (to.exp \u003e= needExp(to.lv)) { to.exp -= needExp(to.lv); to.lv++; }\n  saveLv(key, to);\n  return { from, to };\n}\n\n// 게임 클리어 시 호출 → { all: 전체 레벨 변화, game: 게임 레벨 변화 }\nfunction giveExp(gameLvKey, gain) {\n  gain = Math.max(0, gain); // 음수 EXP로 레벨이 깎이지 않도록\n  return { all: gainExp(LV_ALL_KEY, gain), game: gainExp(gameLvKey, gain) };\n}\n\nfunction loadRecord(key) {\n  try { return parseFloat(localStorage.getItem(key)) || null; } catch { return null; }\n}\n\n\u003c/script\u003e\n\u003cscript\u003e\nconst LIMIT = 15;\nconst stage = document.getElementById(\u0027stage\u0027);\nconst clockEl = document.getElementById(\u0027clock\u0027);\nconst timeEl = document.getElementById(\u0027time\u0027);\nconst fillEl = document.getElementById(\u0027timefill\u0027);\nconst stepsEl = document.getElementById(\u0027steps\u0027);\n\nconst ICON = {\n  tap:   \u0027\u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"3.5\"/\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"8.5\" stroke-dasharray=\"3 3.2\"/\u003e\u003c/svg\u003e\u0027,\n  route: \u0027\u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003cpath d=\"M6 18 12 7l6 8\"/\u003e\u003ccircle cx=\"6\" cy=\"18\" r=\"2.6\"/\u003e\u003ccircle cx=\"12\" cy=\"7\" r=\"2.6\"/\u003e\u003ccircle cx=\"18\" cy=\"15\" r=\"2.6\"/\u003e\u003c/svg\u003e\u0027,\n  aim:   \u0027\u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003crect x=\"2.5\" y=\"8.5\" width=\"19\" height=\"7\" rx=\"3.5\"/\u003e\u003cpath d=\"M14 4.5v15\"/\u003e\u003c/svg\u003e\u0027,\n  check: \u0027\u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\u0027,\n  cross: \u0027\u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003cpath d=\"M6 6l12 12M18 6 6 18\"/\u003e\u003c/svg\u003e\u0027,\n  retry: \u0027\u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003cpath d=\"M3.5 12a8.5 8.5 0 1 0 2.6-6.1\"/\u003e\u003cpath d=\"M3.5 4v5h5\"/\u003e\u003c/svg\u003e\u0027,\n  play:  \u0027\u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003cpath d=\"M7 4.5v15l12-7.5z\" fill=\"currentColor\"/\u003e\u003c/svg\u003e\u0027,\n  trophy:\u0027\u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003cpath d=\"M8 4h8v5a4 4 0 0 1-8 0zM8 6H4.5v1.5A3.5 3.5 0 0 0 8 11M16 6h3.5v1.5A3.5 3.5 0 0 1 16 11M12 13v4M8.5 20h7\"/\u003e\u003c/svg\u003e\u0027,\n  lock:  \u0027\u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003crect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2.5\"/\u003e\u003cpath d=\"M8 11V8a4 4 0 0 1 8 0v3\"/\u003e\u003c/svg\u003e\u0027,\n  reset: \u0027\u003csvg class=\"i\" viewBox=\"0 0 24 24\"\u003e\u003cpath d=\"M3.5 12a8.5 8.5 0 1 0 2.6-6.1\"/\u003e\u003cpath d=\"M3.5 4v5h5\"/\u003e\u003c/svg\u003e\u0027,\n};\n\n// ---------- 난이도 ----------\n// tapGoal: 1단계 필요 횟수 / hideFrom: 이 횟수부터 카운트를 ??로 표시 (0 = 숨기지 않음)\n// numCount, numSize: 2단계 버튼 개수와 크기(px) / speed: 3단계 막대 속도(%/초), zoneW: 초록 구역 폭(%)\n// expRate, expBase: 클리어 경험치 = 남은 시간(초) × expRate + expBase\nconst DIFFS = {\n  easy:   { label: \u0027Easy\u0027,   key: \u0027best15\u0027,        tapGoal: 10, hideFrom: 0,  numCount: 5,  numSize: 60, speed: 110, zoneW: 18,      expRate: 100, expBase: 0 },\n  normal: { label: \u0027Normal\u0027, key: \u0027best15_normal\u0027, tapGoal: 15, hideFrom: 10, numCount: 7,  numSize: 42, speed: 220, zoneW: 18 * .8, expRate: 200, expBase: 1000 },\n  hard:   { label: \u0027Hard\u0027,   key: \u0027best15_hard\u0027,   tapGoal: 20, hideFrom: 1,  numCount: 10, numSize: 30, speed: 330, zoneW: 18 * .6, expRate: 400, expBase: 3000 },\n};\nlet diffId = \u0027easy\u0027;\nlet D = DIFFS.easy;\n\nlet startAt = 0, rafId = 0, running = false, missionIdx = 0, cleanup = null;\n\nfunction loadBest(id = diffId) { try { return parseFloat(localStorage.getItem(DIFFS[id].key)) || null; } catch { return null; } }\nfunction saveBest(t) { try { localStorage.setItem(D.key, t); } catch {} }\n\n// ---------- 레벨 (계산·저장은 shared.js) ----------\nconst GAME = GAMES.find(g =\u003e g.id === \u0027mission15\u0027);\nconst sleep = ms =\u003e new Promise(r =\u003e setTimeout(r, ms));\n\n// label: 바 아래 숫자 앞에 붙는 이름 (\u002715초 미션\u0027 / \u0027전체\u0027)\nfunction lvHTML(s, id, label, small = false) {\n  const need = needExp(s.lv);\n  return `\u003cdiv class=\"lv ${small ? \u0027small\u0027 : \u0027\u0027}\" id=\"${id}\" data-label=\"${label}\"\u003e\n    \u003cspan class=\"lv-badge\"\u003eLv.${s.lv}\u003c/span\u003e\n    \u003cdiv class=\"lv-main\"\u003e\n      \u003cdiv class=\"lv-bar\"\u003e\u003ci class=\"lv-fill\" style=\"width:${s.exp / need * 100}%\"\u003e\u003c/i\u003e\u003c/div\u003e\n      \u003cspan class=\"lv-num\"\u003e${label} · ${fmt(s.exp)} / ${fmt(need)} EXP\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e`;\n}\n\n// 결과 화면에서 경험치 바를 이전 상태 → 새 상태로 채움 (레벨업 시 한 칸씩 꽉 채우고 넘어감)\nasync function playExp(id, from, to) {\n  const el = stage.querySelector(\u0027#\u0027 + id);\n  if (!el) return;\n  const badge = el.querySelector(\u0027.lv-badge\u0027), fill = el.querySelector(\u0027.lv-fill\u0027), num = el.querySelector(\u0027.lv-num\u0027);\n  const label = el.dataset.label;\n  await sleep(700);\n  for (let lv = from.lv; lv \u003c to.lv; lv++) {\n    if (!el.isConnected) return;\n    fill.style.width = \u0027100%\u0027;\n    num.textContent = `${label} · ${fmt(needExp(lv))} / ${fmt(needExp(lv))} EXP`;\n    await sleep(750);\n    if (!el.isConnected) return;\n    badge.textContent = `Lv.${lv + 1}`;\n    badge.classList.remove(\u0027up\u0027); void badge.offsetWidth; badge.classList.add(\u0027up\u0027);\n    fill.style.transition = \u0027none\u0027; fill.style.width = \u00270%\u0027; void fill.offsetWidth; fill.style.transition = \u0027\u0027;\n  }\n  if (!el.isConnected) return;\n  fill.style.width = (to.exp / needExp(to.lv) * 100) + \u0027%\u0027;\n  num.textContent = `${label} · ${fmt(to.exp)} / ${fmt(needExp(to.lv))} EXP`;\n}\n\nasync function playAllExp({ all, game }) {\n  await Promise.all([playExp(\u0027lv-game\u0027, game.from, game.to), playExp(\u0027lv-all\u0027, all.from, all.to)]);\n  if (!stage.querySelector(\u0027#lv-game\u0027)) return;\n  // 둘 다 오르면 전체 레벨 업을 우선 보여줌\n  if (all.to.lv \u003e all.from.lv) toast(\u0027레벨 업!\u0027, `전체 Lv.${all.to.lv} 달성`);\n  else if (game.to.lv \u003e game.from.lv) toast(\u0027레벨 업!\u0027, `${GAME.title} Lv.${game.to.lv} 달성`);\n}\n\nfunction lvBlock() {\n  return lvHTML(loadLv(GAME.lvKey), \u0027lv-game\u0027, GAME.title) + lvHTML(loadLv(), \u0027lv-all\u0027, \u0027전체\u0027, true);\n}\n\nfunction renderSteps() {\n  stepsEl.innerHTML = MISSIONS.map((m, i) =\u003e {\n    const cls = i \u003c missionIdx ? \u0027done\u0027 : (i === missionIdx \u0026\u0026 running ? \u0027now\u0027 : \u0027\u0027);\n    return `\u003cli class=\"${cls}\" aria-label=\"미션 ${i + 1}\"\u003e${i \u003c missionIdx ? ICON.check : ICON[m.icon]}\u003c/li\u003e`;\n  }).join(\u0027\u0027);\n}\n\nfunction shake(el = stage) {\n  el.classList.remove(\u0027shake\u0027);\n  void el.offsetWidth;\n  el.classList.add(\u0027shake\u0027);\n}\n\n// 실수하면 예능 자막처럼 큰 글씨가 비스듬히 박힘\nfunction toast(big, small) {\n  stage.querySelectorAll(\u0027.toast\u0027).forEach(t =\u003e t.remove());\n  const t = document.createElement(\u0027div\u0027);\n  t.className = \u0027toast cap\u0027;\n  t.setAttribute(\u0027role\u0027, \u0027status\u0027);\n  t.innerHTML = `${big}\u003csmall\u003e${small}\u003c/small\u003e`;\n  stage.appendChild(t);\n  t.addEventListener(\u0027animationend\u0027, () =\u003e t.remove());\n}\n\nfunction onSpace(fn) {\n  const h = e =\u003e { if (e.code === \u0027Space\u0027 \u0026\u0026 !e.repeat) { e.preventDefault(); fn(); } };\n  window.addEventListener(\u0027keydown\u0027, h);\n  return () =\u003e window.removeEventListener(\u0027keydown\u0027, h);\n}\n\n// ---------- 미션 정의 ----------\nconst MISSIONS = [\n  {\n    name: () =\u003e `딱 ${D.tapGoal}번`,\n    icon: \u0027tap\u0027, color: \u0027c1\u0027,\n    menuTitle: \u0027정해진 횟수만큼 누르기\u0027,\n    title: () =\u003e `딱 ${D.tapGoal}번 누르기`,\n    desc: () =\u003e `정확히 ${D.tapGoal}번 누르고 0.5초 기다리세요.` + (\n      D.hideFrom === 1 ? \u0027\u003cbr\u003e누르는 순간부터 숫자가 가려져요!\u0027\n      : D.hideFrom ? `\u003cbr\u003e${D.hideFrom}번째부터는 숫자가 가려져요!` : \u0027\u0027),\n    rule: \u0027더 누르면 처음부터\u0027,\n    start(done, play) {\n      const GOAL = D.tapGoal;\n      const hidden = n =\u003e D.hideFrom \u003e 0 \u0026\u0026 n \u003e= D.hideFrom;\n      let count = 0, waitId = 0;\n      play.innerHTML = `\n        \u003cbutton class=\"mash\" id=\"mash\" aria-label=\"누르기\"\u003e\n          \u003ci class=\"mash-fill\"\u003e\u003c/i\u003e\n          \u003cspan class=\"mash-num cap\"\u003e${GOAL}\u003c/span\u003e\n          \u003cspan class=\"mash-label\"\u003e남음\u003c/span\u003e\n        \u003c/button\u003e\n        \u003cdiv class=\"dots\"\u003e${\u0027\u003ci\u003e\u003c/i\u003e\u0027.repeat(GOAL)}\u003c/div\u003e`;\n      const btn = play.querySelector(\u0027#mash\u0027);\n      const num = btn.querySelector(\u0027.mash-num\u0027);\n      const label = btn.querySelector(\u0027.mash-label\u0027);\n      const dotsWrap = play.querySelector(\u0027.dots\u0027);\n      const dots = dotsWrap.querySelectorAll(\u0027i\u0027);\n      const hit = () =\u003e {\n        if (count \u003e= GOAL) {\n          // 초과 입력 → 리셋\n          clearTimeout(waitId);\n          count = 0;\n          btn.classList.remove(\u0027wait\u0027);\n          dotsWrap.classList.remove(\u0027full\u0027);\n          dots.forEach(d =\u003e d.classList.remove(\u0027on\u0027));\n          num.textContent = GOAL;\n          label.textContent = \u0027남음\u0027;\n          toast(\u0027꽝!\u0027, \u0027너무 많이 눌렀다! 처음부터\u0027);\n          shake();\n          return;\n        }\n        count++;\n        if (hidden(count)) {\n          num.textContent = \u0027??\u0027;\n        } else {\n          dots[count - 1].classList.add(\u0027on\u0027);\n          num.textContent = GOAL - count;\n        }\n        if (count === GOAL) {\n          num.textContent = \u0027멈춰!\u0027;\n          label.textContent = \u0027손 떼고 기다려\u0027;\n          btn.classList.add(\u0027wait\u0027);\n          dotsWrap.classList.add(\u0027full\u0027);\n          waitId = setTimeout(done, 500);\n        }\n      };\n      btn.addEventListener(\u0027pointerdown\u0027, hit);\n      const off = onSpace(hit);\n      return () =\u003e { clearTimeout(waitId); off(); };\n    }\n  },\n  {\n    name: () =\u003e \u0027순서대로\u0027,\n    icon: \u0027route\u0027, color: \u0027c2\u0027,\n    menuTitle: \u0027숫자 순서대로 누르기\u0027,\n    title: () =\u003e `1부터 ${D.numCount}까지 순서대로`,\n    desc: () =\u003e \u0027흩어진 숫자를 작은 수부터 누르세요.\u0027,\n    rule: \u0027틀리면 1부터 다시\u0027,\n    start(done, play) {\n      play.innerHTML = \u0027\u003cdiv class=\"next\"\u003e다음 숫자 \u003cb id=\"next\"\u003e1\u003c/b\u003e\u003c/div\u003e\u003cdiv class=\"field\" id=\"field\"\u003e\u003c/div\u003e\u0027;\n      const field = play.querySelector(\u0027#field\u0027);\n      const nextEl = play.querySelector(\u0027#next\u0027);\n      const COUNT = D.numCount, SIZE = D.numSize, PAD = 8, GAP = SIZE + 16;\n      field.style.setProperty(\u0027--size\u0027, SIZE + \u0027px\u0027);\n      const w = field.clientWidth - SIZE - PAD * 2, h = field.clientHeight - SIZE - PAD * 2;\n      const placed = [];\n      let next = 1;\n      for (let n = 1; n \u003c= COUNT; n++) {\n        let x, y, tries = 0;\n        do {\n          x = PAD + Math.random() * w; y = PAD + Math.random() * h; tries++;\n        } while (tries \u003c 150 \u0026\u0026 placed.some(p =\u003e Math.hypot(p.x - x, p.y - y) \u003c GAP));\n        placed.push({ x, y });\n        const b = document.createElement(\u0027button\u0027);\n        b.className = \u0027num\u0027;\n        b.textContent = n;\n        b.style.left = x + \u0027px\u0027;\n        b.style.top = y + \u0027px\u0027;\n        b.style.animationDelay = (n * 30) + \u0027ms\u0027;\n        b.addEventListener(\u0027pointerdown\u0027, () =\u003e {\n          if (n === next) {\n            b.classList.add(\u0027hit\u0027);\n            if (++next \u003e COUNT) done();\n            else nextEl.textContent = next;\n          } else if (!b.classList.contains(\u0027hit\u0027)) {\n            // 순서 틀림 → 1부터 다시\n            next = 1;\n            nextEl.textContent = 1;\n            field.querySelectorAll(\u0027.num\u0027).forEach(el =\u003e {\n              el.classList.remove(\u0027hit\u0027);\n              el.style.animationDelay = \u00270ms\u0027;\n            });\n            toast(\u0027땡!\u0027, \u0027순서 틀림! 1부터 다시\u0027);\n            shake();\n          }\n        });\n        field.appendChild(b);\n      }\n    }\n  },\n  {\n    name: () =\u003e \u0027타이밍\u0027,\n    icon: \u0027aim\u0027, color: \u0027c3\u0027,\n    menuTitle: \u0027초록 구역에서 멈추기\u0027,\n    title: () =\u003e \u0027초록 구역에서 멈추기\u0027,\n    desc: () =\u003e \u0027막대가 초록 구역에 들어왔을 때 누르세요.\u0027,\n    rule: \u0027놓치면 0.5초 잠김\u0027,\n    start(done, play) {\n      play.innerHTML = `\n        \u003cdiv class=\"track\" id=\"track\"\u003e\u003cdiv class=\"zone\" id=\"zone\"\u003e\u003c/div\u003e\u003cdiv class=\"cursor\" id=\"cursor\"\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cbutton class=\"btn pink\" id=\"stop\"\u003e멈춰!\u003c/button\u003e`;\n      const track = play.querySelector(\u0027#track\u0027);\n      const zone = play.querySelector(\u0027#zone\u0027);\n      const cursor = play.querySelector(\u0027#cursor\u0027);\n      const stopBtn = play.querySelector(\u0027#stop\u0027);\n      const zoneW = D.zoneW;\n      // 초록 구역은 항상 중앙(50%)보다 오른쪽에만 생성 → 첫 도달 시간이 일정해 운 요소 최소화\n      const zoneX = 52 + Math.random() * (98 - zoneW - 52);\n      zone.style.left = zoneX + \u0027%\u0027;\n      zone.style.width = zoneW + \u0027%\u0027;\n      let pos = 0, dir = 1, last = performance.now(), id = 0, finished = false, frozenUntil = 0, unlockId = 0;\n      const speed = D.speed; // %/초\n      const tick = now =\u003e {\n        if (now \u003e= frozenUntil) pos += dir * speed * (now - last) / 1000;\n        last = now;\n        if (pos \u003e= 100) { pos = 100; dir = -1; }\n        if (pos \u003c= 0) { pos = 0; dir = 1; }\n        cursor.style.left = pos + \u0027%\u0027;\n        id = requestAnimationFrame(tick);\n      };\n      id = requestAnimationFrame(tick);\n      const press = () =\u003e {\n        if (finished || performance.now() \u003c frozenUntil) return;\n        if (pos \u003e= zoneX \u0026\u0026 pos \u003c= zoneX + zoneW) {\n          finished = true;\n          done();\n        } else {\n          // 놓침 → 0.5초간 정지 + 입력 불가\n          frozenUntil = performance.now() + 500;\n          track.classList.remove(\u0027frozen\u0027); void track.offsetWidth;\n          track.classList.add(\u0027frozen\u0027);\n          stopBtn.classList.add(\u0027locked\u0027);\n          stopBtn.innerHTML = ICON.lock + \u0027잠김\u0027;\n          toast(\u0027놓쳤다!\u0027, \u00270.5초 잠김\u0027);\n          clearTimeout(unlockId);\n          unlockId = setTimeout(() =\u003e {\n            track.classList.remove(\u0027frozen\u0027);\n            stopBtn.classList.remove(\u0027locked\u0027);\n            stopBtn.textContent = \u0027멈춰!\u0027;\n          }, 500);\n        }\n      };\n      stopBtn.addEventListener(\u0027pointerdown\u0027, press);\n      const off = onSpace(press);\n      return () =\u003e { cancelAnimationFrame(id); clearTimeout(unlockId); off(); };\n    }\n  }\n];\n\n// ---------- 게임 흐름 ----------\nfunction clearStage() {\n  if (cleanup) { cleanup(); cleanup = null; }\n  stage.innerHTML = \u0027\u0027;\n}\n\nfunction scene(html) {\n  const s = document.createElement(\u0027div\u0027);\n  s.className = \u0027scene\u0027;\n  s.innerHTML = html;\n  stage.appendChild(s);\n  return s;\n}\n\nfunction runMission() {\n  clearStage();\n  renderSteps();\n  const m = MISSIONS[missionIdx];\n  const s = scene(`\n    \u003ch1 class=\"cap\"\u003e${m.title()}\u003c/h1\u003e\n    \u003cp class=\"desc\"\u003e${m.desc()}\u003c/p\u003e\n    \u003cspan class=\"rule\"\u003e${ICON.reset}${m.rule}\u003c/span\u003e\n    \u003cdiv class=\"play\"\u003e\u003c/div\u003e`);\n  cleanup = m.start(() =\u003e {\n    missionIdx++;\n    if (missionIdx \u003e= MISSIONS.length) finish(true);\n    else runMission();\n  }, s.querySelector(\u0027.play\u0027)) || null;\n}\n\nfunction setTimeUI(left) {\n  timeEl.textContent = left.toFixed(2);\n  clockEl.classList.toggle(\u0027low\u0027, left \u003e 0 \u0026\u0026 left \u003c 5);\n  fillEl.style.width = (left / LIMIT * 100) + \u0027%\u0027;\n  fillEl.classList.toggle(\u0027mid\u0027, left \u003c= 10 \u0026\u0026 left \u003e 5);\n  fillEl.classList.toggle(\u0027low\u0027, left \u003c= 5);\n}\n\nfunction loop(now) {\n  const left = Math.max(0, LIMIT - (now - startAt) / 1000);\n  setTimeUI(left);\n  if (left \u003c= 0) { finish(false); return; }\n  rafId = requestAnimationFrame(loop);\n}\n\nfunction start(id = diffId) {\n  diffId = id;\n  D = DIFFS[id];\n  document.body.dataset.state = \u0027play\u0027;\n  missionIdx = 0;\n  running = true;\n  startAt = performance.now();\n  rafId = requestAnimationFrame(loop);\n  runMission();\n}\n\nfunction bindGo(delay) {\n  const btns = [...stage.querySelectorAll(\u0027[data-diff], #go, #menu\u0027)];\n  btns.forEach(b =\u003e b.addEventListener(\u0027click\u0027, () =\u003e {\n    if (b.id === \u0027menu\u0027) { clearStage(); document.body.dataset.state = \u0027\u0027; intro(); }\n    else start(b.dataset.diff || diffId);\n  }));\n  const first = btns[0];\n  if (delay) {\n    // 연타하던 스페이스바로 바로 재시작되는 것을 막음\n    btns.forEach(b =\u003e b.disabled = true);\n    setTimeout(() =\u003e { btns.forEach(b =\u003e b.disabled = false); first.focus(); }, delay);\n  } else {\n    first.focus();\n  }\n}\n\nfunction finish(win) {\n  running = false;\n  cancelAnimationFrame(rafId);\n  clearStage();\n  const used = (performance.now() - startAt) / 1000;\n  document.body.dataset.state = win ? \u0027win\u0027 : \u0027lose\u0027;\n  renderSteps();\n  if (win) {\n    const best = loadBest();\n    const isBest = best === null || used \u003c best;\n    if (isBest) saveBest(used.toFixed(2));\n    // 화면에 보이는 기록 기준으로 남은 시간을 계산해야 식과 결과가 맞음\n    const left = Math.max(0, LIMIT - Number(used.toFixed(2)));\n    const gain = Math.round(left * D.expRate + D.expBase);\n    const before = { game: loadLv(GAME.lvKey), all: loadLv() };\n    const change = giveExp(GAME.lvKey, gain);\n    scene(`\n      \u003cdiv class=\"result-cap\"\u003e\u003ch1 class=\"cap yellow\"\u003e미션 클리어!\u003c/h1\u003e\u003c/div\u003e\n      \u003cdiv class=\"big-time\"\u003e${used.toFixed(2)}\u003csmall\u003e초\u003c/small\u003e\u003c/div\u003e\n      \u003cspan class=\"diff-tag ${diffId}\"\u003e${D.label}\u003c/span\u003e\n      \u003cspan class=\"record ${isBest ? \u0027new\u0027 : \u0027\u0027}\"\u003e${ICON.trophy}${isBest ? \u0027최고 기록 달성!\u0027 : `최고 기록 ${best.toFixed(2)}초`}\u003c/span\u003e\n      \u003cdiv class=\"exp-gain cap\"\u003e+${fmt(gain)} EXP\u003c/div\u003e\n      \u003cp class=\"exp-calc\"\u003e남은 ${left.toFixed(2)}초 × ${D.expRate}${D.expBase ? ` + ${fmt(D.expBase)}` : \u0027\u0027}\u003c/p\u003e\n      ${lvHTML(before.game, \u0027lv-game\u0027, GAME.title)}${lvHTML(before.all, \u0027lv-all\u0027, \u0027전체\u0027, true)}\n      \u003cdiv class=\"spacer\"\u003e\u003c/div\u003e\n      ${resultButtons()}`);\n    playAllExp(change);\n  } else {\n    setTimeUI(0);\n    const failed = MISSIONS[missionIdx];\n    scene(`\n      \u003cdiv class=\"result-cap lose\"\u003e\u003ch1 class=\"cap\"\u003e시간 초과!\u003c/h1\u003e\u003c/div\u003e\n      \u003cp class=\"desc\"\u003e\u003cspan class=\"diff-tag ${diffId}\"\u003e${D.label}\u003c/span\u003e\u0026nbsp; \u003cb\u003e\u0027${failed.name()}\u0027\u003c/b\u003e 미션에서 멈췄어요.\u003c/p\u003e\n      \u003cdiv class=\"progress-row\"\u003e${MISSIONS.map((m, i) =\u003e\n        `\u003cspan class=\"${i \u003c missionIdx ? \u0027done\u0027 : i === missionIdx ? \u0027fail\u0027 : \u0027\u0027}\"\u003e${i \u003c missionIdx ? ICON.check : ICON[m.icon]}\u003c/span\u003e`).join(\u0027\u0027)}\u003c/div\u003e\n      ${lvBlock()}\n      \u003cdiv class=\"spacer\"\u003e\u003c/div\u003e\n      ${resultButtons()}`);\n  }\n  bindGo(600);\n}\n\nfunction resultButtons() {\n  return `\u003cdiv class=\"btn-row\"\u003e\n    \u003cbutton class=\"btn\" id=\"go\"\u003e${ICON.retry}다시 도전\u003c/button\u003e\n    \u003cbutton class=\"btn ghost\" id=\"menu\"\u003e난이도 선택\u003c/button\u003e\n  \u003c/div\u003e`;\n}\n\nfunction intro() {\n  missionIdx = 0;\n  renderSteps();\n  setTimeUI(LIMIT);\n  scene(`\n    \u003ch1 class=\"logo\" aria-label=\"15초 미션\"\u003e\u003cspan class=\"cap n\"\u003e15초\u003c/span\u003e\u003cspan class=\"cap w\"\u003e미션\u003c/span\u003e\u003c/h1\u003e\n    \u003cp class=\"tagline\"\u003e15초 안에 미니게임 3개를 모두 깨라!\u003c/p\u003e\n    \u003col class=\"cue\"\u003e${MISSIONS.map(m =\u003e `\n      \u003cli\u003e\u003cdiv\u003e\u003cstrong\u003e${m.menuTitle}\u003c/strong\u003e\u003cspan\u003e${m.rule}\u003c/span\u003e\u003c/div\u003e\u003c/li\u003e`).join(\u0027\u0027)}\n    \u003c/ol\u003e\n    \u003cdiv class=\"spacer\"\u003e\u003c/div\u003e\n    ${lvBlock()}\n    \u003cdiv class=\"diff-row\"\u003e${Object.entries(DIFFS).map(([id, d]) =\u003e {\n      const best = loadBest(id);\n      return `\u003cbutton class=\"diff ${id}\" data-diff=\"${id}\" aria-label=\"${d.label} 시작하기\"\u003e\n        ${d.label}\u003csmall\u003e${best ? `최고 ${best.toFixed(2)}초` : \u0027시작하기\u0027}\u003c/small\u003e\u003c/button\u003e`;\n    }).join(\u0027\u0027)}\u003c/div\u003e\n    \u003cp class=\"hint\"\u003e\u003ckbd\u003eSpace\u003c/kbd\u003e 로도 조작할 수 있어요\u003c/p\u003e`);\n  bindGo(0);\n}\n\nintro();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","games/mole.html":"\u003c!doctype html\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"\u003e\n\u003ctitle\u003e두더지 잡기\u003c/title\u003e\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Jua\u0026display=swap\" rel=\"stylesheet\"\u003e\n\u003cstyle\u003e\n  /* 잔디밭 — 하늘 + 줄무늬 잔디 + 흙구멍 + 동글동글 두더지 */\n  :root {\n    --sky: #BDE6FA;     --sky-2: #E4F6FF;\n    --grass: #7CC653;   --grass-2: #6DB847;  --grass-d: #4E8F33;\n    --dirt: #A8754C;    --dirt-d: #7A5233;   --pit: #3A2418;\n    --cream: #FFFBEF;   --cream-d: #F1E8CF;\n    --ink: #3D2B1F;     --ink-soft: #7A6655; --ink-faint: #B0A08E;\n    --sun: #FFD84D;     --red: #E5533D;      --pink: #F49A8B;\n    --font: \"Jua\", \"Apple SD Gothic Neo\", \"Malgun Gothic\", system-ui, sans-serif;\n    --ease-out: cubic-bezier(.16, 1, .3, 1);\n    --pop: cubic-bezier(.34, 1.56, .64, 1);\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; }\n  body {\n    min-height: 100vh; min-height: 100dvh;\n    display: grid; place-items: center;\n    padding: 24px 16px;\n    font-family: var(--font); color: var(--ink);\n    background:\n      radial-gradient(circle at 85% 8%, var(--sun) 0 34px, rgba(255,216,77,.35) 35px 52px, transparent 53px),\n      linear-gradient(180deg, var(--sky-2), var(--sky) 55%, #CDEFB5 55.1%, #B5E28F);\n    user-select: none; -webkit-user-select: none;\n    -webkit-tap-highlight-color: transparent; touch-action: manipulation;\n  }\n\n  /* ---------- 카드 ---------- */\n  .page {\n    position: relative; width: 100%; max-width: 440px;\n    padding: 16px 18px 22px;\n    background: var(--cream);\n    border: 3px solid var(--ink); border-radius: 28px;\n    box-shadow: 0 6px 0 var(--ink), 0 22px 40px rgba(40,70,30,.25);\n  }\n  .pg-head { display: flex; align-items: center; justify-content: space-between; height: 32px; }\n  .home {\n    font: 18px/1 var(--font); color: var(--ink-soft); text-decoration: none;\n    padding: 6px 10px; margin-left: -6px; border-radius: 99px;\n  }\n  .home:hover { color: var(--ink); background: var(--cream-d); }\n  .home:focus-visible { outline: 3px solid var(--grass-d); outline-offset: 2px; }\n  .mode {\n    font: 15px/1 var(--font); padding: 6px 12px 5px; border-radius: 99px;\n    background: var(--grass); color: #fff; border: 2.5px solid var(--ink);\n  }\n\n  #stage { min-height: 580px; display: flex; flex-direction: column; }\n  .scene { flex: 1; display: flex; flex-direction: column; animation: rise .4s var(--ease-out) both; }\n  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }\n\n  h1.title { margin: 12px 0 0; font: 52px/1.05 var(--font); letter-spacing: -.01em; }\n  h1.title em { font-style: normal; color: var(--grass-d); }\n  .sub { margin: 6px 0 0; font-size: 18px; color: var(--ink-soft); }\n\n  .rules { list-style: none; margin: 14px 0 0; padding: 0; font-size: 18px; line-height: 1.45; display: grid; gap: 8px; }\n  .rules li { position: relative; padding-left: 26px; }\n  .rules li::before {\n    content: \"\"; position: absolute; left: 4px; top: .42em; width: 12px; height: 9px;\n    border-radius: 50%; background: var(--dirt); box-shadow: inset 0 3px 0 var(--pit);\n  }\n  .rules b { color: var(--grass-d); }\n  .rules .red { color: var(--red); }\n  .rules small { font-size: 15px; color: var(--ink-soft); }\n  @media (pointer: coarse) { .rules .keys-only { display: none; } }\n\n  /* ---------- 버튼 ---------- */\n  .btn {\n    display: inline-flex; align-items: center; justify-content: center; gap: 8px;\n    font: 23px/1 var(--font); color: #fff; padding: 15px 30px 13px; cursor: pointer;\n    background: var(--grass); border: 3px solid var(--ink); border-radius: 99px;\n    box-shadow: 0 5px 0 var(--ink);\n    transition: transform .08s, box-shadow .08s, filter .15s;\n  }\n  .btn:hover { filter: brightness(1.07); }\n  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }\n  .btn:focus-visible, .mode-card:focus-visible { outline: 3px solid var(--sun); outline-offset: 4px; }\n  .btn.ghost { background: var(--cream); color: var(--ink); }\n  .btn:disabled { filter: none; cursor: default; }\n  .btn-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }\n  .spacer { flex: 1; min-height: 14px; }\n  .best-line { margin: 12px 0 0; text-align: center; font-size: 16px; color: var(--ink-soft); }\n  .back { align-self: flex-start; margin: 8px 0 0 -8px; font: 17px/1 var(--font); color: var(--ink-soft); background: none; border: 0; padding: 6px 10px; cursor: pointer; border-radius: 99px; }\n  .back:hover { background: var(--cream-d); color: var(--ink); }\n\n  /* ---------- 두더지 그림 ---------- */\n  .mole-svg { display: block; width: 100%; height: auto; overflow: visible; }\n  .mole-svg .bonk, .mole-svg .crown { display: none; }\n  /* 황금 두더지 = 털색만 바꾸고 왕관 */\n  .hole.special .fur { fill: #E3A92F; }\n  .hole.special .shine { stroke: #F8D981; }\n  .hole.special .mole-svg .crown { display: inline; }\n  .hole.special.up .mole { filter: drop-shadow(0 0 6px rgba(255,216,77,.95)); }\n  /* 폭탄(함정) 심지 불꽃 */\n  .mole-svg .spark { animation: flicker .24s steps(2) infinite; transform-origin: 84px 11px; }\n  @keyframes flicker { 50% { transform: scale(.65); } }\n  .hole.bonk .mole-svg .face, .peek.bonk .mole-svg .face { display: none; }\n  .hole.bonk .mole-svg .bonk { display: inline; }\n\n  /* 소개 화면: 구멍에서 빼꼼 */\n  .peek { position: relative; width: 150px; height: 130px; margin: 14px auto 0; }\n  .peek .mound { position: absolute; left: 0; right: 0; bottom: 0; height: 52px; border-radius: 50%; background: var(--grass-2); }\n  .peek .pit { position: absolute; left: 22px; right: 22px; bottom: 12px; height: 34px; border-radius: 50%; background: var(--pit); box-shadow: 0 0 0 6px var(--dirt); }\n  .peek .clip { position: absolute; left: 32px; right: 32px; bottom: 29px; height: 130px; overflow: hidden; }\n  .peek .mole { position: absolute; left: 0; right: 0; bottom: 0; animation: peek 2.6s var(--ease-out) infinite; }\n  @keyframes peek { 0%, 12% { transform: translateY(100%); } 30%, 72% { transform: translateY(6%); } 90%, 100% { transform: translateY(100%); } }\n\n  /* ---------- 모드 선택 ---------- */\n  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0 0; }\n  .mode-card {\n    display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;\n    padding: 14px 16px 12px; cursor: pointer; font-family: var(--font); color: var(--ink);\n    background: #fff; border: 3px solid var(--ink); border-radius: 20px;\n    box-shadow: 0 5px 0 var(--ink);\n    transition: transform .08s, box-shadow .08s, background .15s;\n  }\n  .mode-card.wide { grid-column: 1 / -1; }\n  .mode-card:hover { background: #F2FBE9; }\n  .mode-card:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }\n  .mode-card b { font: 30px/1 var(--font); color: var(--grass-d); font-weight: 400; }\n  .mode-card span { font-size: 15px; color: var(--ink-soft); }\n  .mode-card small { font-size: 14px; color: var(--red); margin-top: 2px; }\n  .mode-card.hard b { color: var(--red); }\n\n  /* ---------- 플레이 HUD ---------- */\n  .hud { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 2px 0; }\n  .clock, .pts { font-size: 18px; color: var(--ink-soft); }\n  .clock b, .pts b { display: inline-block; font: 48px/1 var(--font); font-variant-numeric: tabular-nums; }\n  .clock b { color: var(--ink); min-width: 2.7ch; }\n  .clock.low b { color: var(--red); }\n  .pts b { color: var(--grass-d); }\n  .pts .bump { animation: bump .35s var(--pop); }\n  @keyframes bump { 40% { transform: scale(1.35) rotate(-5deg); } }\n  .tbar { height: 12px; margin: 6px 0 0; border: 2.5px solid var(--ink); border-radius: 99px; overflow: hidden; background: #fff; }\n  .tbar i { display: block; height: 100%; width: 100%; background: var(--grass); border-radius: 99px; }\n  .tbar.low i { background: var(--red); }\n\n  /* ---------- 잔디밭 ---------- */\n  .field {\n    position: relative; margin: 14px 0 0; padding: 26px 12px 10px;\n    border: 3px solid var(--ink); border-radius: 26px;\n    background: repeating-linear-gradient(90deg, var(--grass) 0 28px, var(--grass-2) 28px 56px);\n    box-shadow: inset 0 -8px 0 rgba(0,0,0,.08), 0 5px 0 var(--ink);\n    cursor: pointer; touch-action: manipulation;\n  }\n  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 10px; transition: filter .15s; }\n  .hole { position: relative; aspect-ratio: 1; padding: 0; border: 0; background: none; cursor: pointer; font: inherit; color: inherit; }\n  .hole:focus-visible { outline: none; }\n  .hole .mound { position: absolute; left: 2%; right: 2%; bottom: 6%; height: 40%; border-radius: 50%; background: rgba(60,110,35,.35); }\n  .hole .pit {\n    position: absolute; left: 10%; right: 10%; bottom: 14%; height: 30%; border-radius: 50%;\n    background: radial-gradient(ellipse at 50% 35%, #1F120B, var(--pit) 70%);\n    box-shadow: 0 0 0 5px var(--dirt), 0 4px 0 5px var(--dirt-d);\n  }\n  /* 구멍 가운데 선 위로만 두더지가 보이도록 잘라냄 */\n  .hole .clip { position: absolute; left: 15%; right: 15%; bottom: 29%; top: -26%; overflow: hidden; pointer-events: none; }\n  .hole .mole { position: absolute; left: 0; right: 0; bottom: 0; transform: translateY(102%); transition: transform .14s ease-in; }\n  .hole.up .mole { transform: translateY(0); transition: transform .16s var(--pop); }\n  .hole.bonk .mole { animation: squash .2s ease-out; }\n  @keyframes squash { 40% { transform: translateY(8%) scale(1.12, .86); } }\n  .hole kbd {\n    position: absolute; right: 2%; bottom: 0; z-index: 2;\n    font: 12px/1 var(--font); color: rgba(255,255,255,.85); background: rgba(40,70,25,.45);\n    padding: 3px 6px 2px; border-radius: 6px;\n  }\n  @media (pointer: coarse) { .hole kbd { display: none; } }\n\n  /* 잡았을 때 튀어 오르는 글자 */\n  .pop {\n    position: absolute; left: 50%; top: -18%; z-index: 3; pointer-events: none;\n    font: 30px/1 var(--font); color: #fff; white-space: nowrap;\n    -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill;\n    text-shadow: 0 3px 0 var(--ink);\n    animation: pop .6s var(--ease-out) forwards;\n  }\n  .pop.hit { color: var(--sun); }\n  .pop.gold { color: var(--sun); font-size: 36px; }\n  .pop.minus { color: var(--red); font-size: 36px; }\n  /* 폭탄을 눌렀을 때 펑 */\n  .boom {\n    position: absolute; left: 50%; top: 35%; z-index: 3; width: 130%; aspect-ratio: 1; pointer-events: none;\n    border-radius: 50%; transform: translate(-50%, -50%);\n    background: radial-gradient(circle, #FFF3B0 0 18%, #FFB13D 38%, rgba(229,83,61,.85) 52%, rgba(229,83,61,0) 70%);\n    animation: boom .45s ease-out forwards;\n  }\n  @keyframes boom { from { transform: translate(-50%, -50%) scale(.3); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.25); opacity: 0; } }\n  @keyframes pop {\n    0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); }\n    25% { opacity: 1; transform: translate(-50%, -6px) scale(1.1); }\n    100% { opacity: 0; transform: translate(-50%, -30px) scale(1); }\n  }\n\n  /* 헛방 = 잔디밭이 흔들리고 -5 */\n  .field.miss { animation: shake .3s; }\n  .field \u003e .pop { top: 40%; }\n  @keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }\n  .field.over { cursor: default; }\n\n  .msg { min-height: 40px; margin: 12px 0 0; text-align: center; font: 26px/1.2 var(--font); color: var(--ink-soft); }\n  .msg .end { color: var(--red); font-size: 34px; display: inline-block; animation: pop-in .3s var(--pop); }\n  @keyframes pop-in { from { transform: scale(1.6); opacity: 0; } }\n\n  /* ---------- 결과 ---------- */\n  .final { text-align: center; margin: 14px 0 0; }\n  .final .lbl { font-size: 18px; color: var(--ink-soft); }\n  .final .score { display: inline-block; margin-top: 4px; font: 92px/1 var(--font); color: var(--grass-d); font-variant-numeric: tabular-nums; animation: pop-in .4s var(--pop); }\n  .final .score small { font-size: 36px; color: var(--ink); }\n  .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 8px; margin: 10px 0 0; }\n  .stats span { font-size: 15px; color: var(--ink-soft); padding: 6px 12px 5px; border-radius: 99px; background: var(--cream-d); }\n  .stats b { color: var(--ink); font-size: 18px; font-weight: 400; }\n  .new-best {\n    display: inline-block; margin-top: 10px; padding: 6px 14px 5px;\n    font: 18px/1 var(--font); color: var(--ink); background: var(--sun);\n    border: 2.5px solid var(--ink); border-radius: 99px; transform: rotate(-4deg);\n    animation: pop-in .45s var(--pop) .3s both;\n  }\n  .exp-gain { margin: 16px 0 0; text-align: center; font: 36px/1 var(--font); color: var(--ink); animation: pop-in .45s var(--pop) .45s both; }\n  .exp-gain mark { background: linear-gradient(transparent 55%, var(--sky) 55% 92%, transparent 92%); color: inherit; padding: 0 6px; }\n  .exp-calc { margin: 4px 0 8px; text-align: center; font-size: 15px; color: var(--ink-soft); }\n\n  /* ---------- 레벨 ---------- */\n  .lv { display: flex; align-items: center; gap: 10px; margin: 10px 0 0; }\n  .lv-badge {\n    flex: none; min-width: 64px; text-align: center;\n    font: 19px/1 var(--font); padding: 6px 8px 5px;\n    border: 2.5px solid var(--ink); border-radius: 99px; background: #fff;\n  }\n  .lv-badge.up { animation: pop-in .5s var(--pop); background: var(--sun); }\n  .lv-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }\n  .lv-bar { height: 14px; border: 2.5px solid var(--ink); border-radius: 99px; overflow: hidden; background: #fff; }\n  .lv-fill { display: block; height: 100%; background: var(--grass); border-radius: 99px; transition: width .7s var(--ease-out); }\n  .lv-num { font-size: 14px; line-height: 1; color: var(--ink-soft); font-variant-numeric: tabular-nums; }\n  .lv.small { margin-top: 6px; }\n  .lv.small .lv-badge { font-size: 15px; padding: 4px 8px 3px; border-style: dashed; }\n  .lv.small .lv-bar { height: 10px; border-width: 2px; }\n  .lv.small .lv-fill { background: var(--dirt); }\n\n  .toast {\n    position: fixed; left: 50%; top: 40%; z-index: 9; pointer-events: none;\n    display: flex; flex-direction: column; align-items: center;\n    padding: 14px 26px 12px; background: var(--sun);\n    border: 4px solid var(--ink); border-radius: 24px; color: var(--ink);\n    font: 44px/1 var(--font); white-space: nowrap;\n    box-shadow: 0 6px 0 var(--ink), 0 16px 30px rgba(40,70,30,.3);\n    animation: toast 1.5s var(--ease-out) both;\n  }\n  .toast small { font-size: 17px; margin-top: 6px; }\n  @keyframes toast {\n    0% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }\n    15%, 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }\n    100% { opacity: 0; transform: translate(-50%, -50%) scale(.95); }\n  }\n\n  @media (max-width: 400px) {\n    .page { padding: 14px 12px 18px; }\n    h1.title { font-size: 44px; }\n    .field { padding: 22px 8px 8px; }\n    .grid { gap: 14px 6px; }\n  }\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n  }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cmain class=\"page\"\u003e\n  \u003cheader class=\"pg-head\"\u003e\n    \u003ca class=\"home\" href=\"../index.html\"\u003e← 홈\u003c/a\u003e\n    \u003cspan class=\"mode\" id=\"modeTag\"\u003e모드 선택\u003c/span\u003e\n  \u003c/header\u003e\n  \u003csection id=\"stage\" aria-live=\"polite\"\u003e\u003c/section\u003e\n\u003c/main\u003e\n\n\u003cscript\u003e\n// 메인 화면과 모든 게임이 함께 쓰는 코드: 게임 목록 + 레벨·경험치\n// 게임을 깨면 같은 경험치가 \u0027전체 레벨\u0027과 \u0027그 게임 레벨\u0027에 함께 쌓임\n\n// ---------- 게임 목록 ----------\n// href는 메인(index.html) 기준 경로 / lvKey: 게임별 레벨 저장 키\n// bests: { 표시 이름: 최고 기록 저장 키 } / bestUnit: 기록 단위\nconst GAMES = [\n  {\n    id: \u0027mission15\u0027,\n    title: \u002715초 미션\u0027,\n    desc: \u002715초 안에 미니게임 3개를 모두 깨라!\u0027,\n    href: \u0027games/mission15.html\u0027,\n    lvKey: \u0027lv15\u0027,\n    bests: { Easy: \u0027best15\u0027, Normal: \u0027best15_normal\u0027, Hard: \u0027best15_hard\u0027 },\n    bestUnit: \u0027초\u0027,\n  },\n  {\n    id: \u0027rps\u0027,\n    title: \u0027가위바위보\u0027,\n    desc: \u002710판 운 승부, 또는 15초 동안 이기는 패 골라내기!\u0027,\n    href: \u0027games/rps.html\u0027,\n    lvKey: \u0027lv_rps\u0027,\n    // 15초 모드는 점수 체계가 바뀌어(정답 +1 / 오답 -1) v2 키로 새로 시작\n    bests: { \u0027일반\u0027: \u0027rps_best\u0027, Easy: \u0027rps2_best_easy\u0027, Normal: \u0027rps2_best_normal\u0027, Hard: \u0027rps2_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027mole\u0027,\n    title: \u0027두더지 잡기\u0027,\n    desc: \u002715초 동안 두더지를 잡아라! 황금 두더지는 +30, 폭탄은 -50.\u0027,\n    href: \u0027games/mole.html\u0027,\n    lvKey: \u0027lv_mole\u0027,\n    // 점수 체계가 바뀌어(일반 +10 / 황금 +30 / 폭탄 -50 / 도망 -10 / 헛방 -1) v4 키로 새로 시작\n    bests: { Easy: \u0027mole4_best_easy\u0027, Normal: \u0027mole4_best_normal\u0027, Hard: \u0027mole4_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027brick\u0027,\n    title: \u0027벽돌깨기\u0027,\n    desc: \u002760초 안에 벽돌 24개를 모두 깨라! 4개마다 스피드 업.\u0027,\n    href: \u0027games/brick.html\u0027,\n    lvKey: \u0027lv_brick\u0027,\n    bests: { Easy: \u0027brick_best_easy\u0027, Normal: \u0027brick_best_normal\u0027, Hard: \u0027brick_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n  {\n    id: \u0027runner\u0027,\n    title: \u0027시나모롤 런\u0027,\n    desc: \u0027귀를 팔랑이며 하늘을 날아라! 낮 · 밤 · 폭풍우 3가지 하늘.\u0027,\n    href: \u0027games/runner.html\u0027,\n    lvKey: \u0027lv_runner\u0027,\n    bests: { Easy: \u0027runner_best_easy\u0027, Normal: \u0027runner_best_normal\u0027, Hard: \u0027runner_best_hard\u0027 },\n    bestUnit: \u0027점\u0027,\n  },\n];\n\n// ---------- 페이지 이동 ----------\n// 한 파일로 포장된 버전(dist/Claude_Game.html)에서는 바깥 틀(__pack)이 페이지를 바꿔 줌\nconst PACK = (() =\u003e { try { return (window.parent !== window \u0026\u0026 window.parent.__pack) || null; } catch { return null; } })();\nfunction goTo(href) { if (PACK) PACK.go(href); else location.href = href; }\nif (PACK) document.addEventListener(\u0027click\u0027, e =\u003e {\n  const a = e.target.closest(\u0027a[href]\u0027);\n  if (!a || /^(https?:|#|mailto:)/.test(a.getAttribute(\u0027href\u0027))) return;\n  e.preventDefault();\n  PACK.go(a.getAttribute(\u0027href\u0027));\n});\n\n// 예전 점수 체계(정답 +3)의 가위바위보 15초 모드 기록 정리\ntry { [\u0027rps_best_easy\u0027, \u0027rps_best_normal\u0027, \u0027rps_best_hard\u0027].forEach(k =\u003e localStorage.removeItem(k)); } catch {}\n// 예전 점수 체계의 두더지 잡기 · 난이도가 없던 벽돌깨기·시나모롤 런 기록 정리\ntry { [\u0027mole_best_easy\u0027, \u0027mole2_best_easy\u0027, \u0027mole2_best_normal\u0027, \u0027mole2_best_hard\u0027, \u0027mole3_best_easy\u0027, \u0027mole3_best_normal\u0027, \u0027mole3_best_hard\u0027, \u0027brick_best\u0027, \u0027runner_best\u0027].forEach(k =\u003e localStorage.removeItem(k)); } catch {}\n\n// ---------- 레벨 ----------\n// 다음 레벨까지 필요 경험치 = Lv² × 1000 (exp는 현재 레벨 안에서 쌓인 양)\nconst LV_ALL_KEY = \u0027lv_all\u0027;\nconst needExp = lv =\u003e lv * lv * 1000;\nconst fmt = n =\u003e n.toLocaleString(\u0027ko-KR\u0027);\n\nfunction loadLv(key = LV_ALL_KEY) {\n  try {\n    const s = JSON.parse(localStorage.getItem(key));\n    if (s \u0026\u0026 s.lv \u003e= 1 \u0026\u0026 s.exp \u003e= 0) return { lv: s.lv, exp: s.exp };\n  } catch {}\n  return { lv: 1, exp: 0 };\n}\nfunction saveLv(key, s) { try { localStorage.setItem(key, JSON.stringify(s)); } catch {} }\n\nfunction gainExp(key, gain) {\n  const from = loadLv(key);\n  const to = { ...from, exp: from.exp + gain };\n  while (to.exp \u003e= needExp(to.lv)) { to.exp -= needExp(to.lv); to.lv++; }\n  saveLv(key, to);\n  return { from, to };\n}\n\n// 게임 클리어 시 호출 → { all: 전체 레벨 변화, game: 게임 레벨 변화 }\nfunction giveExp(gameLvKey, gain) {\n  gain = Math.max(0, gain); // 음수 EXP로 레벨이 깎이지 않도록\n  return { all: gainExp(LV_ALL_KEY, gain), game: gainExp(gameLvKey, gain) };\n}\n\nfunction loadRecord(key) {\n  try { return parseFloat(localStorage.getItem(key)) || null; } catch { return null; }\n}\n\n\u003c/script\u003e\n\u003cscript\u003e\nconst GAME = GAMES.find(g =\u003e g.id === \u0027mole\u0027);\nconst stage = document.getElementById(\u0027stage\u0027);\nconst sleep = ms =\u003e new Promise(r =\u003e setTimeout(r, ms));\n\n// ---------- 그림 ----------\n// 두더지: 평소 얼굴 / 맞은 얼굴, 황금 두더지는 CSS로 털색(.fur)을 바꾸고 왕관(.crown)을 보임\nconst MOLE = `\u003csvg class=\"mole-svg\" viewBox=\"0 0 100 110\" aria-hidden=\"true\"\u003e\n  \u003cpath class=\"fur\" d=\"M13 112 V60 Q13 17 50 17 Q87 17 87 60 V112 Z\" fill=\"#8A5A3B\" stroke=\"#3D2B1F\" stroke-width=\"3.5\"/\u003e\n  \u003cpath class=\"shine\" d=\"M30 30 Q40 23 52 23\" fill=\"none\" stroke=\"#A9744F\" stroke-width=\"5\" stroke-linecap=\"round\"/\u003e\n  \u003cpath class=\"crown\" d=\"M35 20 L37 5 L44 13 L50 2 L56 13 L63 5 L65 20 Z\" fill=\"#FFD84D\" stroke=\"#3D2B1F\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/\u003e\n  \u003cellipse cx=\"50\" cy=\"68\" rx=\"25\" ry=\"20\" fill=\"#F3CFA6\"/\u003e\n  \u003cellipse cx=\"28\" cy=\"63\" rx=\"5.5\" ry=\"3.4\" fill=\"#F49A8B\" opacity=\".85\"/\u003e\n  \u003cellipse cx=\"72\" cy=\"63\" rx=\"5.5\" ry=\"3.4\" fill=\"#F49A8B\" opacity=\".85\"/\u003e\n  \u003cg class=\"face\"\u003e\n    \u003ccircle cx=\"37\" cy=\"49\" r=\"4.6\" fill=\"#3D2B1F\"/\u003e\u003ccircle cx=\"63\" cy=\"49\" r=\"4.6\" fill=\"#3D2B1F\"/\u003e\n    \u003ccircle cx=\"38.6\" cy=\"47.4\" r=\"1.5\" fill=\"#fff\"/\u003e\u003ccircle cx=\"64.6\" cy=\"47.4\" r=\"1.5\" fill=\"#fff\"/\u003e\n    \u003cpath d=\"M44 69 Q50 74 56 69\" fill=\"none\" stroke=\"#3D2B1F\" stroke-width=\"2.6\" stroke-linecap=\"round\"/\u003e\n  \u003c/g\u003e\n  \u003cg class=\"bonk\" fill=\"none\" stroke=\"#3D2B1F\" stroke-width=\"3\" stroke-linecap=\"round\"\u003e\n    \u003cpath d=\"M32 45 l9 8 m0 -8 l-9 8 M58 45 l9 8 m0 -8 l-9 8\"/\u003e\n    \u003cpath d=\"M44 72 Q50 66 56 72\"/\u003e\n    \u003cpath d=\"M50 4 l2.4 5 5.4 .6 -4 3.7 1.1 5.3 -4.9 -2.7 -4.9 2.7 1.1 -5.3 -4 -3.7 5.4 -.6 Z\" fill=\"#FFD84D\" stroke-width=\"2\"/\u003e\n    \u003cpath d=\"M80 12 l1.6 3.3 3.6 .4 -2.7 2.5 .7 3.5 -3.2 -1.8 -3.2 1.8 .7 -3.5 -2.7 -2.5 3.6 -.4 Z\" fill=\"#FFD84D\" stroke-width=\"1.8\"/\u003e\n  \u003c/g\u003e\n  \u003cellipse cx=\"50\" cy=\"60\" rx=\"7.5\" ry=\"5.5\" fill=\"#F07C8F\" stroke=\"#3D2B1F\" stroke-width=\"2.6\"/\u003e\n  \u003cellipse cx=\"29\" cy=\"95\" rx=\"10\" ry=\"6.5\" fill=\"#F3CFA6\" stroke=\"#3D2B1F\" stroke-width=\"2.6\"/\u003e\n  \u003cellipse cx=\"71\" cy=\"95\" rx=\"10\" ry=\"6.5\" fill=\"#F3CFA6\" stroke=\"#3D2B1F\" stroke-width=\"2.6\"/\u003e\n\u003c/svg\u003e`;\n// 함정: 화난 폭탄\nconst BOMB = `\u003csvg class=\"mole-svg\" viewBox=\"0 0 100 110\" aria-hidden=\"true\"\u003e\n  \u003cpath d=\"M60 32 Q68 16 82 12\" fill=\"none\" stroke=\"#7A5233\" stroke-width=\"5\" stroke-linecap=\"round\"/\u003e\n  \u003cg class=\"spark\"\u003e\u003ccircle cx=\"84\" cy=\"11\" r=\"7.5\" fill=\"#FFD84D\"/\u003e\u003ccircle cx=\"84\" cy=\"11\" r=\"3.5\" fill=\"#E5533D\"/\u003e\u003c/g\u003e\n  \u003crect x=\"49\" y=\"27\" width=\"20\" height=\"13\" rx=\"3\" fill=\"#55556A\" stroke=\"#3D2B1F\" stroke-width=\"3\" transform=\"rotate(28 59 33)\"/\u003e\n  \u003ccircle cx=\"50\" cy=\"72\" r=\"36\" fill=\"#2F2F3B\" stroke=\"#3D2B1F\" stroke-width=\"3.5\"/\u003e\n  \u003cellipse cx=\"35\" cy=\"55\" rx=\"10\" ry=\"6\" fill=\"#fff\" opacity=\".22\" transform=\"rotate(-35 35 55)\"/\u003e\n  \u003cpath d=\"M31 62 l13 6 M69 62 l-13 6\" stroke=\"#fff\" stroke-width=\"3.6\" stroke-linecap=\"round\"/\u003e\n  \u003ccircle cx=\"40\" cy=\"74\" r=\"4.2\" fill=\"#fff\"/\u003e\u003ccircle cx=\"60\" cy=\"74\" r=\"4.2\" fill=\"#fff\"/\u003e\n  \u003cpath d=\"M41 90 Q50 84 59 90\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.2\" stroke-linecap=\"round\"/\u003e\n\u003c/svg\u003e`;\n\n// ---------- 레벨 (계산·저장은 shared.js) ----------\nfunction lvHTML(s, id, label, small = false) {\n  const need = needExp(s.lv);\n  return `\u003cdiv class=\"lv ${small ? \u0027small\u0027 : \u0027\u0027}\" id=\"${id}\" data-label=\"${label}\"\u003e\n    \u003cspan class=\"lv-badge\"\u003eLv.${s.lv}\u003c/span\u003e\n    \u003cdiv class=\"lv-main\"\u003e\n      \u003cdiv class=\"lv-bar\"\u003e\u003ci class=\"lv-fill\" style=\"width:${s.exp / need * 100}%\"\u003e\u003c/i\u003e\u003c/div\u003e\n      \u003cspan class=\"lv-num\"\u003e${label} · ${fmt(s.exp)} / ${fmt(need)} EXP\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e`;\n}\nfunction lvBlock() {\n  return lvHTML(loadLv(GAME.lvKey), \u0027lv-game\u0027, GAME.title) + lvHTML(loadLv(), \u0027lv-all\u0027, \u0027전체\u0027, true);\n}\n\n// 경험치 바를 이전 상태 → 새 상태로 채움 (레벨업 시 한 칸씩 꽉 채우고 넘어감)\nasync function playExp(id, from, to) {\n  const el = stage.querySelector(\u0027#\u0027 + id);\n  if (!el) return;\n  const badge = el.querySelector(\u0027.lv-badge\u0027), fill = el.querySelector(\u0027.lv-fill\u0027), num = el.querySelector(\u0027.lv-num\u0027);\n  const label = el.dataset.label;\n  await sleep(800);\n  for (let lv = from.lv; lv \u003c to.lv; lv++) {\n    if (!el.isConnected) return;\n    fill.style.width = \u0027100%\u0027;\n    num.textContent = `${label} · ${fmt(needExp(lv))} / ${fmt(needExp(lv))} EXP`;\n    await sleep(750);\n    if (!el.isConnected) return;\n    badge.textContent = `Lv.${lv + 1}`;\n    badge.classList.remove(\u0027up\u0027); void badge.offsetWidth; badge.classList.add(\u0027up\u0027);\n    fill.style.transition = \u0027none\u0027; fill.style.width = \u00270%\u0027; void fill.offsetWidth; fill.style.transition = \u0027\u0027;\n  }\n  if (!el.isConnected) return;\n  fill.style.width = (to.exp / needExp(to.lv) * 100) + \u0027%\u0027;\n  num.textContent = `${label} · ${fmt(to.exp)} / ${fmt(needExp(to.lv))} EXP`;\n}\n\nasync function playAllExp({ all, game }) {\n  await Promise.all([playExp(\u0027lv-game\u0027, game.from, game.to), playExp(\u0027lv-all\u0027, all.from, all.to)]);\n  if (!stage.querySelector(\u0027#lv-game\u0027)) return;\n  // 둘 다 오르면 전체 레벨 업을 우선 보여줌\n  if (all.to.lv \u003e all.from.lv) toast(\u0027레벨 업!\u0027, `전체 Lv.${all.to.lv} 달성`);\n  else if (game.to.lv \u003e game.from.lv) toast(\u0027레벨 업!\u0027, `${GAME.title} Lv.${game.to.lv} 달성`);\n}\n\nfunction toast(big, small) {\n  document.querySelectorAll(\u0027.toast\u0027).forEach(t =\u003e t.remove());\n  const t = document.createElement(\u0027div\u0027);\n  t.className = \u0027toast\u0027;\n  t.setAttribute(\u0027role\u0027, \u0027status\u0027);\n  t.innerHTML = `${big}\u003csmall\u003e${small}\u003c/small\u003e`;\n  document.body.appendChild(t);\n  t.addEventListener(\u0027animationend\u0027, () =\u003e t.remove());\n}\n\n// ---------- 모드 ----------\n// max: 동시에 나와 있는 두더지 최대 수 / special: 10마리 중 황금 두더지 수 / traps: 한 판의 폭탄 수\n// regen: 스폰 쿨타임(최대 수보다 적으면 이 간격마다 1마리) / EXP = 득점 × expRate\nconst LIMIT = 15;\nconst STAY_MS = { normal: 2000, special: 1000, trap: 2000 }; // 디스폰: 나온 뒤 쏙 들어가기까지\nconst BONK_MS = 200;    // 맞은 두더지가 들어가기까지 (이 동안은 눌러도 무시)\nconst PTS = { normal: 10, special: 30, trap: -50 };\nconst ESCAPE_PTS = -10; // 두더지(일반·황금)가 도망감\nconst WHIFF_PTS = -1;   // 빈 구멍·엉뚱한 곳\n// 키보드는 숫자 패드 배열: 위 줄 789 / 가운데 456 / 아래 123\nconst KEYS = [\u00277\u0027, \u00278\u0027, \u00279\u0027, \u00274\u0027, \u00275\u0027, \u00276\u0027, \u00271\u0027, \u00272\u0027, \u00273\u0027];\nconst MODES = {\n  easy:   { label: \u0027Easy\u0027,   best: GAME.bests.Easy,   max: 2, special: 2, traps: 3,  regen: 1200, expRate: 3 },\n  normal: { label: \u0027Normal\u0027, best: GAME.bests.Normal, max: 3, special: 3, traps: 7,  regen: 900,  expRate: 3 },\n  hard:   { label: \u0027Hard\u0027,   best: GAME.bests.Hard,   max: 4, special: 4, traps: 15, regen: 600,  expRate: 3 },\n};\nconst blurb = m =\u003e `최대 ${m.max}마리 · 황금 ${m.special}/10 · 폭탄 ${m.traps}개`;\nlet M = MODES.easy;\nconst modeTag = document.getElementById(\u0027modeTag\u0027);\n\n// ---------- 화면 흐름 ----------\nlet keyOff = null;\n\nfunction scene(html) {\n  if (keyOff) { keyOff(); keyOff = null; }\n  stage.innerHTML = `\u003cdiv class=\"scene\"\u003e${html}\u003c/div\u003e`;\n  return stage.firstChild;\n}\n\nfunction onKeys(fn) {\n  const h = e =\u003e { if (!e.repeat) fn(e); };\n  window.addEventListener(\u0027keydown\u0027, h);\n  keyOff = () =\u003e window.removeEventListener(\u0027keydown\u0027, h);\n}\n\nconst peekHTML = () =\u003e `\u003cdiv class=\"peek\" aria-hidden=\"true\"\u003e\u003cspan class=\"mound\"\u003e\u003c/span\u003e\u003cspan class=\"pit\"\u003e\u003c/span\u003e\u003cspan class=\"clip\"\u003e\u003cspan class=\"mole\"\u003e${MOLE}\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e`;\n\nfunction intro() {\n  modeTag.textContent = \u0027모드 선택\u0027;\n  scene(`\n    \u003ch1 class=\"title\"\u003e두더지 \u003cem\u003e잡기\u003c/em\u003e\u003c/h1\u003e\n    \u003cp class=\"sub\"\u003e모드를 골라 주세요.\u003c/p\u003e\n    ${peekHTML()}\n    \u003cdiv class=\"modes\"\u003e${Object.entries(MODES).map(([id, m], k) =\u003e {\n      const b = loadRecord(m.best);\n      return `\u003cbutton class=\"mode-card ${id} ${k === 0 ? \u0027wide\u0027 : \u0027\u0027}\" data-mode=\"${id}\"\u003e\n        \u003cb\u003e${m.label}\u003c/b\u003e\u003cspan\u003e${blurb(m)}\u003c/span\u003e\n        \u003csmall\u003e${b !== null ? `최고 ${b}점` : \u0027\u0026nbsp;\u0027}\u003c/small\u003e\u003c/button\u003e`;\n    }).join(\u0027\u0027)}\u003c/div\u003e\n    \u003cdiv class=\"spacer\"\u003e\u003c/div\u003e\n    ${lvBlock()}`);\n  stage.querySelectorAll(\u0027.mode-card\u0027).forEach(b =\u003e b.addEventListener(\u0027click\u0027, () =\u003e modeIntro(b.dataset.mode)));\n  stage.querySelector(\u0027.mode-card\u0027).focus();\n}\n\nfunction modeIntro(id) {\n  M = MODES[id];\n  modeTag.textContent = `${M.label} 모드`;\n  const best = loadRecord(M.best);\n  scene(`\n    \u003cbutton class=\"back\" id=\"back\"\u003e← 모드 선택\u003c/button\u003e\n    \u003ch1 class=\"title\"\u003e\u003cem\u003e${M.label}\u003c/em\u003e 모드\u003c/h1\u003e\n    \u003cul class=\"rules\"\u003e\n      \u003cli\u003e\u003cb\u003e15초\u003c/b\u003e 동안 두더지를 최대한 잡아요\u003c/li\u003e\n      \u003cli\u003e${(M.regen / 1000).toFixed(2)}초마다 1마리씩, 한 번에 \u003cb\u003e최대 ${M.max}마리\u003c/b\u003e 나와요\u003c/li\u003e\n      \u003cli\u003e두더지 \u003cb\u003e+10점\u003c/b\u003e \u003csmall\u003e(${STAY_MS.normal / 1000}초 뒤 쏙)\u003c/small\u003e\u003c/li\u003e\n      \u003cli\u003e왕관 쓴 \u003cb\u003e황금 두더지 +30점\u003c/b\u003e \u003csmall\u003e(${STAY_MS.special / 1000}초 뒤 쏙 · 10마리 중 ${M.special}마리)\u003c/small\u003e\u003c/li\u003e\n      \u003cli\u003e두더지를 놓치면 \u003cspan class=\"red\"\u003e-10점\u003c/span\u003e\u003c/li\u003e\n      \u003cli\u003e\u003cspan class=\"red\"\u003e폭탄\u003c/span\u003e을 누르면 \u003cspan class=\"red\"\u003e-50점\u003c/span\u003e \u003csmall\u003e(한 판에 ${M.traps}개)\u003c/small\u003e\u003c/li\u003e\n      \u003cli\u003e빈 구멍이나 엉뚱한 곳을 누르면 \u003cspan class=\"red\"\u003e-1점\u003c/span\u003e\u003c/li\u003e\n      \u003cli class=\"keys-only\"\u003e키보드 숫자 패드로도 잡을 수 있어요 \u003csmall\u003e(위 789 · 가운데 456 · 아래 123)\u003c/small\u003e\u003c/li\u003e\n      \u003cli\u003e얻는 EXP = \u003cspan class=\"red\"\u003e득점 × ${M.expRate}\u003c/span\u003e \u003csmall\u003e(0점 이하는 EXP·기록 없음)\u003c/small\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003cdiv class=\"spacer\"\u003e\u003c/div\u003e\n    ${lvBlock()}\n    \u003cdiv class=\"btn-row\" style=\"margin-top:18px\"\u003e\u003cbutton class=\"btn\" id=\"go\"\u003e시작하기\u003c/button\u003e\u003c/div\u003e\n    \u003cp class=\"best-line\"\u003e${best !== null ? `최고 점수 ${best}점` : \u0027아직 기록이 없어요\u0027}\u003c/p\u003e`);\n  stage.querySelector(\u0027#back\u0027).addEventListener(\u0027click\u0027, intro);\n  const go = stage.querySelector(\u0027#go\u0027);\n  go.addEventListener(\u0027click\u0027, start);\n  go.focus();\n}\n\n// ========== 플레이 ==========\n// slots[i]: null = 빈 구멍 / { type: \u0027normal\u0027 | \u0027special\u0027 | \u0027trap\u0027, bonk: 맞고 들어가는 중 }\nlet slots, bag, score, stats, t0, over, run = 0;\nconst timers = new Set();\n\n// 판이 바뀌거나 끝나면 예약해 둔 동작이 실행되지 않도록 run으로 구분\nfunction later(ms, fn) {\n  const tok = run;\n  const id = setTimeout(() =\u003e { timers.delete(id); if (tok === run \u0026\u0026 !over) fn(); }, ms);\n  timers.add(id);\n}\nfunction stopTimers() { timers.forEach(clearTimeout); timers.clear(); }\n\nfunction start() {\n  run++; stopTimers();\n  slots = Array(9).fill(null); bag = [];\n  score = 0; over = false;\n  stats = { normal: 0, special: 0, trap: 0, escaped: 0, whiff: 0 };\n  scene(`\n    \u003cdiv class=\"hud\"\u003e\n      \u003cspan class=\"clock\" id=\"clock\"\u003e\u003cb id=\"time\"\u003e15.00\u003c/b\u003e초\u003c/span\u003e\n      \u003cspan class=\"pts\"\u003e점수 \u003cb id=\"score\"\u003e0\u003c/b\u003e\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"tbar\" id=\"tbar\"\u003e\u003ci id=\"tfill\"\u003e\u003c/i\u003e\u003c/div\u003e\n    \u003cdiv class=\"field\" id=\"field\"\u003e\n      \u003cdiv class=\"grid\"\u003e${Array.from({ length: 9 }, (_, i) =\u003e `\n        \u003cbutton class=\"hole\" data-i=\"${i}\" tabindex=\"-1\" aria-label=\"${i + 1}번 구멍\"\u003e\n          \u003cspan class=\"mound\"\u003e\u003c/span\u003e\u003cspan class=\"pit\"\u003e\u003c/span\u003e\n          \u003cspan class=\"clip\"\u003e\u003cspan class=\"mole\"\u003e\u003c/span\u003e\u003c/span\u003e\n          \u003ckbd\u003e${KEYS[i]}\u003c/kbd\u003e\n        \u003c/button\u003e`).join(\u0027\u0027)}\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cp class=\"msg\" id=\"msg\"\u003e두더지를 잡아라!\u003c/p\u003e`);\n  // 잔디밭 어디를 눌러도 판정 (나와 있는 게 없으면 헛방)\n  stage.querySelector(\u0027#field\u0027).addEventListener(\u0027pointerdown\u0027, e =\u003e {\n    e.preventDefault();\n    const h = e.target.closest(\u0027.hole\u0027);\n    whack(h ? +h.dataset.i : -1);\n  });\n  onKeys(e =\u003e { const i = KEYS.indexOf(e.key); if (i \u003e= 0) whack(i); });\n  t0 = performance.now();\n  requestAnimationFrame(tick);\n  show(nextType());\n  later(M.regen, regen);\n  scheduleTraps();\n}\n\nconst holeEl = i =\u003e stage.querySelectorAll(\u0027.hole\u0027)[i];\nconst say = text =\u003e { stage.querySelector(\u0027#msg\u0027).textContent = text; };\n// 함정과 맞고 들어가는 중인 두더지는 세지 않음\nconst moleCount = () =\u003e slots.filter(s =\u003e s \u0026\u0026 s.type !== \u0027trap\u0027 \u0026\u0026 !s.bonk).length;\n\n// 테트리스 가방: 10마리마다 황금 두더지가 정확히 n마리, 순서만 섞음\nfunction nextType() {\n  if (!bag.length) {\n    bag = Array.from({ length: 10 }, (_, k) =\u003e k \u003c M.special ? \u0027special\u0027 : \u0027normal\u0027);\n    for (let k = bag.length - 1; k \u003e 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [bag[k], bag[j]] = [bag[j], bag[k]]; }\n  }\n  return bag.pop();\n}\n\n// 빈 구멍 하나에 등장 (빈 구멍이 없으면 false)\nfunction show(type) {\n  const free = slots.flatMap((s, i) =\u003e s ? [] : [i]);\n  if (!free.length) return false;\n  const i = free[Math.floor(Math.random() * free.length)];\n  const s = { type, bonk: false };\n  slots[i] = s;\n  const h = holeEl(i);\n  h.querySelector(\u0027.mole\u0027).innerHTML = type === \u0027trap\u0027 ? BOMB : MOLE;\n  h.className = `hole ${type}`;\n  void h.offsetWidth;\n  h.classList.add(\u0027up\u0027);\n  later(STAY_MS[type], () =\u003e { if (slots[i] === s \u0026\u0026 !s.bonk) leave(i); });\n  return true;\n}\n\n// 시간이 지나 쏙 들어감 (두더지면 도망 페널티, 폭탄은 그냥 사라짐)\nfunction leave(i) {\n  const s = slots[i];\n  const h = holeEl(i);\n  slots[i] = null;\n  h.classList.remove(\u0027up\u0027);\n  if (s.type === \u0027trap\u0027) return;\n  stats.escaped++;\n  score += ESCAPE_PTS;\n  bump();\n  popText(h, String(ESCAPE_PTS), \u0027minus\u0027);\n  say(`도망갔다! ${ESCAPE_PTS}`);\n  refill();\n}\n\n// 나와 있는 두더지가 하나도 없으면 쿨타임을 기다리지 않고 바로 1마리\nfunction refill() { if (moleCount() === 0) show(nextType()); }\n\n// 스폰 쿨타임마다 1마리 (최대 수면 건너뜀)\nfunction regen() {\n  if (moleCount() \u003c M.max) show(nextType());\n  later(M.regen, regen);\n}\n\n// 폭탄은 두더지 스폰과 따로: 한 판에 정해진 개수를 무작위 시각에 (끝나기 전에 들어가도록)\nfunction scheduleTraps() {\n  for (let k = 0; k \u003c M.traps; k++) later(500 + Math.random() * (LIMIT * 1000 - STAY_MS.trap - 700), trap);\n}\nfunction trap() { if (!show(\u0027trap\u0027)) later(150, trap); }\n\nfunction whack(i) {\n  if (over) return;\n  const s = i \u003e= 0 ? slots[i] : null;\n  if (s \u0026\u0026 s.bonk) return;\n  if (!s) { whiff(i); return; }\n\n  const h = holeEl(i);\n  s.bonk = true;\n  stats[s.type]++;\n  score += PTS[s.type];\n  bump();\n  if (s.type === \u0027trap\u0027) {\n    h.classList.remove(\u0027up\u0027);\n    const b = document.createElement(\u0027span\u0027);\n    b.className = \u0027boom\u0027;\n    h.appendChild(b);\n    b.addEventListener(\u0027animationend\u0027, () =\u003e b.remove());\n    popText(h, \u0027-50\u0027, \u0027minus\u0027);\n    say(\u0027펑! 폭탄이었다 -50\u0027);\n  } else if (s.type === \u0027special\u0027) {\n    h.classList.add(\u0027bonk\u0027);\n    popText(h, \u0027+30\u0027, \u0027gold\u0027);\n    say(\u0027황금 두더지! +30\u0027);\n  } else {\n    h.classList.add(\u0027bonk\u0027);\n    popText(h, \u0027+10\u0027, \u0027hit\u0027);\n    say([\u0027퍽!\u0027, \u0027잡았다!\u0027, \u0027나이스!\u0027, \u0027좋아요!\u0027][stats.normal % 4]);\n  }\n  later(BONK_MS, () =\u003e { if (slots[i] === s) { slots[i] = null; h.classList.remove(\u0027up\u0027); } });\n  refill();\n}\n\n// 헛방: -1점 (스턴 없음), 잔디밭이 살짝 흔들림\nfunction whiff(i) {\n  stats.whiff++;\n  score += WHIFF_PTS;\n  bump();\n  const field = stage.querySelector(\u0027#field\u0027);\n  popText(i \u003e= 0 ? holeEl(i) : field, String(WHIFF_PTS), \u0027minus\u0027);\n  field.classList.remove(\u0027miss\u0027); void field.offsetWidth; field.classList.add(\u0027miss\u0027);\n  say(`헛방! ${WHIFF_PTS}`);\n}\n\nfunction popText(h, text, cls) {\n  const p = document.createElement(\u0027span\u0027);\n  p.className = `pop ${cls}`;\n  p.textContent = text;\n  h.appendChild(p);\n  p.addEventListener(\u0027animationend\u0027, () =\u003e p.remove());\n}\n\nfunction bump() {\n  const el = stage.querySelector(\u0027#score\u0027);\n  el.textContent = score;\n  el.classList.remove(\u0027bump\u0027); void el.offsetWidth; el.classList.add(\u0027bump\u0027);\n}\n\nfunction tick(now) {\n  const timeEl = stage.querySelector(\u0027#time\u0027);\n  if (!timeEl || over) return;\n  const left = Math.max(0, LIMIT - (now - t0) / 1000);\n  timeEl.textContent = left.toFixed(2);\n  stage.querySelector(\u0027#tfill\u0027).style.width = (left / LIMIT * 100) + \u0027%\u0027;\n  stage.querySelector(\u0027#clock\u0027).classList.toggle(\u0027low\u0027, left \u003c 5);\n  stage.querySelector(\u0027#tbar\u0027).classList.toggle(\u0027low\u0027, left \u003c 5);\n  if (left \u003c= 0) { end(); return; }\n  requestAnimationFrame(tick);\n}\n\nfunction end() {\n  over = true;\n  stopTimers();\n  stage.querySelector(\u0027#field\u0027).classList.add(\u0027over\u0027);\n  stage.querySelectorAll(\u0027.hole\u0027).forEach(h =\u003e h.classList.remove(\u0027up\u0027));\n  stage.querySelector(\u0027#msg\u0027).innerHTML = \u0027\u003cspan class=\"end\"\u003e그만!\u003c/span\u003e\u0027;\n  const tok = run;\n  setTimeout(() =\u003e { if (tok === run \u0026\u0026 stage.querySelector(\u0027#field\u0027)) finish(); }, 900);\n}\n\n// ---------- 결과 ----------\nfunction finish() {\n  const best = loadRecord(M.best);\n  const isBest = score \u003e 0 \u0026\u0026 (best === null || score \u003e best);\n  if (isBest) { try { localStorage.setItem(M.best, String(score)); } catch {} }\n\n  // 폭탄 때문에 득점이 0 이하일 수 있음 → EXP 없음\n  const gain = Math.max(0, score) * M.expRate;\n  const before = { game: loadLv(GAME.lvKey), all: loadLv() };\n  const change = giveExp(GAME.lvKey, gain);\n  scene(`\n    \u003cdiv class=\"final\"\u003e\n      \u003cdiv class=\"lbl\"\u003e${M.label} 모드 · 15초 득점\u003c/div\u003e\n      \u003cdiv class=\"score\"\u003e${score}\u003csmall\u003e점\u003c/small\u003e\u003c/div\u003e\n      \u003cdiv class=\"stats\"\u003e\n        \u003cspan\u003e두더지 \u003cb\u003e${stats.normal}\u003c/b\u003e\u003c/span\u003e\u003cspan\u003e황금 \u003cb\u003e${stats.special}\u003c/b\u003e\u003c/span\u003e\u003cspan\u003e폭탄 \u003cb\u003e${stats.trap}\u003c/b\u003e\u003c/span\u003e\n        \u003cspan\u003e놓침 \u003cb\u003e${stats.escaped}\u003c/b\u003e\u003c/span\u003e\u003cspan\u003e헛방 \u003cb\u003e${stats.whiff}\u003c/b\u003e\u003c/span\u003e\n      \u003c/div\u003e\n      ${isBest ? \u0027\u003cspan class=\"new-best\"\u003e최고 기록!\u003c/span\u003e\u0027 : best !== null ? `\u003cp class=\"best-line\" style=\"margin-top:8px\"\u003e최고 점수 ${best}점\u003c/p\u003e` : \u0027\u0027}\n    \u003c/div\u003e\n    \u003cdiv class=\"exp-gain\"\u003e\u003cmark\u003e+${fmt(gain)} EXP\u003c/mark\u003e\u003c/div\u003e\n    \u003cp class=\"exp-calc\"\u003e${score \u003e 0 ? `득점 ${score} × ${M.expRate}` : \u0027득점이 0점 이하라 EXP가 없어요\u0027}\u003c/p\u003e\n    ${lvHTML(before.game, \u0027lv-game\u0027, GAME.title)}${lvHTML(before.all, \u0027lv-all\u0027, \u0027전체\u0027, true)}\n    \u003cdiv class=\"spacer\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"btn-row\"\u003e\n      \u003cbutton class=\"btn\" id=\"again\"\u003e한 번 더\u003c/button\u003e\n      \u003cbutton class=\"btn ghost\" id=\"modes\"\u003e모드 선택\u003c/button\u003e\n    \u003c/div\u003e`);\n  const again = stage.querySelector(\u0027#again\u0027);\n  const modes = stage.querySelector(\u0027#modes\u0027);\n  again.addEventListener(\u0027click\u0027, start);\n  modes.addEventListener(\u0027click\u0027, intro);\n  // 연타하던 손가락·키로 바로 재시작되지 않도록 잠깐 막음\n  again.disabled = modes.disabled = true;\n  setTimeout(() =\u003e { again.disabled = modes.disabled = false; again.focus(); }, 700);\n  playAllExp(change);\n}\n\n\nintro();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","games/rps.html":"\u003c!doctype html\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"\u003e\n\u003ctitle\u003e가위바위보\u003c/title\u003e\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700\u0026family=Nanum+Pen+Script\u0026display=swap\" rel=\"stylesheet\"\u003e\n\u003cstyle\u003e\n  /* 손그림 종이 놀이 — 책상 위 공책 + 볼펜 낙서 + 빨간 펜 채점 */\n  :root {\n    --desk: #E2D2B2;    --desk-d: #CDB98F;\n    --paper: #FFFEF7;   --rule: #C9DCEF;   --margin: #F1A7A0;\n    --ink: #27314F;     --ink-soft: #5F6782; --ink-faint: #9AA0B4;\n    --red: #DE3E2E;     --hl: #FFE27A;     --hl-blue: #BFE6FF;\n    --hand: \"Gaegu\", \"Nanum Pen Script\", \"Comic Sans MS\", cursive;\n    --pen: \"Nanum Pen Script\", \"Gaegu\", cursive;\n    --wobble: 255px 14px 225px 16px / 16px 225px 14px 255px;\n    --ease-out: cubic-bezier(.16, 1, .3, 1);\n    --pop: cubic-bezier(.34, 1.56, .64, 1);\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; }\n  body {\n    min-height: 100vh; min-height: 100dvh;\n    display: grid; place-items: center;\n    padding: 24px 16px;\n    font-family: var(--hand); color: var(--ink);\n    background:\n      repeating-linear-gradient(92deg, transparent 0 46px, rgba(120,90,40,.05) 46px 48px),\n      repeating-linear-gradient(88deg, transparent 0 120px, rgba(120,90,40,.04) 120px 123px),\n      var(--desk);\n    user-select: none; -webkit-user-select: none;\n    -webkit-tap-highlight-color: transparent; touch-action: manipulation;\n  }\n  ::selection { background: var(--hl); }\n\n  /* ---------- 공책 한 장 ---------- */\n  .page {\n    position: relative; width: 100%; max-width: 440px;\n    padding: 18px 20px 24px 46px;\n    background:\n      linear-gradient(90deg, transparent 33px, var(--margin) 33px 35px, transparent 35px),\n      repeating-linear-gradient(180deg, transparent 0 31px, var(--rule) 31px 32px) 0 14px,\n      var(--paper);\n    border-radius: 4px 6px 6px 4px;\n    box-shadow: 0 1px 0 #EDE6D3, 0 2px 0 #fff, 0 3px 0 #E7DFC9, 0 18px 36px rgba(70,50,20,.25);\n    transform: rotate(-.6deg);\n  }\n  /* 스프링 구멍 */\n  .page::before {\n    content: \"\"; position: absolute; left: 10px; top: 26px; bottom: 26px; width: 12px;\n    background: radial-gradient(circle, var(--desk-d) 4.5px, transparent 5px) 0 0 / 12px 44px repeat-y;\n  }\n  .pg-head { display: flex; align-items: center; justify-content: space-between; height: 30px; }\n  .home {\n    font: 700 18px/1 var(--hand); color: var(--ink-soft); text-decoration: none;\n    padding: 4px 8px; margin-left: -8px; border-radius: 6px;\n  }\n  .home:hover { color: var(--ink); background: var(--hl-blue); }\n  .home:focus-visible { outline: 2px dashed var(--ink); outline-offset: 2px; }\n  .mode {\n    font: 700 16px/1 var(--hand); padding: 4px 10px 3px;\n    border: 2px solid var(--ink); border-radius: var(--wobble); transform: rotate(2deg);\n  }\n\n  #stage { min-height: 560px; display: flex; flex-direction: column; }\n  .scene { flex: 1; display: flex; flex-direction: column; animation: turn .4s var(--ease-out) both; }\n  @keyframes turn { from { opacity: 0; transform: translateY(14px); } }\n\n  h1.title { margin: 14px 0 0; font: 400 64px/1 var(--pen); letter-spacing: .02em; }\n  h1.title mark { background: linear-gradient(transparent 55%, var(--hl) 55% 90%, transparent 90%); color: inherit; padding: 0 4px; }\n  .sub { margin: 6px 0 0; font-size: 19px; color: var(--ink-soft); line-height: 1.3; }\n\n  .doodle { display: block; width: 100%; height: 100%; overflow: visible; }\n  .doodle .ln { fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }\n  .doodle .fl { stroke: var(--ink); stroke-width: 3.2; stroke-linejoin: round; }\n  .rough { filter: url(#rough); }\n\n  .trio { display: flex; justify-content: center; gap: 22px; margin: 18px 0 6px; }\n  .trio span { width: 76px; height: 76px; }\n  .trio span:nth-child(1) { transform: rotate(-8deg); }\n  .trio span:nth-child(3) { transform: rotate(7deg); }\n\n  /* 규칙 = 공책 줄에 맞춘 메모 */\n  .rules { list-style: none; margin: 10px 0 0; padding: 0; font-size: 19px; line-height: 32px; }\n  .rules li { position: relative; padding-left: 18px; }\n  .rules li::before { content: \"-\"; position: absolute; left: 2px; color: var(--ink-soft); }\n  .rules b { font-weight: 700; background: linear-gradient(transparent 60%, var(--hl) 60% 92%, transparent 92%); }\n  .rules small { font-size: 16px; color: var(--ink-soft); }\n  .rules .red { color: var(--red); font-weight: 700; }\n\n  /* ---------- 버튼 (손으로 그린 테두리) ---------- */\n  .pen-btn {\n    display: inline-flex; align-items: center; justify-content: center; gap: 8px;\n    font: 700 24px/1 var(--hand); color: var(--ink);\n    padding: 12px 26px 10px; cursor: pointer;\n    background: var(--paper); border: 3px solid var(--ink); border-radius: var(--wobble);\n    box-shadow: 3px 4px 0 var(--ink);\n    transition: transform .08s, box-shadow .08s, background .15s;\n  }\n  .pen-btn:hover { background: var(--hl); }\n  .pen-btn:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--ink); }\n  .pen-btn:focus-visible, .pick:focus-visible { outline: 2px dashed var(--red); outline-offset: 4px; }\n  .pen-btn.ghost { box-shadow: none; border-style: dashed; }\n  .btn-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }\n  .spacer { flex: 1; min-height: 14px; }\n  .best-line { margin: 10px 0 0; text-align: center; font-size: 17px; color: var(--ink-soft); }\n\n  /* ---------- 점수표 ---------- */\n  .sheet {\n    display: grid; grid-template-columns: repeat(10, 1fr);\n    margin: 10px 0 0; border: 2.5px solid var(--ink); border-radius: var(--wobble);\n    background: rgba(255,255,255,.6);\n  }\n  .cell { position: relative; display: flex; flex-direction: column; align-items: center; padding: 3px 0 4px; min-width: 0; }\n  .cell + .cell { border-left: 1.5px dashed var(--ink-faint); }\n  .cell .no { font-size: 14px; line-height: 1; color: var(--ink-faint); }\n  .cell .mk { width: 26px; height: 26px; margin: 2px 0 1px; }\n  .cell .pt { font-size: 13px; line-height: 1; height: 13px; color: var(--red); font-variant-numeric: tabular-nums; }\n  .cell.now { background: linear-gradient(transparent 70%, var(--hl) 70%); }\n  .mk path { fill: none; stroke: var(--red); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }\n  .mk.draw-in path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .35s ease-out forwards; }\n  @keyframes draw { to { stroke-dashoffset: 0; } }\n\n  .tally { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 8px 2px 0; font-size: 18px; color: var(--ink-soft); }\n  .tally b { color: var(--ink); font-size: 22px; font-variant-numeric: tabular-nums; }\n  .tally .total b { font-size: 30px; color: var(--red); }\n  .tally .bump { display: inline-block; animation: bump .4s var(--pop); }\n  @keyframes bump { 40% { transform: scale(1.35) rotate(-4deg); } }\n\n  /* ---------- 대결 ---------- */\n  .arena { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 14px 0 0; }\n  .side { display: flex; flex-direction: column; align-items: center; gap: 2px; }\n  .who { font-size: 18px; color: var(--ink-soft); }\n  .hand { width: 118px; height: 118px; display: grid; place-items: center; }\n  .hand.cpu-q { font: 400 92px/1 var(--pen); color: var(--ink-faint); }\n  .hand.shake { animation: shake .5s ease-in-out; }\n  @keyframes shake { 0%, 50%, 100% { transform: translateY(0) rotate(0); } 25%, 75% { transform: translateY(-14px) rotate(-6deg); } }\n  .hand.reveal { animation: reveal .35s var(--pop); }\n  @keyframes reveal { from { transform: scale(.6) rotate(-12deg); opacity: 0; } }\n  .hand.lost { opacity: .45; }\n  .vs { font: 400 40px/1 var(--pen); color: var(--red); transform: rotate(-8deg); padding: 0 6px; }\n\n  .verdict { position: relative; min-height: 86px; margin: 4px 0 0; text-align: center; }\n  .verdict .big { position: relative; display: inline-block; font: 400 46px/1.1 var(--pen); }\n  .verdict .big.win { color: var(--red); }\n  .verdict .big.win::after {\n    /* 빨간 펜 동그라미 (글자 크기에 맞춰 둘러쌈) */\n    content: \"\"; position: absolute; inset: -5px -18px -3px;\n    border: 3px solid var(--red); border-radius: 50% 48% 52% 46% / 56% 50% 50% 44%;\n    transform: rotate(-4deg); pointer-events: none;\n  }\n  .verdict .big.lose { color: var(--ink-soft); }\n  .verdict .calc { display: block; margin-top: 8px; font-size: 17px; color: var(--ink-soft); }\n  .verdict .stamp { animation: stamp .35s var(--pop) both; }\n  @keyframes stamp { from { opacity: 0; transform: scale(1.5) rotate(-6deg); } }\n\n  .picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 10px 0 0; }\n  .pick {\n    display: flex; flex-direction: column; align-items: center; gap: 2px;\n    padding: 10px 4px 8px; cursor: pointer;\n    background: var(--paper); border: 3px solid var(--ink); border-radius: var(--wobble);\n    box-shadow: 3px 4px 0 var(--ink);\n    font: 700 22px/1 var(--hand); color: var(--ink);\n    transition: transform .08s, box-shadow .08s, background .15s;\n  }\n  .pick:nth-child(2) { border-radius: 16px 225px 14px 255px / 225px 14px 255px 16px; }\n  .pick span { width: 62px; height: 62px; }\n
